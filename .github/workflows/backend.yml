name: Backend

# Zet de Bingr-accounts in Supabase klaar: tabel (supabase/schema.sql), e-mailtemplates (supabase/templates) en de Edge Functions
# device-auth (accounts, tv-koppeling), web-proxy (webspeler), status (bingr.online/status), support (support.bingr.online) en push
# (pushmeldingen), newsletter (nieuwsbrief) en title-meta (openbare deelpreview van bingr.online/titel/). De functie admin (beheer-dashboard)
# staat in de privé-repo LRvdLinden/bingr-beheer en wordt daar gedeployd; deze workflow raakt of verwijdert hem nooit.
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) en SUPABASE_PROJECT_REF (bv. abcd1234 uit https://abcd1234.supabase.co).
# Mail (optioneel, ook gebruikt door admin): BINGR_SMTP_HOST, BINGR_SMTP_PORT (465), BINGR_SMTP_USER,
# BINGR_SMTP_PASSWORD, BINGR_SMTP_FROM. Alleen gezette secrets worden doorgezet; waarden komen nooit in de repo of het log.
# Status (optioneel): BINGR_ALERT_EMAIL (storingsmeldingen per e-mail, via de SMTP hierboven), BINGR_GITHUB_TOKEN (alleen-lezen
# token tegen de GitHub-limiet; zonder token valt de controle terug op de webpagina), STATUS_CRON_SECRET (vast geheim voor
# de planning; zonder dit secret maakt elke deploy een nieuw geheim en zet het de pg_cron-taak opnieuw klaar).
# Support (optioneel): BINGR_SUPPORT_FROM (afzender, standaard "Bingr Support <support@bingr.online>") en BINGR_SUPPORT_EMAIL
# (meldingen van nieuwe tickets en reacties, standaard support@bingr.online). Het geheim SUPPORT_ADMIN_SECRET (waarmee de functie
# admin uit bingr-beheer de supporttickets beheert) maakt deze workflow één keer zelf aan; het staat nooit in de repo of het log.
# Support per e-mail (optioneel): BINGR_IMAP_HOST (IMAP-server van de mailbox support@, meestal dezelfde host als SMTP),
# BINGR_IMAP_PORT (993, IMAP over TLS), BINGR_IMAP_USER (support@bingr.online), BINGR_IMAP_PASSWORD, en BINGR_SUPPORT_AGENTS
# (komma's: eigen adressen die per mail als Bingr Support mogen antwoorden). De pg_cron-taak bingr-support-inbox haalt elke
# 5 minuten de nieuwe mails op (functie support, actie poll_inbox) met het geheim SUPPORT_CRON_SECRET: vast (repo-secret) of
# per deploy nieuw, net als STATUS_CRON_SECRET. Zonder BINGR_IMAP_* wordt de taak niet ingepland (build 95).
# build 95: een antwoord van een agent telt alleen met DKIM van zijn domein in de bovenste Authentication-Results van onze
# mailserver. BINGR_SUPPORT_AUTHSERV (optioneel, komma's): de naam waaronder die server tekent (authserv-id, bv. mx.google.com);
# zonder dit secret wordt hij afgeleid van BINGR_IMAP_HOST (imap.hoster.nl -> hoster.nl en *.hoster.nl).
# build 95: de pg_cron-taak bingr-support-cleanup ruimt dagelijks op (AVG: gesloten tickets na 24 maanden, ip_hash na 30 dagen,
# captcha-salts, cron.job_run_details na 7 dagen); zie bingr_support_cleanup in supabase/schema.sql.
# Pushmeldingen (docs/PUSH.md, functie push): APNS_KEY_P8 (inhoud van de .p8), APNS_KEY_ID, APNS_TEAM_ID, APNS_TOPIC,
# BEHEER_APNS_TOPIC (optioneel; beheer-app, standaard nl.lrvdlinden.bingr.beheer),
# FCM_SERVICE_ACCOUNT (JSON van het Firebase-serviceaccount), FCM_PROJECT_ID en optioneel PUSH_RELEASE_SECRET (zelfde waarde als in
# bingr-beheer, voor de releasemelding uit de workflow Builds) worden doorgezet als ze bestaan; ontbreken ze: waarschuwing.
# PUSH_ADMIN_SECRET en het VAPID-sleutelpaar maakt deze workflow één keer zelf aan; PUSH_CRON_SECRET (optioneel vast) zoals
# STATUS_CRON_SECRET. De pg_cron-taak bingr-push roept elke minuut push/cron aan, bingr-push-cleanup ruimt dagelijks op.
# Nieuwsbrief (docs/NEWSLETTER.md, functie newsletter): NEWSLETTER_ADMIN_SECRET (voor het beheer) maakt deze workflow één keer
# zelf aan; NEWSLETTER_CRON_SECRET (optioneel vast) zoals STATUS_CRON_SECRET; BINGR_NEWSLETTER_FROM (optioneel, standaard
# "Bingr <noreply@bingr.online>"). De pg_cron-taak bingr-newsletter roept elk uur (minuut 0) newsletter/cron aan; de functie
# verstuurt alleen zo 09:00 en wo 18:00 Amsterdamse tijd en alleen als de nieuwsbrief in het beheer aan staat (standaard uit).
# Welkomstmail (zelfde functie): de pg_cron-taak bingr-welcome roept elke 5 minuten newsletter/welcome_cron aan (los van aan/uit).
# Betalen (build 133, job billing): functies billing en stripe-webhook; GitHub-secrets STRIPE_SECRET_KEY (zonder: betalen uit),
# optioneel STRIPE_WEBHOOK_SECRET en STRIPE_AUTOMATIC_TAX. Het webhook-endpoint in Stripe zet de job zelf klaar.
# Nepaccounts (build 134, geen secrets nodig): Auth-hook bingr_before_user_created (limiet per netwerk, wegwerpadressen, namen),
# lijst met wegwerpdomeinen (vaste commit + sha256), strengere Auth-limieten en de pg_cron-taak bingr-unconfirmed-cleanup;
# unittests op de Postgres van de runner (supabase/tests) en job registratie (end-to-end).
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      verify_scheduler:
        description: 'Wachten tot de planning (pg_cron) de statuscontrole zelf heeft uitgevoerd (max. 7 min)'
        type: boolean
        default: false

# nooit twee deploys tegelijk: elke deploy zet het statusgeheim en de pg_cron-taak samen klaar
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unittests (statistieken)
        run: deno test supabase/functions/device-auth/stats_test.ts supabase/functions/device-auth/naming_test.ts supabase/functions/device-auth/password_test.ts supabase/functions/_shared/ban_test.ts supabase/functions/web-proxy/ip_test.ts
      - name: Unittests (pushmeldingen)
        # blokkeert de deploy: JWT (APNs/FCM/VAPID), Web Push-versleuteling (RFC 8291-testvector), payloads, taal, dedup,
        # en de meldingen naar de beheer-app (teksten, samenvatten, statusovergangen, watermerken, topic)
        run: deno test supabase/functions/push/push_test.ts supabase/functions/push/beheer_test.ts
      - name: Unittests (nieuwsbrief)
        # blokkeert de deploy: zo 09:00 / wo 18:00 Europe/Amsterdam (zomer- en wintertijd), editiesleutels, ontdubbelen,
        # HTML (escapen van TMDB-tekst), universele links, afmeldtoken, TMDB v3/v4
        # en de welkomstmail (opbouw, escapen, aanhef, links, selectie, eerste uitrol)
        run: deno test supabase/functions/newsletter/newsletter_test.ts supabase/functions/newsletter/welcome_test.ts
      - name: Unittests (deelpreview)
        # blokkeert de deploy: validatie (type/id/q/y), TMDB-antwoord -> metadata (nl met terugval en, afbeeldingen), limiet
        run: deno test supabase/functions/title-meta/title_meta_test.ts
      - name: Unittests (betalen)
        # build 133, blokkeert de deploy: Stripe-handtekening (HMAC-SHA256, 5 min), Checkout-opbouw, events -> Lifetime /
        # terugbetaling / chargeback, idempotentie (nep-database)
        run: deno test supabase/functions/_shared/billing_test.ts
      - name: Unittests (statuspagina)
        continue-on-error: true
        run: |
          deno test --allow-all supabase/functions/status/status_test.ts supabase/functions/status/notices_test.ts > status-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>|AssertionError|Values are not equal|actual|expected" status-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Unittests (supporttickets)
        continue-on-error: true
        run: |
          deno test --allow-net=127.0.0.1 supabase/functions/support/support_test.ts supabase/functions/support/inbox_test.ts > support-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>|verwacht|niet waar" support-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Unittests (e-mailhuisstijl)
        continue-on-error: true
        run: |
          deno test supabase/functions/_shared/layout_test.ts > layout-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>" layout-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Unittests (abonnementen)
        continue-on-error: true
        run: |
          deno test supabase/functions/_shared/plans_test.ts > plans-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>|verwacht" plans-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Unittests (registratiebescherming)
        # blokkeert de deploy (build 134): de hook bingr_before_user_created, IP-hash, wegwerpdomeinen, naamregel, opruimen van
        # onbevestigde accounts en de beheertellingen, in een tijdelijke database op de Postgres van de runner (geen Supabase).
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -q && break; sleep 1; done
          sudo -u postgres bash supabase/tests/signup_guard_test.sh
      - name: Controleren
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN of SUPABASE_PROJECT_REF ontbreekt — backend niet bijgewerkt."; echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - name: Database-schema
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/schema.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/r.txt; echo; [ "$code" -lt 300 ] || { echo "::error::Schema mislukt (HTTP $code)"; exit 1; }
      - name: Registratiebescherming - wegwerpdomeinen, hook en limieten
        # build 134 (docs/ACCOUNT.md, "Bescherming tegen nepaccounts"): 1. de lijst met wegwerpdomeinen van
        # github.com/disposable-email-domains/disposable-email-domains, vast op een commit en gecontroleerd met sha256, in
        # public.disposable_domains (source 'list'; de eigen lijst uit schema.sql blijft staan). Lukt het downloaden niet, dan
        # blijft de vorige lijst staan (waarschuwing). 2. Auth: de hook Before User Created aan (pg-functions://…/bingr_before_user_created),
        # bevestigen per e-mail verplicht (mailer_autoconfirm false), rate_limit_email_sent max. 30 per uur en rate_limit_otp
        # (aanmelden, wachtwoord vergeten, opnieuw sturen, gebruiker wijzigen; per IP per 5 minuten) max. 10. Strengere bestaande
        # waarden blijven. 3. pg_cron-taak bingr-unconfirmed-cleanup (elk uur): onbevestigde accounts na 48 uur weg. Alleen
        # "ingesteld" in het log, geen configuratie of serverantwoorden.
        if: steps.check.outputs.skip != '1'
        env:
          DEA_COMMIT: c619f0a1e359b880ac9d442bb37d22b8391ba12f
          DEA_SHA256: 2a8f3d0ae32228c081d5ff90e8021a9ccb0a4348f96872c511f4b83762d87dde
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]
          API = f"https://api.supabase.com/v1/projects/{REF}"
          def req(method, url, body=None):
              h = {"Authorization": f"Bearer {MGMT}", "Content-Type": "application/json"}
              r = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp: raw = resp.read(); code = resp.status
              except urllib.error.HTTPError as e: raw = e.read(); code = e.code
              try: return code, json.loads(raw or b"{}")
              except Exception: return code, None
          def sql(q): return req("POST", f"{API}/database/query", {"query": q})
          fail = []
          # 1. wegwerpdomeinen
          url = f"https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/{os.environ['DEA_COMMIT']}/disposable_email_blocklist.conf"
          try:
              with urllib.request.urlopen(url, timeout=60) as resp: data = resp.read()
          except Exception as e:
              data = None; print(f"::warning::Lijst met wegwerpdomeinen niet geladen ({type(e).__name__}); vorige lijst blijft staan")
          if data is not None and hashlib.sha256(data).hexdigest() != os.environ["DEA_SHA256"]:
              data = None; print("::warning::Lijst met wegwerpdomeinen: sha256 klopt niet; vorige lijst blijft staan")
          if data is not None:
              ok = re.compile(r"^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$")
              doms = sorted({l.strip().lower() for l in data.decode("utf-8", "replace").splitlines()
                             if l.strip() and not l.startswith("#") and len(l.strip()) <= 253 and ok.match(l.strip().lower())})
              if len(doms) < 1000:
                  print(f"::warning::Lijst met wegwerpdomeinen te kort ({len(doms)}); vorige lijst blijft staan")
              else:
                  arr = "'{" + ",".join(doms) + "}'::text[]"
                  code, r = sql("insert into public.disposable_domains (domain, source) select d, 'list' from unnest(" + arr + ") d on conflict (domain) do nothing;\n"
                                "delete from public.disposable_domains where source = 'list' and domain <> all (" + arr + ");\n"
                                "select count(*)::int n from public.disposable_domains;")
                  if code < 300 and isinstance(r, list) and r: print(f"::notice::Wegwerpdomeinen ingesteld: {r[0].get('n')} domeinen")
                  else: fail.append(f"wegwerpdomeinen opslaan mislukt (HTTP {code})")
          # 2. Auth: hook, bevestigen verplicht, limieten (strengere bestaande waarden blijven)
          HOOK = "pg-functions://postgres/public/bingr_before_user_created"
          code, cur = req("GET", f"{API}/config/auth")
          if code != 200 or not isinstance(cur, dict):
              fail.append(f"Auth-config niet gelezen (HTTP {code})")
          else:
              def stricter(key, want):
                  v = cur.get(key)
                  return v if isinstance(v, int) and 0 < v <= want else want
              if cur.get("mailer_autoconfirm"): print("::warning::Bevestigen per e-mail stond uit; staat nu weer aan")
              code, _ = req("PATCH", f"{API}/config/auth", {"hook_before_user_created_enabled": True,
                            "hook_before_user_created_uri": HOOK, "mailer_autoconfirm": False})
              # limieten apart: Supabase weigert rate_limit_email_sent zonder eigen SMTP; dan alleen een waarschuwing
              lc, _ = req("PATCH", f"{API}/config/auth", {"rate_limit_email_sent": stricter("rate_limit_email_sent", 30),
                          "rate_limit_otp": stricter("rate_limit_otp", 10)})
              if lc >= 300: print(f"::warning::Auth-limieten niet bijgewerkt (HTTP {lc})")
              if code >= 300: fail.append(f"Auth-config bijwerken mislukt (HTTP {code})")
              else:
                  code, now = req("GET", f"{API}/config/auth")
                  now = now if isinstance(now, dict) else {}
                  if now.get("hook_before_user_created_enabled") is not True or now.get("hook_before_user_created_uri") != HOOK:
                      fail.append("hook Before User Created staat niet aan")
                  elif now.get("mailer_autoconfirm") is not False:
                      fail.append("bevestigen per e-mail staat niet aan")
                  else:
                      print("::notice::Hook, bevestiging en limieten ingesteld")
          # 3. planning: onbevestigde accounts opruimen (elk uur)
          code, r = sql("select cron.unschedule(jobid) from cron.job where jobname = 'bingr-unconfirmed-cleanup';\n"
                        "select cron.schedule('bingr-unconfirmed-cleanup', '17 * * * *', $cmd$ select public.bingr_signup_cleanup(); $cmd$);\n"
                        "select count(*)::int n from cron.job where jobname = 'bingr-unconfirmed-cleanup' and active;")
          if code < 300 and isinstance(r, list) and r and r[0].get("n") == 1: print("::notice::Planning bingr-unconfirmed-cleanup ingesteld")
          else: print(f"::warning::pg_cron niet beschikbaar (HTTP {code}): onbevestigde accounts worden niet automatisch opgeruimd")
          for f in fail: print(f"::error::{f}")
          sys.exit(1 if fail else 0)
          PY
      - name: E-mailtemplates (Bingr-huisstijl)
        if: steps.check.outputs.skip != '1'
        run: |
          deno run --allow-read --allow-write supabase/templates/build.ts
          if grep -q "supabase\.co" supabase/templates/templates.json; then echo "::error::Templates bevatten een supabase.co-link"; exit 1; fi
          # links in de mails gaan naar bingr.online/bevestigen/; Site URL = https://bingr.online en bevestigen/ + reset/ in de
          # redirect-lijst. De bestaande lijst blijft staan (alleen ontbrekende adressen erbij), dus elke deploy geeft hetzelfde.
          curl -s -o /tmp/auth.json -w '%{http_code}' "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/auth.code || true
          python3 - <<'PY'
          import json
          cfg = json.load(open("supabase/templates/templates.json"))
          try:
              cur = json.load(open("/tmp/auth.json")) if open("/tmp/auth.code").read().strip() == "200" else None
          except Exception:
              cur = None
          if cur is None:
              print("::warning::Auth-config niet gelezen: Site URL en redirect-lijst niet gecontroleerd")
          else:
              if (cur.get("site_url") or "").rstrip("/") != "https://bingr.online":
                  cfg["site_url"] = "https://bingr.online"
                  print("::notice::Site URL was %s, wordt https://bingr.online" % (cur.get("site_url") or "(leeg)"))
              have = [u.strip() for u in (cur.get("uri_allow_list") or "").split(",") if u.strip()]
              need = [u for u in ("https://bingr.online/bevestigen/", "https://bingr.online/reset/", "https://bingr.online/reset") if u not in have]
              if need:
                  cfg["uri_allow_list"] = ",".join(have + need)
                  print("::notice::Redirect-lijst aangevuld met " + ", ".join(need))
              else:
                  print("::notice::Site URL en redirect-lijst in orde")
          json.dump(cfg, open("/tmp/auth_patch.json", "w"))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/auth_patch.json)
          rm -f /tmp/auth.json /tmp/auth.code /tmp/auth_patch.json
          [ "$code" -lt 300 ] && echo "::notice::E-mailtemplates bijgewerkt (links via bingr.online/bevestigen/)" || { head -c 400 /tmp/r.txt; echo "::error::Templates mislukt (HTTP $code)"; exit 1; }
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest
      - name: App-sleutels als function-secrets
        if: steps.check.outputs.skip != '1'
        env:
          K_TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          K_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          K_OS: ${{ secrets.OPENSUBTITLES_API_KEY }}
          K_OMDB: ${{ secrets.OMDB_API_KEY }}
          K_TMDB: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
        run: |
          : > /tmp/keys.env
          [ -n "$K_TRAKT_ID" ] && echo "BINGR_TRAKT_CLIENT_ID=$K_TRAKT_ID" >> /tmp/keys.env
          [ -n "$K_TRAKT_SECRET" ] && echo "BINGR_TRAKT_CLIENT_SECRET=$K_TRAKT_SECRET" >> /tmp/keys.env
          [ -n "$K_OS" ] && echo "BINGR_OPENSUBTITLES_API_KEY=$K_OS" >> /tmp/keys.env
          [ -n "$K_OMDB" ] && echo "BINGR_OMDB_API_KEY=$K_OMDB" >> /tmp/keys.env
          [ -n "$K_TMDB" ] && echo "BINGR_TMDB_API_KEY=$K_TMDB" >> /tmp/keys.env
          if [ -s /tmp/keys.env ]; then supabase secrets set --project-ref "$REF" --env-file /tmp/keys.env; echo "::notice::$(wc -l < /tmp/keys.env) app-sleutel(s) op de server gezet"; fi
          rm -f /tmp/keys.env
          # versleutelsleutel voor servers/afspeellijsten: alleen aanmaken als hij nog niet bestaat (nooit vervangen)
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q BINGR_SOURCES_KEY; then
            supabase secrets set --project-ref "$REF" BINGR_SOURCES_KEY="$(openssl rand -base64 32)" >/dev/null
            echo "::notice::Versleutelsleutel voor servers aangemaakt"
          fi
          # geheim tussen de functies admin (bingr-beheer) en support: alleen aanmaken als het nog niet bestaat
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q SUPPORT_ADMIN_SECRET; then
            supabase secrets set --project-ref "$REF" SUPPORT_ADMIN_SECRET="$(openssl rand -hex 32)" >/dev/null
            echo "::notice::SUPPORT_ADMIN_SECRET aangemaakt (beheer van supporttickets)"
          fi
      - name: Mail- en statusgegevens als function-secrets
        if: steps.check.outputs.skip != '1'
        env:
          S_HOST: ${{ secrets.BINGR_SMTP_HOST }}
          S_PORT: ${{ secrets.BINGR_SMTP_PORT }}
          S_USER: ${{ secrets.BINGR_SMTP_USER }}
          S_PASS: ${{ secrets.BINGR_SMTP_PASSWORD }}
          S_FROM: ${{ secrets.BINGR_SMTP_FROM }}
          S_ALERT: ${{ secrets.BINGR_ALERT_EMAIL }}
          S_GH: ${{ secrets.BINGR_GITHUB_TOKEN }}
          S_SUP_FROM: ${{ secrets.BINGR_SUPPORT_FROM }}
          S_SUP_EMAIL: ${{ secrets.BINGR_SUPPORT_EMAIL }}
          S_IMAP_HOST: ${{ secrets.BINGR_IMAP_HOST_SUPPORT || secrets.BINGR_IMAP_HOST }}
          S_IMAP_PORT: ${{ secrets.BINGR_IMAP_PORT_SUPPORT || secrets.BINGR_IMAP_PORT }}
          S_IMAP_USER: ${{ secrets.BINGR_IMAP_USER_SUPPORT || secrets.BINGR_IMAP_USER }}
          S_IMAP_PASS: ${{ secrets.BINGR_IMAP_PASSWORD_SUPPORT || secrets.BINGR_IMAP_PASSWORD }}
          S_AGENTS: ${{ secrets.BINGR_SUPPORT_AGENTS_SUPPORT || secrets.BINGR_SUPPORT_AGENTS }}
          S_AUTHSERV: ${{ secrets.BINGR_SUPPORT_AUTHSERV }}
        run: |
          # als losse argumenten (geen env-bestand), zodat tekens als # " of spaties in wachtwoorden geen probleem zijn
          args=()
          [ -n "$S_HOST" ] && args+=("BINGR_SMTP_HOST=$S_HOST")
          [ -n "$S_PORT" ] && args+=("BINGR_SMTP_PORT=$S_PORT")
          [ -n "$S_USER" ] && args+=("BINGR_SMTP_USER=$S_USER")
          [ -n "$S_PASS" ] && args+=("BINGR_SMTP_PASSWORD=$S_PASS")
          [ -n "$S_FROM" ] && args+=("BINGR_SMTP_FROM=$S_FROM")
          [ -n "$S_ALERT" ] && args+=("BINGR_ALERT_EMAIL=$S_ALERT")
          [ -n "$S_GH" ] && args+=("BINGR_GITHUB_TOKEN=$S_GH")
          [ -n "$S_SUP_FROM" ] && args+=("BINGR_SUPPORT_FROM=$S_SUP_FROM")
          [ -n "$S_SUP_EMAIL" ] && args+=("BINGR_SUPPORT_EMAIL=$S_SUP_EMAIL")
          [ -n "$S_IMAP_HOST" ] && args+=("BINGR_IMAP_HOST=$S_IMAP_HOST")
          [ -n "$S_IMAP_PORT" ] && args+=("BINGR_IMAP_PORT=$S_IMAP_PORT")
          [ -n "$S_IMAP_USER" ] && args+=("BINGR_IMAP_USER=$S_IMAP_USER")
          [ -n "$S_IMAP_PASS" ] && args+=("BINGR_IMAP_PASSWORD=$S_IMAP_PASS")
          [ -n "$S_AGENTS" ] && args+=("BINGR_SUPPORT_AGENTS=$S_AGENTS")
          [ -n "$S_AUTHSERV" ] && args+=("BINGR_SUPPORT_AUTHSERV=$S_AUTHSERV")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$REF" "${args[@]}" >/dev/null; echo "::notice::${#args[@]} mail/status-secret(s) op de server gezet"; fi
          [ -z "$S_ALERT" ] && echo "::notice::BINGR_ALERT_EMAIL ontbreekt: storingen komen alleen op de statuspagina, niet per e-mail."
          [ -n "$S_PORT" ] && { [ "$S_PORT" = 587 ] || [ "$S_PORT" = 25 ]; } && echo "::warning::Supabase blokkeert uitgaande SMTP op poort $S_PORT; gebruik 465 (SSL/TLS)."
          if [ -z "$S_IMAP_HOST" ] || [ -z "$S_IMAP_USER" ] || [ -z "$S_IMAP_PASS" ]; then
            echo "::notice::BINGR_IMAP_HOST/USER/PASSWORD ontbreken: antwoorden per e-mail komen niet in de tickets (alleen via de site)."
          else
            echo "::notice::Inbox-import aan voor $(echo "$S_IMAP_USER" | sed 's/^[^@]*/…/') op poort ${S_IMAP_PORT:-993}"
            [ -n "$S_IMAP_PORT" ] && [ "$S_IMAP_PORT" = 143 ] && echo "::warning::BINGR_IMAP_PORT 143 is zonder TLS; de functie gebruikt alleen IMAP over TLS (meestal 993)."
            [ -z "$S_AGENTS" ] && echo "::notice::BINGR_SUPPORT_AGENTS ontbreekt: alleen antwoorden vanaf het supportadres zelf gaan per mail naar de klant."
          fi
          true
      - name: Edge Function device-auth
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy device-auth --project-ref "$REF" --no-verify-jwt --use-api
      - name: Edge Function web-proxy
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy web-proxy --project-ref "$REF" --no-verify-jwt --use-api
      - name: Support-inbox - geheim
        if: steps.check.outputs.skip != '1'
        env:
          S_CRON: ${{ secrets.SUPPORT_CRON_SECRET }}
        run: |
          # geheim voor de planning van de inbox-import: vast (repo-secret) of per deploy nieuw; nooit in de repo of het log
          SECRET="${S_CRON:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::SUPPORT_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" SUPPORT_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/support_cron_secret"
          echo "::notice::SUPPORT_CRON_SECRET ${S_CRON:+(vast) }op de server gezet"
      - name: Edge Function support
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy support --project-ref "$REF" --no-verify-jwt --use-api
      - name: Support-inbox - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        env:
          S_IMAP_HOST: ${{ secrets.BINGR_IMAP_HOST_SUPPORT || secrets.BINGR_IMAP_HOST }}
          S_IMAP_USER: ${{ secrets.BINGR_IMAP_USER_SUPPORT || secrets.BINGR_IMAP_USER }}
          S_IMAP_PASS: ${{ secrets.BINGR_IMAP_PASSWORD_SUPPORT || secrets.BINGR_IMAP_PASSWORD }}
        run: |
          # build 95: de taak roept elke 5 minuten support/poll_inbox aan, en alleen als BINGR_IMAP_* gezet zijn (anders
          # wordt een bestaande taak verwijderd). Daarnaast dagelijks bingr-support-cleanup (AVG-opruiming, altijd).
          IMAP=0; [ -n "$S_IMAP_HOST" ] && [ -n "$S_IMAP_USER" ] && [ -n "$S_IMAP_PASS" ] && IMAP=1
          IMAP=$IMAP python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "support_cron_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/support', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-support-cron', '%s'), "
                 "body := '{\"action\":\"poll_inbox\",\"source\":\"cron\"}'::jsonb, timeout_milliseconds := 60000);") % (ref, sec)
          sql = "select cron.unschedule(jobid) from cron.job where jobname in ('bingr-support-inbox', 'bingr-support-cleanup');\n"
          if os.environ.get("IMAP") == "1":
              sql += "select cron.schedule('bingr-support-inbox', '*/5 * * * *', $cmd$ " + cmd + " $cmd$);\n"
          sql += ("select cron.schedule('bingr-support-cleanup', '23 3 * * *', $cmd$ select public.bingr_support_cleanup(); $cmd$);\n"
                  "select jobname, schedule, active from cron.job where jobname in ('bingr-support-inbox', 'bingr-support-cleanup') order by jobname;")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          python3 - "$code" "$IMAP" <<'PY'
          import json, sys
          code, imap = sys.argv[1], sys.argv[2] == "1"
          try: rows = json.load(open("/tmp/r.txt"))
          except Exception: rows = None
          jobs = {r.get("jobname"): r for r in rows} if isinstance(rows, list) else {}
          ok_cleanup = bool(jobs.get("bingr-support-cleanup", {}).get("active"))
          ok_inbox = bool(jobs.get("bingr-support-inbox", {}).get("active")) if imap else "bingr-support-inbox" not in jobs
          if int(code or 0) < 300 and ok_cleanup and ok_inbox:
              print("::notice::Support-planning: " + ("inbox elke 5 min" if imap else "inbox niet ingepland (BINGR_IMAP_* ontbreken)") + ", opruimen dagelijks 03:23 UTC")
          else:
              print(f"::warning::Support-planning niet gelukt (HTTP {code}): {open('/tmp/r.txt').read()[:300]}")
          PY
      - name: Statusmonitor - geheim
        if: steps.check.outputs.skip != '1'
        env:
          S_CRON: ${{ secrets.STATUS_CRON_SECRET }}
        run: |
          # geheim voor de planning en "Nu controleren": vast (repo-secret) of per deploy nieuw; nooit in de repo of het log
          SECRET="${S_CRON:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::STATUS_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" STATUS_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/status_secret"
          echo "::notice::STATUS_CRON_SECRET ${S_CRON:+(vast) }op de server gezet"
      - name: Edge Function status
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy status --project-ref "$REF" --no-verify-jwt --use-api
      - name: Statusmonitor - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        id: cron
        run: |
          # de taak roept elke 5 minuten de functie status aan; het geheim gaat alleen via de Management API naar de database
          python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "status_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/status', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-status-secret', '%s'), "
                 "body := '{\"action\":\"run\",\"source\":\"cron\"}'::jsonb, timeout_milliseconds := 60000);") % (ref, sec)
          sql = ("select cron.unschedule(jobid) from cron.job where jobname = 'bingr-status';\n"
                 "select cron.schedule('bingr-status', '*/5 * * * *', $cmd$ " + cmd + " $cmd$);\n"
                 "select jobid, jobname, schedule, active from cron.job where jobname = 'bingr-status';")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          if [ "$code" -lt 300 ] && grep -Eq '"active": ?true' /tmp/r.txt; then
            echo "::notice::Planning actief: $(cat /tmp/r.txt)"; echo "ok=1" >> $GITHUB_OUTPUT
          else
            echo "::warning::pg_cron/pg_net niet beschikbaar (HTTP $code): $(head -c 300 /tmp/r.txt)"; echo "ok=0" >> $GITHUB_OUTPUT
          fi
      - name: Pushmeldingen - geheimen
        if: steps.check.outputs.skip != '1'
        env:
          P_APNS_P8: ${{ secrets.APNS_KEY_P8 }}
          P_APNS_KID: ${{ secrets.APNS_KEY_ID }}
          P_APNS_TEAM: ${{ secrets.APNS_TEAM_ID }}
          P_APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
          P_BEHEER_TOPIC: ${{ secrets.BEHEER_APNS_TOPIC }}
          P_FCM_SA: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          P_FCM_PROJECT: ${{ secrets.FCM_PROJECT_ID }}
          P_RELEASE: ${{ secrets.PUSH_RELEASE_SECRET }}
          P_CRON: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          # docs/PUSH.md. Kanaalgeheimen alleen doorzetten als ze als GitHub-secret bestaan (ontbreekt er een: waarschuwing,
          # de functie slaat dat kanaal over en meldt het in de geschiedenis). Waarden nooit in het log.
          list=$(supabase secrets list --project-ref "$REF" 2>/dev/null || true)
          has() { grep -qw "$1" <<<"$list"; }
          args=()
          # .p8 en serviceaccount op één regel (de functie leest "\n" in de PEM-sleutel)
          [ -n "$P_APNS_P8" ] && args+=("APNS_KEY_P8=${P_APNS_P8//$'\n'/\\n}")
          [ -n "$P_APNS_KID" ] && args+=("APNS_KEY_ID=$P_APNS_KID")
          [ -n "$P_APNS_TEAM" ] && args+=("APNS_TEAM_ID=$P_APNS_TEAM")
          [ -n "$P_APNS_TOPIC" ] && args+=("APNS_TOPIC=$P_APNS_TOPIC")
          [ -n "$P_BEHEER_TOPIC" ] && args+=("BEHEER_APNS_TOPIC=$P_BEHEER_TOPIC")
          if [ -n "$P_FCM_SA" ]; then
            SA=$(printf '%s' "$P_FCM_SA" | python3 -c 'import json,sys; print(json.dumps(json.loads(sys.stdin.read()), separators=(",", ":")))' 2>/dev/null) \
              && args+=("FCM_SERVICE_ACCOUNT=$SA") || echo "::warning::FCM_SERVICE_ACCOUNT is geen geldige JSON; niet doorgezet"
          fi
          [ -n "$P_FCM_PROJECT" ] && args+=("FCM_PROJECT_ID=$P_FCM_PROJECT")
          if [ -n "$P_RELEASE" ]; then
            [ ${#P_RELEASE} -ge 16 ] && args+=("PUSH_RELEASE_SECRET=$P_RELEASE") || echo "::warning::PUSH_RELEASE_SECRET is korter dan 16 tekens; niet doorgezet"
          fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$REF" "${args[@]}" >/dev/null; echo "::notice::${#args[@]} push-secret(s) op de server gezet"; fi
          unset SA args
          { [ -n "$P_APNS_P8" ] && [ -n "$P_APNS_KID" ] && [ -n "$P_APNS_TEAM" ]; } || has APNS_KEY_P8 \
            || echo "::warning::APNS_KEY_P8/APNS_KEY_ID/APNS_TEAM_ID ontbreken: geen pushmeldingen naar iPhone, iPad en Mac."
          [ -n "$P_FCM_SA" ] || has FCM_SERVICE_ACCOUNT || echo "::warning::FCM_SERVICE_ACCOUNT ontbreekt: geen pushmeldingen naar Android."
          # geheim tussen admin (bingr-beheer) en push: alleen aanmaken als het nog niet bestaat
          if ! has PUSH_ADMIN_SECRET; then
            supabase secrets set --project-ref "$REF" PUSH_ADMIN_SECRET="$(openssl rand -hex 32)" >/dev/null
            echo "::notice::PUSH_ADMIN_SECRET aangemaakt (beheerberichten)"
          fi
          # VAPID-sleutelpaar (Web Push): alleen aanmaken als het ontbreekt; een nieuw paar maakt bestaande abonnementen ongeldig
          if ! has VAPID_PUBLIC_KEY || ! has VAPID_PRIVATE_KEY; then
            umask 077
            OUT="$RUNNER_TEMP/vapid.env" deno eval 'import { generateVapidKeys } from "./supabase/functions/push/crypto.ts";
              const k = await generateVapidKeys();
              Deno.writeTextFileSync(Deno.env.get("OUT")!, `VAPID_PRIVATE_KEY=${k.privateKey}\nVAPID_PUBLIC_KEY=${k.publicKey}\nVAPID_SUBJECT=mailto:support@bingr.online\n`);'
            supabase secrets set --project-ref "$REF" --env-file "$RUNNER_TEMP/vapid.env" >/dev/null
            rm -f "$RUNNER_TEMP/vapid.env"
            echo "::notice::VAPID-sleutelpaar aangemaakt (Web Push)"
          fi
          # geheim voor de planning (cron): vast (repo-secret) of per deploy nieuw, zoals STATUS_CRON_SECRET
          SECRET="${P_CRON:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::PUSH_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" PUSH_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/push_cron_secret"
          echo "::notice::PUSH_CRON_SECRET ${P_CRON:+(vast) }op de server gezet"
      - name: Edge Function push
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy push --project-ref "$REF" --no-verify-jwt --use-api
      - name: Pushmeldingen - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        run: |
          # elke minuut push/cron (herinneringen 2 minuten voor de start + resterende batches); dagelijks opruimen
          python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "push_cron_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/push', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-push-secret', '%s'), "
                 "body := '{\"action\":\"cron\"}'::jsonb, timeout_milliseconds := 60000);") % (ref, sec)
          sql = ("select cron.unschedule(jobid) from cron.job where jobname in ('bingr-push', 'bingr-push-cleanup');\n"
                 "select cron.schedule('bingr-push', '* * * * *', $cmd$ " + cmd + " $cmd$);\n"
                 "select cron.schedule('bingr-push-cleanup', '41 3 * * *', $cmd$ select public.bingr_push_cleanup(); $cmd$);\n"
                 "select jobname, schedule, active from cron.job where jobname in ('bingr-push', 'bingr-push-cleanup') order by jobname;")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          python3 - "$code" <<'PY'
          import json, sys
          try: rows = json.load(open("/tmp/r.txt"))
          except Exception: rows = None
          jobs = {r.get("jobname"): r for r in rows} if isinstance(rows, list) else {}
          if int(sys.argv[1] or 0) < 300 and all(jobs.get(j, {}).get("active") for j in ("bingr-push", "bingr-push-cleanup")):
              print("::notice::Push-planning: elke minuut (herinneringen en batches), opruimen dagelijks 03:41 UTC")
          else:
              print(f"::warning::Push-planning niet gelukt (HTTP {sys.argv[1]}): {open('/tmp/r.txt').read()[:300]}")
          PY
      - name: Pushmeldingen testen
        if: steps.check.outputs.skip != '1'
        run: |
          sleep 3
          F="https://$REF.supabase.co/functions/v1/push"
          J=(-H "Content-Type: application/json")
          # 1. vapid_key (zonder inloggen) geeft een publieke sleutel van 65 bytes (87 tekens base64url)
          curl -s -X POST "$F" "${J[@]}" -d '{"action":"vapid_key"}' > /tmp/v.json
          python3 -c 'import json,sys; k=json.load(open("/tmp/v.json")).get("key") or ""; sys.exit(0 if len(k) == 87 else 1)' \
            && echo "::notice::push vapid_key geeft een sleutel" || { echo "::error::push vapid_key: $(head -c 200 /tmp/v.json)"; exit 1; }
          # 2. register zonder inloggen -> 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F" "${J[@]}" -d '{"action":"register","device_id":"x","platform":"ios","channel":"apns","token":"00"}')
          [ "$code" = 401 ] && echo "::notice::push register zonder inloggen geweigerd (401)" || { echo "::error::push register zonder inloggen gaf HTTP $code"; exit 1; }
          # 3. admin_send, release en cron zonder (of met fout) geheim -> 403
          for a in admin_send admin_history release cron; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F" "${J[@]}" -H "x-push-secret: fout-geheim-0000000000000000" -d "{\"action\":\"$a\"}")
            [ "$code" = 403 ] || { echo "::error::push $a met fout geheim gaf HTTP $code"; exit 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F" "${J[@]}" -d "{\"action\":\"$a\"}")
            [ "$code" = 403 ] || { echo "::error::push $a zonder geheim gaf HTTP $code"; exit 1; }
          done
          echo "::notice::push admin_send/admin_history/release/cron zonder geheim geweigerd (403)"
          # 4. één cron-ronde met het geheim
          curl -s -X POST "$F" "${J[@]}" -H "x-push-secret: $(cat "$RUNNER_TEMP/push_cron_secret")" -d '{"action":"cron"}' > /tmp/c.json
          grep -Eq '"ok": ?true' /tmp/c.json && echo "::notice::push cron: $(cat /tmp/c.json)" || { echo "::error::push cron: $(head -c 300 /tmp/c.json)"; exit 1; }
      - name: Nieuwsbrief - geheimen
        if: steps.check.outputs.skip != '1'
        env:
          N_CRON: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          N_FROM: ${{ secrets.BINGR_NEWSLETTER_FROM }}
        run: |
          # docs/NEWSLETTER.md. Waarden nooit in het log.
          list=$(supabase secrets list --project-ref "$REF" 2>/dev/null || true)
          has() { grep -qw "$1" <<<"$list"; }
          # geheim tussen admin (bingr-beheer) en newsletter: alleen aanmaken als het nog niet bestaat
          if ! has NEWSLETTER_ADMIN_SECRET; then
            supabase secrets set --project-ref "$REF" NEWSLETTER_ADMIN_SECRET="$(openssl rand -hex 32)" >/dev/null
            echo "::notice::NEWSLETTER_ADMIN_SECRET aangemaakt (beheer van de nieuwsbrief)"
          fi
          has BINGR_TMDB_API_KEY || echo "::warning::BINGR_TMDB_API_KEY ontbreekt (GitHub-secret TMDB_API_KEY of TMDB_ACCESS_TOKEN): de nieuwsbrief heeft geen inhoud."
          if [ -n "$N_FROM" ]; then supabase secrets set --project-ref "$REF" BINGR_NEWSLETTER_FROM="$N_FROM" >/dev/null; echo "::notice::BINGR_NEWSLETTER_FROM op de server gezet"; fi
          SECRET="${N_CRON:-$(openssl rand -hex 32)}"
          SECRET=$(printf '%s' "$SECRET" | tr -d '\r\n')
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::NEWSLETTER_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" NEWSLETTER_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/newsletter_cron_secret"
          echo "::notice::NEWSLETTER_CRON_SECRET ${N_CRON:+(vast) }op de server gezet"
      - name: Edge Function newsletter
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy newsletter --project-ref "$REF" --no-verify-jwt --use-api
      - name: Nieuwsbrief - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        run: |
          # elk uur op minuut 0 newsletter/cron; de functie rekent zelf naar Europe/Amsterdam (zo 09:00, wo 18:00)
          python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "newsletter_cron_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/newsletter', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-newsletter-secret', '%s'), "
                 "body := '{\"action\":\"cron\"}'::jsonb, timeout_milliseconds := 150000);") % (ref, sec)
          # welkomstmail: elke 5 minuten (zelfde functie en geheim)
          wcmd = cmd.replace('{"action":"cron"}', '{"action":"welcome_cron"}')
          sql = ("select cron.unschedule(jobid) from cron.job where jobname in ('bingr-newsletter', 'bingr-welcome');\n"
                 "select cron.schedule('bingr-newsletter', '0 * * * *', $cmd$ " + cmd + " $cmd$);\n"
                 "select cron.schedule('bingr-welcome', '*/5 * * * *', $cmd$ " + wcmd + " $cmd$);\n"
                 "select jobname, schedule, active from cron.job where jobname in ('bingr-newsletter', 'bingr-welcome') order by jobname;")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          python3 - "$code" <<'PY'
          import json, sys
          try: rows = json.load(open("/tmp/r.txt"))
          except Exception: rows = []
          jobs = {r.get("jobname") for r in rows if isinstance(r, dict) and r.get("active")} if isinstance(rows, list) else set()
          ok = int(sys.argv[1] or 0) < 300 and {"bingr-newsletter", "bingr-welcome"} <= jobs
          print("::notice::Nieuwsbrief-planning: elk uur op minuut 0 (verstuurt zo 09:00 en wo 18:00 Amsterdam); welkomstmail elke 5 minuten" if ok
                else f"::warning::Nieuwsbrief-/welkomstplanning niet gelukt (HTTP {sys.argv[1]})")
          PY
