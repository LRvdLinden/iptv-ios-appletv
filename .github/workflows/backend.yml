name: Backend

# Zet de Bingr-accounts in Supabase klaar: tabel (supabase/schema.sql), e-mailtemplates (supabase/templates) en de Edge Functions
# device-auth (accounts, tv-koppeling), web-proxy (webspeler), status (bingr.online/status) en support (support.bingr.online). De functie admin (beheer-dashboard)
# staat in de privé-repo LRvdLinden/bingr-beheer en wordt daar gedeployd; deze workflow raakt of verwijdert hem nooit.
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) en SUPABASE_PROJECT_REF (bv. abcd1234 uit https://abcd1234.supabase.co).
# Mail (optioneel, ook gebruikt door admin): BINGR_SMTP_HOST, BINGR_SMTP_PORT (465), BINGR_SMTP_USER,
# BINGR_SMTP_PASSWORD, BINGR_SMTP_FROM. Alleen gezette secrets worden doorgezet; waarden komen nooit in de repo of het log.
# Status (optioneel): BINGR_ALERT_EMAIL (storingsmeldingen per e-mail, via de SMTP hierboven), BINGR_GITHUB_TOKEN (alleen-lezen
# token tegen de GitHub-limiet; zonder token valt de controle terug op de webpagina), STATUS_CRON_SECRET (vast geheim voor
# de planning; zonder dit secret maakt elke deploy een nieuw geheim en zet het de pg_cron-taak opnieuw klaar).
# Support (optioneel): BINGR_SUPPORT_FROM (afzender, standaard "Bingr Support <support@bingr.online>") en BINGR_SUPPORT_EMAIL
# (meldingen van nieuwe tickets en reacties, standaard support@bingr.online). Het geheim SUPPORT_ADMIN_SECRET (waarmee de functie
# admin uit bingr-beheer de supporttickets beheert) maakt deze workflow één keer zelf aan; het staat nooit in de repo of het log.
# Support per e-mail (optioneel): BINGR_IMAP_HOST (IMAP-server van de mailbox support@, meestal dezelfde host als SMTP),
# BINGR_IMAP_PORT (993, IMAP over TLS), BINGR_IMAP_USER (support@bingr.online), BINGR_IMAP_PASSWORD, en BINGR_SUPPORT_AGENTS
# (komma's: eigen adressen die per mail als Bingr Support mogen antwoorden). De pg_cron-taak bingr-support-inbox haalt elke
# 2 minuten de nieuwe mails op (functie support, actie poll_inbox) met het geheim SUPPORT_CRON_SECRET: vast (repo-secret) of
# per deploy nieuw, net als STATUS_CRON_SECRET. Zonder BINGR_IMAP_* doet de taak niets (skipped).
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      verify_scheduler:
        description: 'Wachten tot de planning (pg_cron) de statuscontrole zelf heeft uitgevoerd (max. 7 min)'
        type: boolean
        default: false

# nooit twee deploys tegelijk: elke deploy zet het statusgeheim en de pg_cron-taak samen klaar
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unittests (statistieken)
        run: deno test supabase/functions/device-auth/stats_test.ts
      - name: Unittests (statuspagina)
        continue-on-error: true
        run: |
          deno test --allow-all supabase/functions/status/status_test.ts > status-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>|AssertionError|Values are not equal|actual|expected" status-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Unittests (supporttickets)
        continue-on-error: true
        run: |
          deno test --allow-net=127.0.0.1 supabase/functions/support/support_test.ts supabase/functions/support/inbox_test.ts > support-test.log 2>&1 && exit 0
          grep -E "FAILED|error|=>|verwacht|niet waar" support-test.log | head -30 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          exit 1
      - name: Controleren
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN of SUPABASE_PROJECT_REF ontbreekt — backend niet bijgewerkt."; echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - name: Database-schema
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/schema.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/r.txt; echo; [ "$code" -lt 300 ] || { echo "::error::Schema mislukt (HTTP $code)"; exit 1; }
      - name: E-mailtemplates (Bingr-huisstijl)
        if: steps.check.outputs.skip != '1'
        run: |
          python3 supabase/templates/build.py
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @supabase/templates/templates.json)
          [ "$code" -lt 300 ] && echo "::notice::E-mailtemplates bijgewerkt" || { head -c 400 /tmp/r.txt; echo "::error::Templates mislukt (HTTP $code)"; exit 1; }
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest
      - name: App-sleutels als function-secrets
        if: steps.check.outputs.skip != '1'
        env:
          K_TRAKT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          K_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          K_OS: ${{ secrets.OPENSUBTITLES_API_KEY }}
          K_OMDB: ${{ secrets.OMDB_API_KEY }}
          K_TMDB: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
        run: |
          : > /tmp/keys.env
          [ -n "$K_TRAKT_ID" ] && echo "BINGR_TRAKT_CLIENT_ID=$K_TRAKT_ID" >> /tmp/keys.env
          [ -n "$K_TRAKT_SECRET" ] && echo "BINGR_TRAKT_CLIENT_SECRET=$K_TRAKT_SECRET" >> /tmp/keys.env
          [ -n "$K_OS" ] && echo "BINGR_OPENSUBTITLES_API_KEY=$K_OS" >> /tmp/keys.env
          [ -n "$K_OMDB" ] && echo "BINGR_OMDB_API_KEY=$K_OMDB" >> /tmp/keys.env
          [ -n "$K_TMDB" ] && echo "BINGR_TMDB_API_KEY=$K_TMDB" >> /tmp/keys.env
          if [ -s /tmp/keys.env ]; then supabase secrets set --project-ref "$REF" --env-file /tmp/keys.env; echo "::notice::$(wc -l < /tmp/keys.env) app-sleutel(s) op de server gezet"; fi
          rm -f /tmp/keys.env
          # versleutelsleutel voor servers/afspeellijsten: alleen aanmaken als hij nog niet bestaat (nooit vervangen)
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q BINGR_SOURCES_KEY; then
            supabase secrets set --project-ref "$REF" BINGR_SOURCES_KEY="$(openssl rand -base64 32)" >/dev/null
            echo "::notice::Versleutelsleutel voor servers aangemaakt"
          fi
          # geheim tussen de functies admin (bingr-beheer) en support: alleen aanmaken als het nog niet bestaat
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q SUPPORT_ADMIN_SECRET; then
            supabase secrets set --project-ref "$REF" SUPPORT_ADMIN_SECRET="$(openssl rand -hex 32)" >/dev/null
            echo "::notice::SUPPORT_ADMIN_SECRET aangemaakt (beheer van supporttickets)"
          fi
      - name: Mail- en statusgegevens als function-secrets
        if: steps.check.outputs.skip != '1'
        env:
          S_HOST: ${{ secrets.BINGR_SMTP_HOST }}
          S_PORT: ${{ secrets.BINGR_SMTP_PORT }}
          S_USER: ${{ secrets.BINGR_SMTP_USER }}
          S_PASS: ${{ secrets.BINGR_SMTP_PASSWORD }}
          S_FROM: ${{ secrets.BINGR_SMTP_FROM }}
          S_ALERT: ${{ secrets.BINGR_ALERT_EMAIL }}
          S_GH: ${{ secrets.BINGR_GITHUB_TOKEN }}
          S_SUP_FROM: ${{ secrets.BINGR_SUPPORT_FROM }}
          S_SUP_EMAIL: ${{ secrets.BINGR_SUPPORT_EMAIL }}
          S_IMAP_HOST: ${{ secrets.BINGR_IMAP_HOST }}
          S_IMAP_PORT: ${{ secrets.BINGR_IMAP_PORT }}
          S_IMAP_USER: ${{ secrets.BINGR_IMAP_USER }}
          S_IMAP_PASS: ${{ secrets.BINGR_IMAP_PASSWORD }}
          S_AGENTS: ${{ secrets.BINGR_SUPPORT_AGENTS }}
        run: |
          # als losse argumenten (geen env-bestand), zodat tekens als # " of spaties in wachtwoorden geen probleem zijn
          args=()
          [ -n "$S_HOST" ] && args+=("BINGR_SMTP_HOST=$S_HOST")
          [ -n "$S_PORT" ] && args+=("BINGR_SMTP_PORT=$S_PORT")
          [ -n "$S_USER" ] && args+=("BINGR_SMTP_USER=$S_USER")
          [ -n "$S_PASS" ] && args+=("BINGR_SMTP_PASSWORD=$S_PASS")
          [ -n "$S_FROM" ] && args+=("BINGR_SMTP_FROM=$S_FROM")
          [ -n "$S_ALERT" ] && args+=("BINGR_ALERT_EMAIL=$S_ALERT")
          [ -n "$S_GH" ] && args+=("BINGR_GITHUB_TOKEN=$S_GH")
          [ -n "$S_SUP_FROM" ] && args+=("BINGR_SUPPORT_FROM=$S_SUP_FROM")
          [ -n "$S_SUP_EMAIL" ] && args+=("BINGR_SUPPORT_EMAIL=$S_SUP_EMAIL")
          [ -n "$S_IMAP_HOST" ] && args+=("BINGR_IMAP_HOST=$S_IMAP_HOST")
          [ -n "$S_IMAP_PORT" ] && args+=("BINGR_IMAP_PORT=$S_IMAP_PORT")
          [ -n "$S_IMAP_USER" ] && args+=("BINGR_IMAP_USER=$S_IMAP_USER")
          [ -n "$S_IMAP_PASS" ] && args+=("BINGR_IMAP_PASSWORD=$S_IMAP_PASS")
          [ -n "$S_AGENTS" ] && args+=("BINGR_SUPPORT_AGENTS=$S_AGENTS")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$REF" "${args[@]}" >/dev/null; echo "::notice::${#args[@]} mail/status-secret(s) op de server gezet"; fi
          [ -z "$S_ALERT" ] && echo "::notice::BINGR_ALERT_EMAIL ontbreekt: storingen komen alleen op de statuspagina, niet per e-mail."
          [ -n "$S_PORT" ] && { [ "$S_PORT" = 587 ] || [ "$S_PORT" = 25 ]; } && echo "::warning::Supabase blokkeert uitgaande SMTP op poort $S_PORT; gebruik 465 (SSL/TLS)."
          if [ -z "$S_IMAP_HOST" ] || [ -z "$S_IMAP_USER" ] || [ -z "$S_IMAP_PASS" ]; then
            echo "::notice::BINGR_IMAP_HOST/USER/PASSWORD ontbreken: antwoorden per e-mail komen niet in de tickets (alleen via de site)."
          else
            echo "::notice::Inbox-import aan voor $(echo "$S_IMAP_USER" | sed 's/^[^@]*/…/') op poort ${S_IMAP_PORT:-993}"
            [ -n "$S_IMAP_PORT" ] && [ "$S_IMAP_PORT" = 143 ] && echo "::warning::BINGR_IMAP_PORT 143 is zonder TLS; de functie gebruikt alleen IMAP over TLS (meestal 993)."
            [ -z "$S_AGENTS" ] && echo "::notice::BINGR_SUPPORT_AGENTS ontbreekt: alleen antwoorden vanaf het supportadres zelf gaan per mail naar de klant."
          fi
          true
      - name: Edge Function device-auth
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy device-auth --project-ref "$REF" --no-verify-jwt --use-api
      - name: Edge Function web-proxy
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy web-proxy --project-ref "$REF" --no-verify-jwt --use-api
      - name: Support-inbox - geheim
        if: steps.check.outputs.skip != '1'
        env:
          S_CRON: ${{ secrets.SUPPORT_CRON_SECRET }}
        run: |
          # geheim voor de planning van de inbox-import: vast (repo-secret) of per deploy nieuw; nooit in de repo of het log
          SECRET="${S_CRON:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::SUPPORT_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" SUPPORT_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/support_cron_secret"
          echo "::notice::SUPPORT_CRON_SECRET ${S_CRON:+(vast) }op de server gezet"
      - name: Edge Function support
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy support --project-ref "$REF" --no-verify-jwt --use-api
      - name: Support-inbox - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        run: |
          # de taak roept elke 2 minuten support/poll_inbox aan (zonder BINGR_IMAP_* antwoordt die met skipped)
          python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "support_cron_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/support', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-support-cron', '%s'), "
                 "body := '{\"action\":\"poll_inbox\",\"source\":\"cron\"}'::jsonb, timeout_milliseconds := 60000);") % (ref, sec)
          sql = ("select cron.unschedule(jobid) from cron.job where jobname = 'bingr-support-inbox';\n"
                 "select cron.schedule('bingr-support-inbox', '*/2 * * * *', $cmd$ " + cmd + " $cmd$);\n"
                 "select jobid, jobname, schedule, active from cron.job where jobname = 'bingr-support-inbox';")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          if [ "$code" -lt 300 ] && grep -Eq '"active": ?true' /tmp/r.txt; then
            echo "::notice::Inbox-planning actief: $(cat /tmp/r.txt)"
          else
            echo "::warning::Inbox-planning niet gelukt (HTTP $code): $(head -c 300 /tmp/r.txt)"
          fi
      - name: Statusmonitor - geheim
        if: steps.check.outputs.skip != '1'
        env:
          S_CRON: ${{ secrets.STATUS_CRON_SECRET }}
        run: |
          # geheim voor de planning en "Nu controleren": vast (repo-secret) of per deploy nieuw; nooit in de repo of het log
          SECRET="${S_CRON:-$(openssl rand -hex 32)}"
          echo "::add-mask::$SECRET"
          [[ "$SECRET" =~ ^[A-Za-z0-9_-]{24,128}$ ]] || { echo "::error::STATUS_CRON_SECRET: 24-128 tekens, alleen letters, cijfers, - en _"; exit 1; }
          supabase secrets set --project-ref "$REF" STATUS_CRON_SECRET="$SECRET" >/dev/null
          umask 077; printf '%s' "$SECRET" > "$RUNNER_TEMP/status_secret"
          echo "::notice::STATUS_CRON_SECRET ${S_CRON:+(vast) }op de server gezet"
      - name: Edge Function status
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy status --project-ref "$REF" --no-verify-jwt --use-api
      - name: Statusmonitor - planning (pg_cron + pg_net)
        if: steps.check.outputs.skip != '1'
        id: cron
        run: |
          # de taak roept elke 5 minuten de functie status aan; het geheim gaat alleen via de Management API naar de database
          python3 - <<'PY' > /tmp/cron.json
          import json, os
          ref = os.environ["REF"]; sec = open(os.path.join(os.environ["RUNNER_TEMP"], "status_secret")).read()
          cmd = ("select net.http_post(url := 'https://%s.supabase.co/functions/v1/status', "
                 "headers := jsonb_build_object('Content-Type', 'application/json', 'x-status-secret', '%s'), "
                 "body := '{\"action\":\"run\",\"source\":\"cron\"}'::jsonb, timeout_milliseconds := 60000);") % (ref, sec)
          sql = ("select cron.unschedule(jobid) from cron.job where jobname = 'bingr-status';\n"
                 "select cron.schedule('bingr-status', '*/5 * * * *', $cmd$ " + cmd + " $cmd$);\n"
                 "select jobid, jobname, schedule, active from cron.job where jobname = 'bingr-status';")
          print(json.dumps({"query": sql}))
          PY
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/cron.json)
          rm -f /tmp/cron.json
          if [ "$code" -lt 300 ] && grep -Eq '"active": ?true' /tmp/r.txt; then
            echo "::notice::Planning actief: $(cat /tmp/r.txt)"; echo "ok=1" >> $GITHUB_OUTPUT
          else
            echo "::warning::pg_cron/pg_net niet beschikbaar (HTTP $code): $(head -c 300 /tmp/r.txt)"; echo "ok=0" >> $GITHUB_OUTPUT
          fi
      - name: Testen
        if: steps.check.outputs.skip != '1'
        run: |
          sleep 5
          curl -s -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d '{"action":"nope"}' | tee /tmp/t.txt; echo
          grep -q unknown_action /tmp/t.txt && echo "::notice::device-auth werkt" || echo "::warning::device-auth gaf een onverwacht antwoord"
          # tv-code starten en pollen (moet 'pending' geven)
          curl -s -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d '{"action":"start","device":"CI-test"}' > /tmp/s.json; cat /tmp/s.json; echo
          C=$(python3 -c 'import json;print(json.load(open("/tmp/s.json")).get("code",""))'); P=$(python3 -c 'import json;print(json.load(open("/tmp/s.json")).get("poll_secret",""))')
          [ -n "$C" ] || { echo "::error::start gaf geen code"; exit 1; }
          curl -s -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d "{\"action\":\"poll\",\"code\":\"$C\",\"poll_secret\":\"$P\"}" | tee /tmp/p.json; echo
          grep -q pending /tmp/p.json && echo "::notice::tv-koppeling (start + poll) werkt, code $C" || { echo "::error::poll gaf geen pending"; exit 1; }
          curl -s -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d '{"action":"list_devices"}' | tee /tmp/l.json; echo
          grep -q not_signed_in /tmp/l.json && echo "::notice::apparatenbeheer actief" || { echo "::error::list_devices onverwacht"; exit 1; }
          curl -s -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d '{"action":"announcements"}' | tee /tmp/a.json; echo
          grep -q not_signed_in /tmp/a.json && echo "::notice::announcements actief" || { echo "::error::announcements onverwacht"; exit 1; }
          curl -s -X POST "https://$REF.supabase.co/functions/v1/web-proxy" -H "Content-Type: application/json" -d '{"url":"https://example.com/"}' | tee /tmp/w.json; echo
          grep -q not_signed_in /tmp/w.json && echo "::notice::web-proxy actief" || { echo "::error::web-proxy onverwacht"; exit 1; }
          # build 68: kijkstatistieken (zonder inloggen 401), en de SQL-functies zelf via de Management API
          for a in watch_stats delete_watch_stats; do
            code=$(curl -s -o /tmp/ws.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d "{\"action\":\"$a\",\"period\":\"week\"}")
            cat /tmp/ws.json; echo
            [ "$code" = 401 ] && grep -q not_signed_in /tmp/ws.json && echo "::notice::$a actief (401 zonder inloggen)" || { echo "::error::$a gaf HTTP $code"; exit 1; }
          done
          python3 -c 'import json;print(json.dumps({"query":"select (select to_jsonb(i) from public.bingr_stats_item(%s) i) as item, public.bingr_watch_stats(%s) as stats" % ("$$episode$$, $$e1$$, null, null, $$Serie · S1:E2 · Naam$$", "$$00000000-0000-0000-0000-000000000000$$::uuid, null, current_date - 7, current_date, false")}))' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/sq.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/sq.json"))
          row = r[0] if isinstance(r, list) and r else None
          if not row or '"t:serie"' not in json.dumps(row["item"]) or "buckets" not in json.dumps(row["stats"]):
              print("::error::bingr_stats_item/bingr_watch_stats onverwacht:", str(r)[:400]); raise SystemExit(1)
          print("::notice::Statistieken-SQL werkt:", json.dumps(row["item"]), "| leeg account:", json.dumps(row["stats"])[:200])
          PY
          for fn in device-auth web-proxy; do
            curl -s -X POST "https://$REF.supabase.co/functions/v1/$fn" -H "Content-Type: application/json" -d '{"action":"ping"}' | tee /tmp/p.json; echo
            grep -q '"ok":true' /tmp/p.json && echo "::notice::$fn ping werkt" || { echo "::error::$fn ping onverwacht"; exit 1; }
          done
          # admin (privé-repo bingr-beheer): alleen kijken of hij er nog staat, als waarschuwing (deze workflow deployt hem niet)
          curl -s -X POST "https://$REF.supabase.co/functions/v1/admin" -H "Content-Type: application/json" -d '{"action":"status","op":"overview"}' > /tmp/b.json || true
          grep -q not_signed_in /tmp/b.json && echo "::notice::admin (bingr-beheer) staat online" || echo "::warning::admin (bingr-beheer) gaf geen not_signed_in: $(head -c 200 /tmp/b.json)"
      - name: Supporttickets testen
        if: steps.check.outputs.skip != '1'
        run: |
          F="https://$REF.supabase.co/functions/v1/support"
          sleep 3
          # 1. ping en preflight vanaf support.bingr.online
          curl -s -X POST "$F" -H "Content-Type: application/json" -d '{"action":"ping"}' | tee /tmp/p.json; echo
          grep -q '"ok":true' /tmp/p.json && echo "::notice::support ping werkt" || { echo "::error::support ping onverwacht"; exit 1; }
          acao=$(curl -s -D - -o /dev/null -X OPTIONS "$F" -H "Origin: https://support.bingr.online" -H "Access-Control-Request-Method: POST" \
            | grep -i '^access-control-allow-origin:' | tr -d '\r' | cut -d' ' -f2-)
          [ "$acao" = "https://support.bingr.online" ] && echo "::notice::support preflight met CORS voor https://support.bingr.online" || { echo "::error::support preflight zonder CORS ('$acao')"; exit 1; }
          acao=$(curl -s -D - -o /dev/null -X OPTIONS "$F" -H "Origin: https://example.com" -H "Access-Control-Request-Method: POST" | grep -ci '^access-control-allow-origin:' || true)
          [ "$acao" = 0 ] && echo "::notice::andere sites krijgen geen CORS" || { echo "::error::support geeft CORS aan een andere site"; exit 1; }
          # 2. leeg ticket: validatiefout (er wordt niets aangemaakt of gemaild)
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Origin: https://support.bingr.online" -H "Content-Type: application/json" -d '{"action":"create"}')
          cat /tmp/c.json; echo
          [ "$code" = 400 ] && grep -q name_missing /tmp/c.json && echo "::notice::lege create: 400 name_missing" || { echo "::error::lege create gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"create","website":"spam","name":"x"}')
          [ "$code" = 400 ] && grep -q spam /tmp/c.json && echo "::notice::lokveld werkt" || { echo "::error::lokveld gaf HTTP $code"; exit 1; }
          # 3. zonder geheime link of inloggen geen ticket; zonder inloggen geen lijst; zonder geheim geen beheer
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"get","n":1001,"t":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}')
          [ "$code" = 404 ] && echo "::notice::get met fout token: 404" || { echo "::error::get met fout token gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"mine"}')
          [ "$code" = 401 ] && echo "::notice::mine zonder inloggen: 401" || { echo "::error::mine zonder inloggen gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -H "x-support-secret: fout" -d '{"action":"admin_list"}')
          [ "$code" = 403 ] && echo "::notice::beheer zonder geheim: 403" || { echo "::error::admin_list zonder geheim gaf HTTP $code"; exit 1; }
          # 4. inbox-import: zonder geheim 403, met het geheim ok of skipped (IMAP niet ingesteld)
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"poll_inbox"}')
          [ "$code" = 403 ] && echo "::notice::poll_inbox zonder geheim: 403" || { echo "::error::poll_inbox zonder geheim gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' --max-time 90 -X POST "$F" -H "Content-Type: application/json" \
            -H "x-support-cron: $(cat "$RUNNER_TEMP/support_cron_secret")" -d '{"action":"poll_inbox","source":"deploy"}')
          python3 - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          try: r = json.load(open("/tmp/c.json"))
          except Exception: r = {}
          if code != "200": print(f"::error::poll_inbox gaf HTTP {code}: {str(r)[:300]}"); raise SystemExit(1)
          if r.get("skipped"): print(f"::notice::Inbox-import: {r['skipped']} (BINGR_IMAP_* niet gezet)")
          elif r.get("busy"): print("::notice::Inbox-import: er liep al een ronde (planning)")
          elif r.get("ok"): print(f"::notice::Inbox-import werkt: {r.get('fetched',0)} opgehaald, {r.get('imported',0)} reacties, {r.get('agent',0)} antwoorden support, {r.get('new_tickets',0)} nieuwe tickets, {r.get('ignored',0)} genegeerd, {r.get('rejected',0)} geweigerd ({r.get('ms')} ms, map: {r.get('folder') or 'geen Bingr-verwerkt'})")
          else: print(f"::warning::Inbox-import gaf een fout: {r.get('error','?')} — controleer BINGR_IMAP_*")
          PY
          # 5. tabellen en tellers in de database
          python3 -c 'import json;print(json.dumps({"query":"select public.bingr_support_counts() as counts, (select last_value from public.support_ticket_number_seq) as seq, (select count(*) from public.support_inbox_state) as inbox"}))' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/sq.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/sq.json"))
          row = r[0] if isinstance(r, list) and r else None
          if not row or "active" not in json.dumps(row.get("counts")): print("::error::bingr_support_counts onverwacht:", str(r)[:300]); raise SystemExit(1)
          c = row["counts"] if isinstance(row["counts"], dict) else json.loads(row["counts"])
          if row.get("inbox") != 1: print("::error::support_inbox_state ontbreekt:", str(r)[:300]); raise SystemExit(1)
          print(f"::notice::Supporttickets: {c['total']} totaal, {c['active']} open, {c['unread']} ongelezen (nummers vanaf {row['seq']})")
          PY
      - name: Statusmonitor testen
        if: steps.check.outputs.skip != '1'
        run: |
          F="https://$REF.supabase.co/functions/v1/status"
          code=$(curl -s -o /tmp/x.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"run"}')
          [ "$code" = 403 ] && echo "::notice::status run zonder geheim geweigerd (403)" || { echo "::error::status run zonder geheim gaf HTTP $code"; exit 1; }
          # een volledige controle (alle monitors), met het geheim uit de vorige stap
          # loopt de geplande controle net (busy), dan even wachten en opnieuw
          for i in 1 2 3 4 5 6 7 8; do
            curl -s -X POST "$F" -H "Content-Type: application/json" -H "x-status-secret: $(cat "$RUNNER_TEMP/status_secret")" \
              -d '{"action":"run","force":true,"source":"deploy"}' > /tmp/run.json
            grep -Eq '"busy": ?true' /tmp/run.json || break
            echo "Er loopt al een controle (planning); over 15 s opnieuw"; sleep 15
          done
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/run.json"))
          if "checked" not in r: print("::error::status run mislukt:", r); raise SystemExit(1)
          print(f"::notice::Statuscontrole: {r['checked']} gecontroleerd, {r['skipped']} overgeslagen, {r['up']} up, {r['degraded']} verminderd, {r['down']} storing, {r['ms']} ms")
          for x in r["results"]:
              print(f"  {x['id']:<10} {x['state']:<9} {str(x['ms'] or ''):>6} ms  {x['error'] or ''} {x.get('detail') or ''}")
          print("::notice::Per monitor: " + "; ".join(f"{x['id']} {x['state']} {x['ms'] or 0} ms" + (f" ({x['error'] or x.get('detail')})" if (x['error'] or x.get('detail')) else "") for x in r["results"]))
          PY
          curl -s "$F?action=public" > /tmp/pub.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/pub.json"))
          n = sum(len(g["monitors"]) for g in p.get("groups", []))
          if not n: print("::error::status public zonder monitors:", str(p)[:300]); raise SystemExit(1)
          if '"devices"' in json.dumps(p): print("::error::status public bevat apparaatgegevens"); raise SystemExit(1)
          print(f"::notice::Statuspagina (public): {p['overall']['state']}, {n} openbare monitors in {len(p['groups'])} groepen, {len(p['incidents'])} storingen")
          PY
          curl -s -X POST "$F" -H "Content-Type: application/json" -H "x-status-secret: $(cat "$RUNNER_TEMP/status_secret")" -d '{"action":"admin"}' > /tmp/adm.json
          python3 -c 'import json;a=json.load(open("/tmp/adm.json"));print("::notice::Planning:", json.dumps(a.get("scheduler")), "| alert-e-mail:", "ja" if a["alerts"]["email"] else "nee", "| smtp:", a["alerts"]["smtp"])'
      - name: Statusmonitor - planning controleren
        if: steps.check.outputs.skip != '1' && steps.cron.outputs.ok == '1' && inputs.verify_scheduler
        run: |
          # wachten tot pg_cron de functie zelf heeft aangeroepen (status_runner: last_source = cron, na het begin van deze stap)
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$1" > /tmp/q.json
                curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | tr '\n' ' ' | head -c 900; }
          for i in $(seq 1 26); do
            sleep 20
            r=$(q "select last_run_at, last_source, last_run_at > '$start'::timestamptz as after_start, (select count(*) from status_checks where at > '$start'::timestamptz) as checks from status_runner where id = 1")
            echo "$r"
            if echo "$r" | grep -Eq '"last_source": ?"cron"' && echo "$r" | grep -Eq '"after_start": ?true'; then
              echo "::notice::Planning werkt: pg_cron heeft de functie status zelf aangeroepen: $r"
              echo "::notice::cron.job_run_details: $(q "select status, start_time, return_message from cron.job_run_details where jobid = (select jobid from cron.job where jobname = 'bingr-status') order by start_time desc limit 2")"
              echo "::notice::net._http_response: $(q "select status_code, timed_out, created from net._http_response order by created desc limit 2")"
              exit 0
            fi
          done
          echo "::warning::cron.job_run_details: $(q "select status, start_time, return_message from cron.job_run_details order by start_time desc limit 4")"
          echo "::warning::net._http_response: $(q "select status_code, timed_out, error_msg, left(content, 120) as content, created from net._http_response order by created desc limit 4")"
          echo "::error::De planning heeft binnen 9 minuten de functie niet aangeroepen"; exit 1
