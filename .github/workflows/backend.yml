          for x in r["results"]:
              print(f"  {x['id']:<10} {x['state']:<9} {str(x['ms'] or ''):>6} ms  {x['error'] or ''} {x.get('detail') or ''}")
          print("::notice::Per monitor: " + "; ".join(f"{x['id']} {x['state']} {x['ms'] or 0} ms" + (f" ({x['error'] or x.get('detail')})" if (x['error'] or x.get('detail')) else "") for x in r["results"]))
          PY
          curl -s "$F?action=public" > /tmp/pub.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/pub.json"))
          n = sum(len(g["monitors"]) for g in p.get("groups", []))
          if not n: print("::error::status public zonder monitors:", str(p)[:300]); raise SystemExit(1)
          if '"devices"' in json.dumps(p): print("::error::status public bevat apparaatgegevens"); raise SystemExit(1)
          print(f"::notice::Statuspagina (public): {p['overall']['state']}, {n} openbare monitors in {len(p['groups'])} groepen, {len(p['incidents'])} storingen")
          PY
          curl -s -X POST "$F" -H "Content-Type: application/json" -H "x-status-secret: $(cat "$RUNNER_TEMP/status_secret")" -d '{"action":"admin"}' > /tmp/adm.json
          python3 -c 'import json;a=json.load(open("/tmp/adm.json"));print("::notice::Planning:", json.dumps(a.get("scheduler")), "| alert-e-mail:", "ja" if a["alerts"]["email"] else "nee", "| smtp:", a["alerts"]["smtp"])'
      - name: Statuspagina - meldingen, feed en abonneren testen
        if: steps.check.outputs.skip != '1'
        run: |
          F="https://$REF.supabase.co/functions/v1/status"
          H=(-H "Content-Type: application/json" -H "x-status-secret: $(cat "$RUNNER_TEMP/status_secret")")
          # 1. openbare samenvatting: niveaus, meldingen en dagbalken met minuten; nergens een leverancier
          curl -s "$F?action=public" > /tmp/pub.json
          python3 - <<'PY'
          import json, re
          raw = open("/tmp/pub.json").read(); p = json.loads(raw)
          lv = p.get("overall", {}).get("level")
          if lv not in ("operational", "maintenance", "degraded", "partial", "major"): print("::error::overall.level ontbreekt:", raw[:300]); raise SystemExit(1)
          n = p.get("notices") or {}
          if not all(k in n for k in ("active", "upcoming", "recent")): print("::error::notices ontbreekt:", raw[:300]); raise SystemExit(1)
          m = [x for g in p["groups"] for x in g["monitors"]]
          if not m or "dm" not in m[0]["days"][-1] or "status" not in m[0]: print("::error::dagbalken zonder dm/status:", json.dumps(m[:1])[:300]); raise SystemExit(1)
          if re.search(r"supabase", raw, re.I): print("::error::openbare status noemt een leverancier"); raise SystemExit(1)
          print(f"::notice::Statuspagina: {lv}, {len(n['active'])} lopend, {len(n['upcoming'])} gepland, {len(n['recent'])} recent")
          PY
          # 2. feed (Atom en RSS): XML, geen leverancier
          for fmt in atom rss; do
            code=$(curl -s -o /tmp/feed.xml -w '%{http_code} %{content_type}' "$F?action=feed&format=$fmt")
            python3 - "$fmt" "$code" <<'PY'
          import sys, re, xml.dom.minidom as md
          fmt, code = sys.argv[1], " ".join(sys.argv[2:])
          raw = open("/tmp/feed.xml", encoding="utf-8").read()
          try: md.parseString(raw.encode())
          except Exception as e: print(f"::error::feed {fmt} is geen geldige XML ({code}): {e}: {raw[:200]}"); raise SystemExit(1)
          if re.search(r"supabase", raw, re.I): print(f"::error::feed {fmt} noemt een leverancier"); raise SystemExit(1)
          print(f"::notice::Feed {fmt}: {code}, {raw.count('<entry>') + raw.count('<item>')} items")
          PY
          done
          # 3. geschiedenis en detail
          curl -s "$F?action=history&page=1" > /tmp/h.json
          python3 -c 'import json;h=json.load(open("/tmp/h.json"));assert "items" in h and "pages" in h, h;print("::notice::Geschiedenis:", h["total"], "meldingen,", h["pages"], "pagina(s)")'
          code=$(curl -s -o /tmp/d.json -w '%{http_code}' "$F?action=notice&id=999999999")
          [ "$code" = 404 ] && echo "::notice::onbekende melding: 404" || { echo "::error::notice met onbekend id gaf HTTP $code"; exit 1; }
          # 4. abonneren: validatie (er wordt niets aangemaakt of gemaild)
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"subscribe","email":"geen-adres"}')
          [ "$code" = 400 ] && grep -q bad_email /tmp/s.json && echo "::notice::subscribe met ongeldig adres: 400" || { echo "::error::subscribe ongeldig adres gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"subscribe","email":"ci@example.com","website":"spam"}')
          [ "$code" = 400 ] && grep -q spam /tmp/s.json && echo "::notice::subscribe lokveld: 400" || { echo "::error::subscribe lokveld gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"confirm","token":"x"}')
          [ "$code" = 400 ] && echo "::notice::confirm met ongeldig token: 400" || { echo "::error::confirm gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"unsubscribe","token":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}')
          [ "$code" = 200 ] && grep -q '"removed":false' /tmp/s.json && echo "::notice::unsubscribe onbekend token: ok, niets verwijderd" || { echo "::error::unsubscribe gaf HTTP $code"; exit 1; }
          # 5. beheer: zonder geheim 403; validatie; een onderhoud aanmaken, annuleren (dan niet openbaar) en verwijderen, zonder mail
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"notice_save"}')
          [ "$code" = 403 ] && echo "::notice::notice_save zonder geheim: 403" || { echo "::error::notice_save zonder geheim gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" "${H[@]}" -d '{"action":"notice_save","kind":"incident"}')
          [ "$code" = 400 ] && grep -q title_missing /tmp/s.json || { echo "::error::notice_save zonder titel gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST "$F" "${H[@]}" -d '{"action":"notice_save","kind":"maintenance","title_nl":"x","message_nl":"x","window_start":"2030-01-02T00:00:00Z","window_end":"2030-01-01T00:00:00Z"}')
          [ "$code" = 400 ] && grep -q bad_window /tmp/s.json || { echo "::error::notice_save met verkeerd tijdvak gaf HTTP $code"; exit 1; }
          curl -s -X POST "$F" "${H[@]}" -d '{"action":"notice_save","kind":"maintenance","title_nl":"CI-test (wordt meteen verwijderd)","message_nl":"CI-test","window_start":"2030-01-01T02:00:00Z","window_end":"2030-01-01T03:00:00Z","components":[{"id":"db"}],"notify":false}' > /tmp/n.json
          NID=$(python3 -c 'import json;print(json.load(open("/tmp/n.json")).get("id",""))')
          [ -n "$NID" ] || { echo "::error::notice_save mislukt: $(head -c 300 /tmp/n.json)"; exit 1; }
          curl -s -X POST "$F" "${H[@]}" -d "{\"action\":\"notice_update\",\"id\":$NID,\"status\":\"cancelled\",\"message_nl\":\"CI-test geannuleerd\",\"notify\":false}" > /tmp/u.json
          grep -q '"ok":true' /tmp/u.json || { echo "::error::notice_update mislukt: $(head -c 300 /tmp/u.json)"; curl -s -X POST "$F" "${H[@]}" -d "{\"action\":\"notice_delete\",\"id\":$NID}" >/dev/null; exit 1; }
          curl -s -X POST "$F" "${H[@]}" -d '{"action":"admin"}' > /tmp/adm.json
          python3 - "$NID" <<'PY'
          import json, sys
          a = json.load(open("/tmp/adm.json")); nid = int(sys.argv[1])
          n = next((x for x in a.get("all_notices", []) if x["id"] == nid), None)
          if not n or n["status"] != "cancelled" or len(n["updates"]) != 2 or n["components"] != [{"id": "db", "impact": "maintenance"}]:
              print("::error::testmelding niet zoals verwacht:", json.dumps(n)[:400]); raise SystemExit(1)
          print("::notice::Beheer: onderhoud aangemaakt en geannuleerd; abonnees:", json.dumps(a.get("subscribers")))
          PY
          curl -s -X POST "$F" "${H[@]}" -d "{\"action\":\"notice_delete\",\"id\":$NID}" | grep -q '"ok":true' && echo "::notice::testmelding verwijderd" || { echo "::error::notice_delete mislukt"; exit 1; }
          curl -s -X POST "$F" "${H[@]}" -d '{"action":"mail_run"}' | tee /tmp/m.json; echo
      - name: Statusmonitor - planning controleren
        if: steps.check.outputs.skip != '1' && steps.cron.outputs.ok == '1' && inputs.verify_scheduler
        run: |
          # wachten tot pg_cron de functie zelf heeft aangeroepen (status_runner: last_source = cron, na het begin van deze stap)
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q() { python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$1" > /tmp/q.json
                curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | tr '\n' ' ' | head -c 900; }
          for i in $(seq 1 26); do
            sleep 20
            r=$(q "select last_run_at, last_source, last_run_at > '$start'::timestamptz as after_start, (select count(*) from status_checks where at > '$start'::timestamptz) as checks from status_runner where id = 1")
            echo "$r"
            if echo "$r" | grep -Eq '"last_source": ?"cron"' && echo "$r" | grep -Eq '"after_start": ?true'; then
              echo "::notice::Planning werkt: pg_cron heeft de functie status zelf aangeroepen: $r"
              echo "::notice::cron.job_run_details: $(q "select status, start_time, return_message from cron.job_run_details where jobid = (select jobid from cron.job where jobname = 'bingr-status') order by start_time desc limit 2")"
              echo "::notice::net._http_response: $(q "select status_code, timed_out, created from net._http_response order by created desc limit 2")"
              exit 0
            fi
          done
          echo "::warning::cron.job_run_details: $(q "select status, start_time, return_message from cron.job_run_details order by start_time desc limit 4")"
          echo "::warning::net._http_response: $(q "select status_code, timed_out, error_msg, left(content, 120) as content, created from net._http_response order by created desc limit 4")"
          echo "::error::De planning heeft binnen 9 minuten de functie niet aangeroepen"; exit 1


  # aparte job (de deploy-job zit aan het maximum van 50 meldingen): abonnementen (Gratis / Lifetime) testen
  plans:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Abonnementen testen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::secrets ontbreken, overgeslagen"; exit 0; fi
          # 1. entitlements zonder inloggen: 401
          code=$(curl -s -o /tmp/e.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/device-auth" -H "Content-Type: application/json" -d '{"action":"entitlements","platform":"web"}')
          cat /tmp/e.json; echo
          [ "$code" = 401 ] && grep -q not_signed_in /tmp/e.json && echo "::notice::entitlements zonder inloggen: 401" || { echo "::error::entitlements zonder inloggen gaf HTTP $code"; exit 1; }
          # 2. tabellen, instelling upgrade_link en de eenmalige Lifetime-migratie (legacy)
          python3 -c 'import json;print(json.dumps({"query":"select (select value from public.app_settings where key = $$upgrade_link$$) as upgrade_link, (select value from public.app_settings where key = $$plans_legacy_done$$) as legacy_done, (select count(*) from public.account_plans where source = $$legacy$$) as legacy, (select count(*) from public.account_plans where plan = $$lifetime$$) as lifetime, (select count(*) from auth.users) as users"}))' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/sq.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/sq.json")); row = r[0] if isinstance(r, list) and r else None
          if not row or not row.get("upgrade_link") or not row.get("legacy_done"): print("::error::app_settings/account_plans onverwacht:", str(r)[:300]); raise SystemExit(1)
          ul = row["upgrade_link"] if isinstance(row["upgrade_link"], dict) else json.loads(row["upgrade_link"])
          ld = row["legacy_done"] if isinstance(row["legacy_done"], dict) else json.loads(row["legacy_done"])
          print(f"::notice::Abonnementen: migratie legacy op {ld.get('at')} gaf {ld.get('accounts')} accounts Lifetime; nu {row['legacy']} legacy, {row['lifetime']} Lifetime van {row['users']} accounts")
          print("::notice::Upgrade-link per platform: " + ", ".join(f"{k}={'aan' if v else 'uit'}" for k, v in ul.items()))
          PY
      - name: Abonnementen end-to-end (tijdelijk gratis account)
        # nieuw account = gratis: entitlements per platform, 403 feature_locked voor statistieken en nu aan het kijken,
        # streamlimiet 2; daarna Lifetime (zoals het beheer) en dezelfde aanvragen opnieuw. Het testaccount wordt altijd verwijderd.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, secrets, sys, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]
          BASE = f"https://{REF}.supabase.co"; PUB = "sb_publishable_lpIup6Omq5kW2k3oICGZ4g_HPGac5A3"
          def req(method, url, body=None, headers=None):
              h = {"Content-Type": "application/json", **(headers or {})}
              r = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: raw = resp.read(); code = resp.status
              except urllib.error.HTTPError as e: raw = e.read(); code = e.code
              try: return code, json.loads(raw or b"{}")
              except Exception: return code, {"raw": raw[:200].decode("utf-8", "replace")}
          def sql(q):
              return req("POST", f"https://api.supabase.com/v1/projects/{REF}/database/query", {"query": q}, {"Authorization": f"Bearer {MGMT}"})
          code, keys = req("GET", f"https://api.supabase.com/v1/projects/{REF}/api-keys?reveal=true", headers={"Authorization": f"Bearer {MGMT}"})
          key = None
          for k in keys if isinstance(keys, list) else []:
              v = k.get("api_key") or ""
              if v and (k.get("name") == "service_role" or k.get("type") == "secret") and "·" not in v: key = v; break
          if not key: print(f"::warning::end-to-end overgeslagen: geen geheime sleutel (HTTP {code})"); sys.exit(0)
          print(f"::add-mask::{key}")
          adm = {"apikey": key, **({"Authorization": f"Bearer {key}"} if key.startswith("ey") else {})}
          email, pw = f"ci-plan-{secrets.token_hex(6)}@example.com", secrets.token_urlsafe(18)
          code, u = req("POST", f"{BASE}/auth/v1/admin/users", {"email": email, "password": pw, "email_confirm": True}, adm)
          uid = u.get("id")
          if not uid: print(f"::error::testaccount aanmaken mislukt (HTTP {code})"); sys.exit(1)
          fail = []
          try:
              code, t = req("POST", f"{BASE}/auth/v1/token?grant_type=password", {"email": email, "password": pw}, {"apikey": PUB})
              tok = t.get("access_token")
              if not tok: raise SystemExit(f"inloggen testaccount mislukt (HTTP {code})")
              print(f"::add-mask::{tok}")
              user = {"apikey": PUB, "Authorization": f"Bearer {tok}"}
              DA = f"{BASE}/functions/v1/device-auth"
              # gratis
              code, e = req("POST", DA, {"action": "entitlements", "platform": "web"}, user)
              if code != 200 or e.get("plan") != "free" or e.get("limits") != {"streams": 1, "devices": 8, "servers": 1} or e.get("features", {}).get("stats") is not False or e.get("upgrade", {}).get("link") is not True:
                  fail.append(f"entitlements gratis/web: HTTP {code} {e}")
              code, e = req("POST", DA, {"action": "entitlements", "platform": "tvos"}, user)
              if e.get("upgrade", {}).get("link") is not False: fail.append(f"entitlements tvos: link {e.get('upgrade')}")
              for a, f in (("watch_stats", "stats"), ("list_streams", "now_watching"), ("watch_log", "now_watching")):
                  code, r = req("POST", DA, {"action": a}, user)
                  if code != 403 or r != {"error": "feature_locked", "feature": f, "plan": "free"}: fail.append(f"{a} gratis: HTTP {code} {r}")
              for i in range(5):
                  req("POST", DA, {"action": "register_device", "device_id": f"ci-p{i}", "name": "CI", "platform": "browser"}, user)
              code, r = req("POST", DA, {"action": "heartbeat", "device_id": "ci-p0"}, user)
              if (r.get("entitlements") or {}).get("plan") != "free" or (r.get("entitlements") or {}).get("upgrade", {}).get("link") is not True: fail.append(f"heartbeat zonder entitlements: {r}")
              # gratis: 1 gelijktijdige kijker (Bingr-telling, los van de IPTV-provider)
              res = [req("POST", DA, {"action": "stream_start", "device_id": f"ci-p{i}", "title": "CI", "kind": "live"}, user) for i in range(2)]
              if res[0][0] != 200 or res[1][0] != 403 or res[1][1].get("error") != "stream_limit" or res[1][1].get("limit") != 1 or res[1][1].get("plan") != "free":
                  fail.append(f"streamlimiet gratis: {[(c, {k: v for k, v in r.items() if k != 'streams'}) for c, r in res]}")
              else: print("::notice::gratis: entitlements, feature_locked (stats, now_watching) en streamlimiet 1 werken")
              # lifetime met de standaardlimiet (3 gelijktijdige kijkers, zoals plan_set in het beheer zonder eigen limiet)
              code, r = sql(f"insert into public.account_plans (user_id, plan, max_streams, source, granted_by) values ('{uid}', 'lifetime', null, 'admin', 'ci') on conflict (user_id) do update set plan = 'lifetime', max_streams = null")
              if code >= 300: fail.append(f"account_plans schrijven: HTTP {code} {str(r)[:200]}")
              code, e = req("POST", DA, {"action": "entitlements", "platform": "android"}, user)
              if e.get("plan") != "lifetime" or e.get("limits") != {"streams": 3, "devices": 15, "servers": None} or e.get("features", {}).get("trakt") is not True:
                  fail.append(f"entitlements lifetime: HTTP {code} {e}")
              res = [req("POST", DA, {"action": "stream_start", "device_id": f"ci-p{i}", "title": "CI", "kind": "live"}, user) for i in (1, 2, 3)]
              if res[0][0] != 200 or res[1][0] != 200 or res[2][0] != 403 or res[2][1].get("error") != "stream_limit" or res[2][1].get("limit") != 3 or res[2][1].get("plan") != "lifetime":
                  fail.append(f"streamlimiet lifetime (3): {[(c, {k: v for k, v in r.items() if k != 'streams'}) for c, r in res]}")
              code, r = req("POST", DA, {"action": "list_streams"}, user)
              if code != 200 or r.get("limit") != 3 or len(r.get("streams") or []) != 3: fail.append(f"list_streams lifetime: HTTP {code} {str(r)[:200]}")
              # eigen limiet uit het beheer gaat boven de standaard
              code, r = sql(f"update public.account_plans set max_streams = 4 where user_id = '{uid}'")
              if code >= 300: fail.append(f"account_plans eigen limiet: HTTP {code} {str(r)[:200]}")
              code, r = req("POST", DA, {"action": "stream_start", "device_id": "ci-p3", "title": "CI", "kind": "live"}, user)
              if code != 200 or r.get("limit") != 4: fail.append(f"stream_start lifetime eigen limiet 4: HTTP {code} {str(r)[:200]}")
              code, r = req("POST", DA, {"action": "watch_stats", "period": "week"}, user)
              if code != 200: fail.append(f"watch_stats lifetime: HTTP {code} {str(r)[:200]}")
              if not any("lifetime" in f for f in fail): print("::notice::lifetime: entitlements, streamlimiet 3, eigen limiet 4, list_streams en watch_stats werken")
          except SystemExit as e:
              fail.append(str(e))
          finally:
              code, _ = req("DELETE", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
              print("::notice::testaccount verwijderd" if code in (200, 204) else f"::warning::testaccount {email} niet verwijderd (HTTP {code})")
          for f in fail: print(f"::error::{f[:400]}")
          sys.exit(1 if fail else 0)
          PY

  # build 133: betalen via Stripe (functies billing en stripe-webhook, docs/ACCOUNT.md "Betalen (Stripe, build 133)").
  # Eigen job (eigen ruimte voor meldingen); de unittests (billing_test.ts) draaien blokkerend in de deploy-job.
  # GitHub-secrets: STRIPE_SECRET_KEY (sk_test_… of sk_live_…; ontbreekt hij, dan is betalen uit: billing geeft 503
  # billing_unavailable en de site toont "binnenkort beschikbaar"), optioneel STRIPE_WEBHOOK_SECRET (whsec_…, alleen als je
  # het endpoint zelf in Stripe hebt gemaakt) en STRIPE_AUTOMATIC_TAX ("true" = Stripe Tax). Het webhook-endpoint
  # https://<ref>.supabase.co/functions/v1/stripe-webhook maakt deze job zelf aan in Stripe (per modus: test en live apart)
  # en zet het signing secret als function-secret STRIPE_WEBHOOK_SECRET. Sleutels en secrets komen nooit in het log.
  billing:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
      - name: Controleren
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::secrets ontbreken, betalen niet bijgewerkt"; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 (v1.7.3)
        if: steps.check.outputs.skip != '1'
        with:
          version: 2.121.0
      - name: Betalen - sleutel en webhook
        if: steps.check.outputs.skip != '1'
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WHSEC: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_TAX: ${{ secrets.STRIPE_AUTOMATIC_TAX }}
        run: |
          [ -n "$STRIPE_KEY" ] && echo "::add-mask::$STRIPE_KEY"
          [ -n "$STRIPE_WHSEC" ] && echo "::add-mask::$STRIPE_WHSEC"
          umask 077
          python3 - <<'PY'
          import json, os, re, subprocess, sys, urllib.parse, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]; TMP = os.environ["RUNNER_TEMP"]
          KEY = (os.environ.get("STRIPE_KEY") or "").strip(); GH_WHSEC = (os.environ.get("STRIPE_WHSEC") or "").strip()
          TAX = (os.environ.get("STRIPE_TAX") or "").strip().lower() in ("1", "true", "yes", "on", "ja")
          URL = f"https://{REF}.supabase.co/functions/v1/stripe-webhook"
          EVENTS = ["checkout.session.completed", "checkout.session.async_payment_succeeded", "checkout.session.async_payment_failed",
                    "charge.refunded", "charge.dispute.created", "charge.updated"]
          API_VERSION = "2025-03-31.basil"
          def secrets_names():
              r = subprocess.run(["supabase", "secrets", "list", "--project-ref", REF], capture_output=True, text=True)
              return set(re.findall(r"\b[A-Z][A-Z0-9_]{2,}\b", r.stdout))
          def secrets_set(**kv):
              r = subprocess.run(["supabase", "secrets", "set", "--project-ref", REF, *[f"{k}={v}" for k, v in kv.items()]], capture_output=True, text=True)
              if r.returncode: print(f"::error::function-secrets zetten mislukt ({', '.join(kv)})"); sys.exit(1)
          def secrets_unset(*names):
              subprocess.run(["supabase", "secrets", "unset", "--project-ref", REF, *names], input="y\n", capture_output=True, text=True)
          def sql(q):
              r = urllib.request.Request(f"https://api.supabase.com/v1/projects/{REF}/database/query", method="POST",
                  data=json.dumps({"query": q}).encode(), headers={"Authorization": f"Bearer {MGMT}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: return json.loads(resp.read() or b"[]")
              except urllib.error.HTTPError as e: print(f"::warning::SQL HTTP {e.code}"); return None
          def stripe(method, path, params=None):
              data = urllib.parse.urlencode(params or [], doseq=True)
              url = f"https://api.stripe.com/v1/{path}" + (f"?{data}" if method in ("GET", "DELETE") and data else "")
              r = urllib.request.Request(url, method=method, data=data.encode() if method == "POST" else None,
                  headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/x-www-form-urlencoded"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try: body = json.loads(e.read() or b"{}")
                  except Exception: body = {}
                  return e.code, body
          def err(b): e = (b or {}).get("error") or {}; return f"{e.get('type', '')}/{e.get('code', '')}".strip("/")
          names = secrets_names()
          if not re.fullmatch(r"(sk|rk)_(test|live)_[A-Za-z0-9]+", KEY):
              if KEY: print("::warning::STRIPE_SECRET_KEY heeft geen geldige vorm (sk_test_… / sk_live_…); betalen blijft uit")
              if "STRIPE_SECRET_KEY" in names:
                  secrets_unset("STRIPE_SECRET_KEY"); print("::notice::STRIPE_SECRET_KEY van de server gehaald (geen GitHub-secret meer): betalen uit")
              print("::notice::Betalen staat uit: GitHub-secret STRIPE_SECRET_KEY ontbreekt. billing geeft 503 billing_unavailable, de site toont 'binnenkort beschikbaar'.")
              open(os.path.join(TMP, "billing_mode"), "w").write("off"); sys.exit(0)
          mode = "live" if "_live_" in KEY else "test"
          open(os.path.join(TMP, "billing_mode"), "w").write(mode)
          secrets_set(STRIPE_SECRET_KEY=KEY, STRIPE_AUTOMATIC_TAX="true" if TAX else "false")
          code, acct = stripe("GET", "account")
          if code == 401: print(f"::error::Stripe weigert STRIPE_SECRET_KEY (HTTP 401 {err(acct)})"); sys.exit(1)
          if code != 200: acct = {}; print(f"::warning::Stripe-account niet te lezen (HTTP {code} {err(acct)}); verder met de webhook")
          print(f"::notice::Stripe ({mode}modus): sleutel geldig, betalingen {'aan' if acct.get('charges_enabled') else 'nog niet aan (account afmaken in het Stripe-dashboard)'}, Stripe Tax {'aan' if TAX else 'uit'}")
          code, lst = stripe("GET", "webhook_endpoints", [("limit", "100")])
          if code != 200: print(f"::error::webhook-endpoints lezen mislukt (HTTP {code} {err(lst)})"); sys.exit(1)
          mine = [e for e in lst.get("data", []) if e.get("url") == URL]
          rows = sql("select value from public.app_settings where key = 'billing_webhook'") or []
          stored = rows[0]["value"] if rows and isinstance(rows[0].get("value"), dict) else (json.loads(rows[0]["value"]) if rows and rows[0].get("value") else {})
          known = None   # het signing secret als we het in deze ronde kennen (voor de rooktest)
          ep = mine[0] if mine else None
          for extra in mine[1:]:
              stripe("DELETE", f"webhook_endpoints/{extra['id']}"); print("::notice::dubbel webhook-endpoint verwijderd")
          if ep:
              stripe("POST", f"webhook_endpoints/{ep['id']}", [("enabled_events[]", e) for e in EVENTS] + [("disabled", "false")])
              if GH_WHSEC:
                  secrets_set(STRIPE_WEBHOOK_SECRET=GH_WHSEC); known = GH_WHSEC
                  print("::notice::webhook: bestaand endpoint, signing secret uit GitHub-secret STRIPE_WEBHOOK_SECRET")
              elif "STRIPE_WEBHOOK_SECRET" in names and stored.get("endpoint_id") == ep["id"]:
                  print("::notice::webhook: bestaand endpoint met bekend signing secret (ongewijzigd)")
              else:
                  stripe("DELETE", f"webhook_endpoints/{ep['id']}"); ep = None
                  print("::notice::webhook: endpoint had een onbekend signing secret; vervangen door een nieuw")
          if not ep:
              code, ep = stripe("POST", "webhook_endpoints", [("url", URL), ("api_version", API_VERSION),
                  ("description", "Bingr Lifetime (workflow Backend, iptv-ios-appletv)")] + [("enabled_events[]", e) for e in EVENTS])
              sec = (ep or {}).get("secret") or ""
              if code != 200 or not sec.startswith("whsec_"): print(f"::error::webhook-endpoint aanmaken mislukt (HTTP {code} {err(ep)})"); sys.exit(1)
              print(f"::add-mask::{sec}")
              secrets_set(STRIPE_WEBHOOK_SECRET=sec); known = sec
              print(f"::notice::webhook-endpoint aangemaakt in Stripe ({mode}modus, {len(EVENTS)} events); signing secret als function-secret gezet")
          val = json.dumps({"endpoint_id": ep["id"], "mode": mode, "url": URL}).replace("'", "''")
          sql(f"insert into public.app_settings (key, value, updated_at) values ('billing_webhook', '{val}'::jsonb, now()) on conflict (key) do update set value = excluded.value, updated_at = now()")
          if known: open(os.path.join(TMP, "whsec"), "w").write(known)
          PY
      - name: Edge Functions billing en stripe-webhook
        if: steps.check.outputs.skip != '1'
        run: |
          supabase functions deploy billing --project-ref "$REF" --no-verify-jwt --use-api
          supabase functions deploy stripe-webhook --project-ref "$REF" --no-verify-jwt --use-api
      - name: Betalen testen
        # rooktest (zonder inloggen 401, foute handtekening 400, juiste handtekening 200) en end-to-end met een tijdelijk
        # account: zonder sleutel 503 billing_unavailable; in testmodus een echte Checkout Session (daarna verlopen), status
        # niet betaald, en 409 already_lifetime. Het testaccount wordt altijd verwijderd; tokens en sleutels worden gemaskeerd.
        if: steps.check.outputs.skip != '1'
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          [ -n "$STRIPE_KEY" ] && echo "::add-mask::$STRIPE_KEY"
          sleep 5
          python3 - <<'PY'
          import hashlib, hmac, json, os, secrets, sys, time, urllib.parse, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]; TMP = os.environ["RUNNER_TEMP"]
          BASE = f"https://{REF}.supabase.co"; PUB = "sb_publishable_lpIup6Omq5kW2k3oICGZ4g_HPGac5A3"
          KEY = (os.environ.get("STRIPE_KEY") or "").strip()
          MODE = open(os.path.join(TMP, "billing_mode")).read().strip() if os.path.exists(os.path.join(TMP, "billing_mode")) else "off"
          WH = open(os.path.join(TMP, "whsec")).read().strip() if os.path.exists(os.path.join(TMP, "whsec")) else ""
          def req(method, url, body=None, headers=None, raw=None):
              h = {"Content-Type": "application/json", **(headers or {})}
              data = raw if raw is not None else (None if body is None else json.dumps(body).encode())
              r = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: rawb = resp.read(); code = resp.status; hd = dict(resp.headers)
              except urllib.error.HTTPError as e: rawb = e.read(); code = e.code; hd = dict(e.headers)
              try: return code, json.loads(rawb or b"{}"), hd
              except Exception: return code, {"raw": rawb[:200].decode("utf-8", "replace")}, hd
          def sql(q):
              return req("POST", f"https://api.supabase.com/v1/projects/{REF}/database/query", {"query": q}, {"Authorization": f"Bearer {MGMT}"})
          fail = []
          B, W = f"{BASE}/functions/v1/billing", f"{BASE}/functions/v1/stripe-webhook"
          code, c, _ = req("GET", f"{B}/config", headers={"apikey": PUB})
          if code != 200 or c.get("enabled") is not (MODE != "off") or c.get("price_cents") != 499: fail.append(f"billing/config: HTTP {code} {c}")
          else: print(f"::notice::billing/config: betalen {'aan (' + MODE + 'modus)' if c['enabled'] else 'uit'}, {c['price_cents']} cent")
          code, r, hd = req("POST", f"{B}/checkout", {"waiver": True}, {"apikey": PUB, "Origin": "https://bingr.online"})
          if code != 401 or r.get("error") != "not_signed_in": fail.append(f"billing/checkout zonder inloggen: HTTP {code} {r}")
          elif (hd.get("Access-Control-Allow-Origin") or hd.get("access-control-allow-origin")) != "https://bingr.online": fail.append("billing: geen CORS voor https://bingr.online")
          else: print("::notice::billing/checkout zonder inloggen: 401 (met CORS voor bingr.online)")
          ev = json.dumps({"id": "evt_ci_" + secrets.token_hex(8), "object": "event", "type": "ci.ping", "data": {"object": {}}})
          t = int(time.time())
          code, r, _ = req("POST", W, raw=ev.encode(), headers={"Stripe-Signature": f"t={t},v1={'0' * 64}"})
          if code != 400: fail.append(f"stripe-webhook met foute handtekening: HTTP {code}")
          code2, _, _ = req("POST", W, raw=ev.encode(), headers={})
          if code == 400 and code2 == 400: print("::notice::stripe-webhook: foute of geen handtekening -> 400")
          elif code2 != 400: fail.append(f"stripe-webhook zonder handtekening: HTTP {code2}")
          if WH:
              sig = hmac.new(WH.encode(), f"{t}.{ev}".encode(), hashlib.sha256).hexdigest()
              code, r, _ = req("POST", W, raw=ev.encode(), headers={"Stripe-Signature": f"t={t},v1={sig}"})
              if code != 200 or r.get("result") != "ignore_other_event": fail.append(f"stripe-webhook met juiste handtekening: HTTP {code} {r}")
              else: print("::notice::stripe-webhook: juiste handtekening -> 200 (signing secret klopt)")
          # end-to-end met een tijdelijk account
          code, keys, _ = req("GET", f"https://api.supabase.com/v1/projects/{REF}/api-keys?reveal=true", headers={"Authorization": f"Bearer {MGMT}"})
          key = next((k.get("api_key") for k in (keys if isinstance(keys, list) else []) if k.get("api_key") and (k.get("name") == "service_role" or k.get("type") == "secret") and "·" not in k.get("api_key")), None)
          if not key:
              print(f"::warning::end-to-end overgeslagen: geen geheime sleutel (HTTP {code})")
          else:
              print(f"::add-mask::{key}")
              adm = {"apikey": key, **({"Authorization": f"Bearer {key}"} if key.startswith("ey") else {})}
              email, pw = f"ci-pay-{secrets.token_hex(6)}@example.com", secrets.token_urlsafe(18)
              code, u, _ = req("POST", f"{BASE}/auth/v1/admin/users", {"email": email, "password": pw, "email_confirm": True}, adm)
              uid = u.get("id")
              try:
                  if not uid: raise SystemExit(f"testaccount aanmaken mislukt (HTTP {code})")
                  code, tk, _ = req("POST", f"{BASE}/auth/v1/token?grant_type=password", {"email": email, "password": pw}, {"apikey": PUB})
                  tok = tk.get("access_token")
                  if not tok: raise SystemExit(f"inloggen testaccount mislukt (HTTP {code})")
                  print(f"::add-mask::{tok}")
                  user = {"apikey": PUB, "Authorization": f"Bearer {tok}"}
                  code, r, _ = req("POST", f"{B}/purchases", {}, user)
                  if code != 200 or r.get("items") != []: fail.append(f"purchases leeg account: HTTP {code} {r}")
                  if MODE == "off":
                      code, r, _ = req("POST", f"{B}/checkout", {"waiver": True, "lang": "nl"}, user)
                      if code != 503 or r.get("error") != "billing_unavailable": fail.append(f"checkout zonder sleutel: HTTP {code} {r}")
                      else: print("::notice::checkout zonder STRIPE_SECRET_KEY: 503 billing_unavailable (site: binnenkort beschikbaar)")
                  else:
                      code, r, _ = req("POST", f"{B}/checkout", {"lang": "nl"}, user)
                      if code != 400 or r.get("error") != "waiver_required": fail.append(f"checkout zonder vinkje: HTTP {code} {r}")
                      if MODE == "test":
                          code, r, _ = req("POST", f"{B}/checkout", {"waiver": True, "lang": "nl"}, user)
                          url = r.get("url") or ""
                          if code != 200 or not url.startswith("https://checkout.stripe.com/"): fail.append(f"checkout testmodus: HTTP {code} {str(r)[:200]}")
                          else:
                              print("::notice::checkout (testmodus): Stripe Checkout Session aangemaakt")
                              # sessie-id via de Stripe-API (de URL zelf niet loggen); daarna status en verlopen
                              rq = urllib.request.Request("https://api.stripe.com/v1/checkout/sessions?limit=10", headers={"Authorization": f"Bearer {KEY}"})
                              try:
                                  with urllib.request.urlopen(rq, timeout=30) as resp: ss = json.loads(resp.read())
                              except Exception: ss = {}
                              sid = next((s["id"] for s in ss.get("data", []) if s.get("client_reference_id") == uid), None)
                              if not sid: fail.append("checkout-sessie niet gevonden bij Stripe")
                              else:
                                  code, r, _ = req("POST", f"{B}/status", {"session_id": sid}, user)
                                  if code != 200 or r.get("paid") is not False or r.get("plan") != "free": fail.append(f"status onbetaald: HTTP {code} {r}")
                                  else: print("::notice::status (onbetaald): paid=false, plan=free")
                                  rq = urllib.request.Request(f"https://api.stripe.com/v1/checkout/sessions/{sid}/expire", method="POST", data=b"", headers={"Authorization": f"Bearer {KEY}"})
                                  try: urllib.request.urlopen(rq, timeout=30)
                                  except Exception: print("::warning::testsessie niet verlopen")
                  code, r, _ = sql(f"insert into public.account_plans (user_id, plan, source, granted_by) values ('{uid}', 'lifetime', 'admin', 'ci') on conflict (user_id) do update set plan = 'lifetime'")
                  code, r, _ = req("POST", f"{B}/checkout", {"waiver": True}, user)
                  if code != 409 or r.get("error") != "already_lifetime": fail.append(f"checkout met Lifetime: HTTP {code} {r}")
                  else: print("::notice::checkout met Lifetime: 409 already_lifetime")
              except SystemExit as e:
                  fail.append(str(e))
              finally:
                  if uid:
                      code, _, _ = req("DELETE", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
                      if code not in (200, 204): print(f"::warning::testaccount niet verwijderd (HTTP {code})")
          code, r, _ = sql("select (select count(*) from public.billing_purchases) as purchases, (select count(*) from public.billing_events) as events, exists(select 1 from information_schema.columns where table_name = 'admin_push_state' and column_name = 'last_purchase_at') as push_col")
          row = r[0] if isinstance(r, list) and r else {}
          if code >= 300 or not row.get("push_col"): fail.append(f"schema betalen: HTTP {code} {str(r)[:200]}")
          else: print(f"::notice::betalen: {row['purchases']} aankopen, {row['events']} verwerkte Stripe-events")
          for f in fail: print(f"::error::{f[:400]}")
          sys.exit(1 if fail else 0)
          PY

  # aparte job: de deploy-job zit aan het maximum van 50 meldingen
  inbox:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Wachten op een ronde van de planning
        # build 95: de planning loopt elke 5 minuten
        run: sleep 320
      - name: Support - inbox-status
        run: |
          # laatste ronde van de inbox-import (support_inbox_state); geen mailinhoud of adressen
          python3 -c 'import json;print(json.dumps({"query":"select mailbox, last_poll_at, last_ok_at, last_error_at, left(coalesce(last_error,\x27\x27),200) as last_error, last_result, last_source from public.support_inbox_state where id = 1"}))' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/inbox.json
          python3 - <<'PY'
          import json
          try: r = json.load(open("/tmp/inbox.json")); row = r[0] if isinstance(r, list) and r else {}
          except Exception: row = {}
          res = row.get("last_result")
          if isinstance(res, str):
              try: res = json.loads(res)
              except Exception: pass
          print(f"::notice::Inbox: map {row.get('mailbox') or '-'} · laatste ronde {row.get('last_poll_at') or 'nooit'} ({row.get('last_source') or '-'}) · laatst gelukt {row.get('last_ok_at') or 'nooit'}")
          if isinstance(res, dict): print("::notice::Inbox-resultaat: " + ", ".join(f"{k}={v}" for k, v in res.items() if k not in ("log",))[:400])
          if row.get("last_error"): print(f"::warning::Inbox-fout ({row.get('last_error_at')}): {row['last_error']}")
          PY

  # aparte job (eigen ruimte voor meldingen): voor- en achternaam bij een account (user_metadata first_name / last_name)
  namen:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Account met naam end-to-end (tijdelijk account)
        # Tijdelijk account met voor- en achternaam (zoals de apps bij het aanmaken meesturen; via de admin-API, zodat er geen
        # bevestigingsmail naar een nep-adres gaat): de trigger bingr_user_names schoont de naam op, een naam met een link wordt
        # geweigerd, de gebruiker kan zijn naam wijzigen (PUT /auth/v1/user), bingr_first_names vindt hem, en de accountmails
        # hebben de aanhef {{ .Data.first_name }}. Het testaccount wordt altijd verwijderd; sleutels en tokens worden gemaskeerd.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, secrets, sys, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]
          BASE = f"https://{REF}.supabase.co"; PUB = "sb_publishable_lpIup6Omq5kW2k3oICGZ4g_HPGac5A3"
          def req(method, url, body=None, headers=None):
              h = {"Content-Type": "application/json", **(headers or {})}
              r = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: raw = resp.read(); code = resp.status
              except urllib.error.HTTPError as e: raw = e.read(); code = e.code
              try: return code, json.loads(raw or b"{}")
              except Exception: return code, {"raw": raw[:200].decode("utf-8", "replace")}
          def sql(q):
              return req("POST", f"https://api.supabase.com/v1/projects/{REF}/database/query", {"query": q}, {"Authorization": f"Bearer {MGMT}"})
          code, keys = req("GET", f"https://api.supabase.com/v1/projects/{REF}/api-keys?reveal=true", headers={"Authorization": f"Bearer {MGMT}"})
          key = None
          for k in keys if isinstance(keys, list) else []:
              v = k.get("api_key") or ""
              if v and (k.get("name") == "service_role" or k.get("type") == "secret") and "·" not in v: key = v; break
          if not key: print(f"::warning::namen end-to-end overgeslagen: geen geheime sleutel (HTTP {code})"); sys.exit(0)
          print(f"::add-mask::{key}")
          adm = {"apikey": key, **({"Authorization": f"Bearer {key}"} if key.startswith("ey") else {})}
          fail, made = [], []
          # accountmails: aanhef met de voornaam (alleen als die er is)
          code, cfg = req("GET", f"https://api.supabase.com/v1/projects/{REF}/config/auth", headers={"Authorization": f"Bearer {MGMT}"})
          for t in ("confirmation", "recovery", "magic_link", "email_change"):
              c = (cfg or {}).get(f"mailer_templates_{t}_content") or ""
              if code == 200 and not ("{{ if .Data.first_name }}" in c and "Hoi {{ .Data.first_name }}," in c and "Hi {{ .Data.first_name }}," in c):
                  fail.append(f"template {t}: geen aanhef met .Data.first_name")
          email, pw = f"ci-naam-{secrets.token_hex(6)}@example.com", secrets.token_urlsafe(18)
          try:
              code, u = req("POST", f"{BASE}/auth/v1/admin/users", {"email": email, "password": pw, "email_confirm": True,
                            "user_metadata": {"lang": "nl", "first_name": "  Ci \t Test  ", "last_name": " van  der   Bingr "}}, adm)
              uid = u.get("id")
              if not uid: raise SystemExit(f"testaccount met naam aanmaken mislukt (HTTP {code} {str(u)[:200]})")
              made.append(uid)
              code, r = req("GET", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
              m = (r or {}).get("user_metadata") or {}
              if m.get("first_name") != "Ci Test" or m.get("last_name") != "van der Bingr" or m.get("lang") != "nl":
                  fail.append(f"naam niet opgeschoond: {m}")
              # een naam met een link of HTML wordt geweigerd (geen account)
              bad = f"ci-naam-{secrets.token_hex(6)}@example.com"
              code, r = req("POST", f"{BASE}/auth/v1/admin/users", {"email": bad, "password": pw, "email_confirm": True, "user_metadata": {"first_name": "www.spam.example"}}, adm)
              if r.get("id"): made.append(r["id"]); fail.append(f"naam met link niet geweigerd (HTTP {code})")
              # de gebruiker wijzigt zijn naam zelf (zoals Mijn Bingr)
              code, t = req("POST", f"{BASE}/auth/v1/token?grant_type=password", {"email": email, "password": pw}, {"apikey": PUB})
              tok = t.get("access_token")
              if not tok: raise SystemExit(f"inloggen testaccount mislukt (HTTP {code})")
              print(f"::add-mask::{tok}")
              code, r = req("PUT", f"{BASE}/auth/v1/user", {"data": {"first_name": " Anna ", "last_name": "Bingr"}}, {"apikey": PUB, "Authorization": f"Bearer {tok}"})
              # het antwoord van PUT toont de invoer van vóór de trigger; de opgeschoonde naam staat daarna in de database
              if code != 200: fail.append(f"naam wijzigen: HTTP {code}")
              code, r = req("GET", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
              m = (r or {}).get("user_metadata") or {}
              if m.get("first_name") != "Anna" or m.get("last_name") != "Bingr": fail.append(f"naam wijzigen niet opgeschoond: {m}")
              code, r = req("PUT", f"{BASE}/auth/v1/user", {"data": {"first_name": "<b>x</b>"}}, {"apikey": PUB, "Authorization": f"Bearer {tok}"})
              if code < 400: fail.append(f"naam met HTML niet geweigerd (HTTP {code})")
              code, r = sql(f"select first_name from public.bingr_first_names(array['{email.upper()}'])")
              if code >= 300 or not isinstance(r, list) or [x.get("first_name") for x in r] != ["Anna"]: fail.append(f"bingr_first_names: HTTP {code} {str(r)[:200]}")
              if not fail: print("::notice::Namen: opschonen, weigeren, zelf wijzigen, opzoeken en aanhef in de accountmails werken")
          except SystemExit as e:
              fail.append(str(e))
          finally:
              for uid in made:
                  code, _ = req("DELETE", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
                  if code not in (200, 204): print(f"::warning::testaccount niet verwijderd (HTTP {code})")
          for f in fail: print(f"::error::{f[:400]}")
          sys.exit(1 if fail else 0)
          PY

  # aparte job (build 134): bescherming tegen nepaccounts end-to-end. De regels van de hook worden met SQL getest (zonder
  # echte aanmeldingen: geen bevestigingsmails), met adressen uit 192.0.2.0/24 (documentatie, nooit een echte gebruiker);
  # hun pogingen worden daarna verwijderd. Eén echte aanmelding met een wegwerpadres bewijst dat Auth de hook aanroept
  # (geweigerd vóór het aanmaken: geen account en geen mail). Het opruimen van onbevestigde accounts wordt getest met een
  # tijdelijk account (admin-API, geen mail) dat 49 uur ouder gemaakt wordt. Sleutels worden gemaskeerd; geen IP- of e-mailadressen in het log.
  registratie:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Registratiebescherming testen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, random, secrets, sys, time, urllib.request, urllib.error
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]
          BASE = f"https://{REF}.supabase.co"; PUB = "sb_publishable_lpIup6Omq5kW2k3oICGZ4g_HPGac5A3"
          def req(method, url, body=None, headers=None):
              h = {"Content-Type": "application/json", **(headers or {})}
              r = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(), method=method, headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: raw = resp.read(); code = resp.status
              except urllib.error.HTTPError as e: raw = e.read(); code = e.code
              try: return code, json.loads(raw or b"{}")
              except Exception: return code, {"raw": raw[:200].decode("utf-8", "replace")}
          def sql(q):
              return req("POST", f"https://api.supabase.com/v1/projects/{REF}/database/query", {"query": q}, {"Authorization": f"Bearer {MGMT}"})
          fail, made = [], []
          ip = f"192.0.2.{random.randint(1, 254)}"
          def ev(addr, email, meta=None):
              return json.dumps({"metadata": {"name": "before-user-created", "ip_address": addr},
                                 "user": {"email": email, "app_metadata": {"provider": "email", "providers": ["email"]},
                                          "user_metadata": meta or {}, "is_anonymous": False}}).replace("'", "''")
          def hook(addr, email, meta=None):
              code, r = sql(f"select public.bingr_before_user_created('{ev(addr, email, meta)}'::jsonb) r")
              if code >= 300 or not isinstance(r, list) or not r: raise SystemExit(f"hook aanroepen mislukt (HTTP {code})")
              return r[0].get("r") or {}
          def status(r): return ((r or {}).get("error") or {}).get("http_code")
          code, keys = req("GET", f"https://api.supabase.com/v1/projects/{REF}/api-keys?reveal=true", headers={"Authorization": f"Bearer {MGMT}"})
          key = None
          for k in keys if isinstance(keys, list) else []:
              v = k.get("api_key") or ""
              if v and (k.get("name") == "service_role" or k.get("type") == "secret") and "·" not in v: key = v; break
          if key: print(f"::add-mask::{key}")
          adm = {"apikey": key or "", **({"Authorization": f"Bearer {key}"} if key and key.startswith("ey") else {})}
          t0, real_rejected = None, False
          try:
              # 0. hook staat aan in Auth
              code, cfg = req("GET", f"https://api.supabase.com/v1/projects/{REF}/config/auth", headers={"Authorization": f"Bearer {MGMT}"})
              if code != 200 or cfg.get("hook_before_user_created_enabled") is not True or not str(cfg.get("hook_before_user_created_uri") or "").endswith("/public/bingr_before_user_created"):
                  fail.append("hook Before User Created staat niet aan in Auth")
              if code == 200 and cfg.get("mailer_autoconfirm") is not False: fail.append("bevestigen per e-mail staat niet aan")
              # 1. per netwerk: 3 per uur, de 4e geweigerd (429); de 4 aanroepen in één query, na elkaar
              q = ", ".join(f"public.bingr_before_user_created('{ev(ip, f'ci-{i}-{secrets.token_hex(3)}@example.com')}'::jsonb) r{i}" for i in range(1, 5))
              code, r = sql(f"select {q}")
              row = r[0] if code < 300 and isinstance(r, list) and r else {}
              got = [status(row.get(f"r{i}")) for i in range(1, 5)]
              if got != [None, None, None, 429]: fail.append(f"limiet per netwerk: verwacht [-, -, -, 429], kreeg {got} (HTTP {code})")
              elif not str(row["r4"]["error"].get("message", "")).startswith("Too many"): fail.append("melding bij de limiet")
              # 2. wegwerpadres (ook subdomein) en naam met een link: 400; zonder IP (admin): toegestaan
              ip2 = f"192.0.2.{(int(ip.split('.')[-1]) % 254) + 1}"
              if status(hook(ip2, f"ci-{secrets.token_hex(4)}@mailinator.com")) != 400: fail.append("wegwerpadres niet geweigerd")
              if status(hook(ip2, f"ci-{secrets.token_hex(4)}@ci.yopmail.com")) != 400: fail.append("wegwerp-subdomein niet geweigerd")
              if status(hook(ip2, f"ci-{secrets.token_hex(4)}@example.com", {"first_name": "www.spam.example", "last_name": "x"})) != 400: fail.append("naam met link niet geweigerd")
              if hook(None, f"ci-{secrets.token_hex(4)}@mailinator.com") != {}: fail.append("zonder IP (admin) niet toegestaan")
              code, r = sql("select count(*)::int n from public.disposable_domains where source = 'list'")
              n = r[0].get("n") if code < 300 and isinstance(r, list) and r else 0
              if not n or n < 1000: print(f"::warning::wegwerplijst niet geladen ({n} domeinen uit de lijst); alleen de eigen lijst werkt")
              # 3. tellingen voor het beheer
              code, r = sql("select public.bingr_admin_signup_guard() g")
              g = r[0].get("g") if code < 300 and isinstance(r, list) and r else None
              if not isinstance(g, dict) or not isinstance(g.get("rejected_24h"), dict) or (g["rejected_24h"].get("rate_limit") or 0) < 1:
                  fail.append(f"bingr_admin_signup_guard: HTTP {code}")
              # 4. echte aanmelding met een wegwerpadres via Auth: geweigerd door de hook (geen account, geen mail)
              code, r = sql("select now()::text t")
              t0 = r[0]["t"] if code < 300 and isinstance(r, list) and r else None
              code, r = req("POST", f"{BASE}/auth/v1/signup", {"email": f"ci-{secrets.token_hex(6)}@mailinator.com", "password": secrets.token_urlsafe(18),
                            "data": {"lang": "en", "first_name": "Ci", "last_name": "Test"}}, {"apikey": PUB})
              if (r or {}).get("id") or ((r or {}).get("user") or {}).get("id"):
                  made.append((r.get("user") or r).get("id")); fail.append("aanmelding met wegwerpadres niet geweigerd (hook niet actief?)")
              elif code == 400 and "permanent email" in str(r.get("msg") or r.get("message") or "").lower():
                  real_rejected = True
                  print("::notice::Auth roept de hook aan: aanmelding met wegwerpadres geweigerd (400)")
              elif code == 429:
                  # limiet van Supabase zelf op dit IP (andere tests): de hook is dan niet bereikt
                  print("::warning::aanmelding met wegwerpadres: HTTP 429 van Supabase, hook niet bereikt")
              else:
                  fail.append(f"aanmelding met wegwerpadres: HTTP {code} {str(r)[:160]}")
              # 5. onbevestigd account na 48 uur weg; een account met een abonnement blijft
              if not key: raise SystemExit("geen geheime sleutel: opruimtest overgeslagen")
              ids = []
              for _ in range(2):
                  code, u = req("POST", f"{BASE}/auth/v1/admin/users", {"email": f"ci-onbevestigd-{secrets.token_hex(6)}@example.com",
                                "password": secrets.token_urlsafe(18), "email_confirm": False}, adm)
                  if not u.get("id"): raise SystemExit(f"testaccount aanmaken mislukt (HTTP {code})")
                  made.append(u["id"]); ids.append(u["id"])
              code, r = sql(f"update auth.users set created_at = now() - interval '49 hours' where id in ('{ids[0]}', '{ids[1]}');\n"
                            f"insert into public.account_plans (user_id, plan, source, granted_by) values ('{ids[1]}', 'free', 'admin', 'ci');\n"
                            f"select public.bingr_signup_cleanup('{ids[0]}') a, public.bingr_signup_cleanup('{ids[1]}') b")
              row = r[0] if code < 300 and isinstance(r, list) and r else {}
              if (row.get("a") or {}).get("deleted") != 1: fail.append(f"onbevestigd account niet opgeruimd (HTTP {code} {str(r)[:160]})")
              if (row.get("b") or {}).get("deleted") != 0: fail.append("account met abonnement toch opgeruimd")
              code, _ = req("GET", f"{BASE}/auth/v1/admin/users/{ids[0]}", None, adm)
              if code != 404: fail.append(f"opgeruimd account bestaat nog (HTTP {code})")
              else: made.remove(ids[0])
              code, r = sql("select count(*)::int n from cron.job where jobname = 'bingr-unconfirmed-cleanup' and active")
              if not (code < 300 and isinstance(r, list) and r and r[0].get("n") == 1): print("::warning::planning bingr-unconfirmed-cleanup ontbreekt")
              if not fail: print("::notice::Registratiebescherming: limiet per netwerk, wegwerpadressen, namen, admin, Auth-hook en opruimen werken")
          except SystemExit as e:
              fail.append(str(e))
          finally:
              # testpogingen weg (eigen documentatie-IP's en de ene echte aanmelding), zodat het beheer alleen echte telt
              ip2 = f"192.0.2.{(int(ip.split('.')[-1]) % 254) + 1}"
              sql(f"delete from public.signup_attempts where ip_hash in (public.bingr_signup_ip_hash('{ip}'), public.bingr_signup_ip_hash('{ip2}'))")
              if t0 and real_rejected: sql(f"delete from public.signup_attempts where id = (select max(id) from public.signup_attempts where reason = 'disposable' and at >= '{t0}'::timestamptz)")
              for uid in made:
                  code, _ = req("DELETE", f"{BASE}/auth/v1/admin/users/{uid}", None, adm)
                  if code not in (200, 204, 404): print(f"::warning::testaccount niet verwijderd (HTTP {code})")
          for f in fail: print(f"::error::{f[:400]}")
          sys.exit(1 if fail else 0)
          PY
