          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/sq.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/sq.json"))
          row = r[0] if isinstance(r, list) and r else None
          if not row or '"t:serie"' not in json.dumps(row["item"]) or "buckets" not in json.dumps(row["stats"]):
              print("::error::bingr_stats_item/bingr_watch_stats onverwacht:", str(r)[:400]); raise SystemExit(1)
          print("::notice::Statistieken-SQL werkt:", json.dumps(row["item"]), "| leeg account:", json.dumps(row["stats"])[:200])
          PY
          # build 95: groottegrens op account_data (trigger) staat er
          echo '{"query":"select exists(select 1 from pg_trigger where tgname = $$bingr_account_data_size$$ and tgrelid = $$public.account_data$$::regclass) as ok"}' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/tg.json
          grep -Eq '"ok": ?true' /tmp/tg.json && echo "::notice::account_data-groottegrens actief" || { echo "::error::trigger bingr_account_data_size ontbreekt: $(head -c 200 /tmp/tg.json)"; exit 1; }
          for fn in device-auth web-proxy; do
            curl -s -X POST "https://$REF.supabase.co/functions/v1/$fn" -H "Content-Type: application/json" -d '{"action":"ping"}' | tee /tmp/p.json; echo
            grep -q '"ok":true' /tmp/p.json && echo "::notice::$fn ping werkt" || { echo "::error::$fn ping onverwacht"; exit 1; }
          done
          # build 95: kan de proxy DNS opvragen en IP's vastzetten (bescherming tegen interne adressen en DNS-rebinding)?
          curl -s -X POST "https://$REF.supabase.co/functions/v1/web-proxy" -H "Content-Type: application/json" -d '{"action":"ping"}' > /tmp/p.json
          grep -q '"dns":true' /tmp/p.json && echo "::notice::web-proxy: DNS-controle actief" || echo "::warning::web-proxy: runtime kan geen DNS opvragen; alleen hostnaam/IP-controle"
          grep -q '"pin":true' /tmp/p.json && echo "::notice::web-proxy: http-verbindingen naar het gecontroleerde IP" || echo "::notice::web-proxy: IP vastzetten uit (aan met BINGR_PROXY_PIN_IP=1); DNS wordt vlak voor elke aanvraag gecontroleerd"
          # admin (privé-repo bingr-beheer): alleen kijken of hij er nog staat, als waarschuwing (deze workflow deployt hem niet)
