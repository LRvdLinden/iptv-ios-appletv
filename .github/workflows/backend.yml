      - name: Supporttickets testen
        if: steps.check.outputs.skip != '1'
        run: |
          F="https://$REF.supabase.co/functions/v1/support"
          sleep 3
          # 1. ping en preflight vanaf support.bingr.online
          curl -s -X POST "$F" -H "Content-Type: application/json" -d '{"action":"ping"}' | tee /tmp/p.json; echo
          grep -q '"ok":true' /tmp/p.json && echo "::notice::support ping werkt" || { echo "::error::support ping onverwacht"; exit 1; }
          acao=$(curl -s -D - -o /dev/null -X OPTIONS "$F" -H "Origin: https://support.bingr.online" -H "Access-Control-Request-Method: POST" \
            | grep -i '^access-control-allow-origin:' | tr -d '\r' | cut -d' ' -f2-)
          [ "$acao" = "https://support.bingr.online" ] && echo "::notice::support preflight met CORS voor https://support.bingr.online" || { echo "::error::support preflight zonder CORS ('$acao')"; exit 1; }
          acao=$(curl -s -D - -o /dev/null -X OPTIONS "$F" -H "Origin: https://example.com" -H "Access-Control-Request-Method: POST" | grep -ci '^access-control-allow-origin:' || true)
          [ "$acao" = 0 ] && echo "::notice::andere sites krijgen geen CORS" || { echo "::error::support geeft CORS aan een andere site"; exit 1; }
          # 2. leeg ticket: validatiefout (er wordt niets aangemaakt of gemaild)
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Origin: https://support.bingr.online" -H "Content-Type: application/json" -d '{"action":"create"}')
          cat /tmp/c.json; echo
          [ "$code" = 400 ] && grep -q name_missing /tmp/c.json && echo "::notice::lege create: 400 name_missing" || { echo "::error::lege create gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"create","website":"spam","name":"x"}')
          # build 93: lokveld → schijnbaar "gelukt" (200), maar er wordt niets opgeslagen: het teruggegeven ticket bestaat niet
          [ "$code" = 200 ] && grep -q '"ok":true' /tmp/c.json || { echo "::error::lokveld gaf HTTP $code"; exit 1; }
          hn=$(python3 -c 'import json;print(json.load(open("/tmp/c.json"))["number"])'); ht=$(python3 -c 'import json;print(json.load(open("/tmp/c.json"))["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d "{\"action\":\"get\",\"n\":$hn,\"t\":\"$ht\"}")
          [ "$code" = 404 ] && echo "::notice::lokveld werkt: stil tegengehouden, niets opgeslagen" || { echo "::error::lokveld: schijnticket gaf HTTP $code (opgeslagen?)"; exit 1; }
          # build 95: captcha (proof-of-work). challenge geeft een opgave; create met geldige velden maar zonder (of met een
          # vervalste) pow geeft schijnbaar "gelukt" (200), maar er wordt niets opgeslagen of gemaild
          python3 - "$F" <<'PY'
          import json, sys, urllib.request, urllib.error
          F = sys.argv[1]
          def post(body):
              r = urllib.request.Request(F, data=json.dumps(body).encode(), method="POST", headers={"Content-Type": "application/json", "Origin": "https://support.bingr.online"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp: return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e: return e.code, json.loads(e.read() or b"{}")
          fail = []
          code, c = post({"action": "challenge"})
          if code != 200 or c.get("algorithm") != "SHA-256" or not isinstance(c.get("difficulty"), int) or not (16 <= c["difficulty"] <= 24) \
             or len(str(c.get("salt", ""))) != 32 or len(str(c.get("signature", ""))) != 64 or not isinstance(c.get("expires"), int):
              fail.append(f"challenge HTTP {code}: {str(c)[:200]}")
          ticket = {"action": "create", "name": "CI", "email": "ci-pow@example.com", "category": "overig", "subject": "CI captcha-test",
                    "message": "CI-test zonder captcha; mag niet worden opgeslagen.", "lang": "nl", "website": "", "elapsed_ms": 10000}
          cases = [("zonder pow", ticket), ("vervalste pow", {**ticket, "pow": {**{k: c.get(k) for k in ("salt", "difficulty", "expires")}, "signature": "0" * 64, "nonce": "1"}}),
                   ("ongeldige nonce", {**ticket, "pow": {**{k: c.get(k) for k in ("salt", "difficulty", "expires", "signature")}, "nonce": "1"}})]
          for name, body in cases:
              code, r = post(body)
              if code != 200 or r.get("ok") is not True or not r.get("number") or not r.get("token"): fail.append(f"create {name}: HTTP {code} {str(r)[:200]}"); continue
              code2, g = post({"action": "get", "n": r["number"], "t": r["token"]})
              if code2 != 404: fail.append(f"create {name}: schijnticket gaf HTTP {code2} (opgeslagen?)")
          for f in fail: print(f"::error::{f[:300]}")
          if fail: raise SystemExit(1)
          print(f"::notice::captcha werkt: challenge (moeilijkheid {c['difficulty']}), create zonder/met vervalste pow stil tegengehouden")
          PY
          # 3. zonder geheime link of inloggen geen ticket; zonder inloggen geen lijst; zonder geheim geen beheer
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"get","n":1001,"t":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}')
          [ "$code" = 404 ] && echo "::notice::get met fout token: 404" || { echo "::error::get met fout token gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"mine"}')
          [ "$code" = 401 ] && echo "::notice::mine zonder inloggen: 401" || { echo "::error::mine zonder inloggen gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"my_devices"}')
          [ "$code" = 401 ] && grep -q not_signed_in /tmp/c.json && echo "::notice::my_devices zonder inloggen: 401" || { echo "::error::my_devices zonder inloggen gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -H "Authorization: Bearer a.b.c" -d '{"action":"my_devices"}')
          [ "$code" = 401 ] && echo "::notice::my_devices met ongeldig token: 401" || { echo "::error::my_devices met ongeldig token gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -H "x-support-secret: fout" -d '{"action":"admin_list"}')
          [ "$code" = 403 ] && echo "::notice::beheer zonder geheim: 403" || { echo "::error::admin_list zonder geheim gaf HTTP $code"; exit 1; }
          # 4. inbox-import: zonder geheim 403, met het geheim ok of skipped (IMAP niet ingesteld)
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST "$F" -H "Content-Type: application/json" -d '{"action":"poll_inbox"}')
          [ "$code" = 403 ] && echo "::notice::poll_inbox zonder geheim: 403" || { echo "::error::poll_inbox zonder geheim gaf HTTP $code"; exit 1; }
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' --max-time 90 -X POST "$F" -H "Content-Type: application/json" \
            -H "x-support-cron: $(cat "$RUNNER_TEMP/support_cron_secret")" -d '{"action":"poll_inbox","source":"deploy"}')
          python3 - "$code" <<'PY'
          import json, sys
          code = sys.argv[1]
          try: r = json.load(open("/tmp/c.json"))
          except Exception: r = {}
          if code != "200": print(f"::error::poll_inbox gaf HTTP {code}: {str(r)[:300]}"); raise SystemExit(1)
          if r.get("skipped"): print(f"::notice::Inbox-import: {r['skipped']} (BINGR_IMAP_* niet gezet)")
          elif r.get("busy"): print("::notice::Inbox-import: er liep al een ronde (planning)")
          elif r.get("ok"): print(f"::notice::Inbox-import werkt: {r.get('fetched',0)} opgehaald, {r.get('imported',0)} reacties, {r.get('agent',0)} antwoorden support, {r.get('new_tickets',0)} nieuwe tickets, {r.get('ignored',0)} genegeerd, {r.get('rejected',0)} geweigerd ({r.get('ms')} ms, map: {r.get('folder') or 'geen Bingr-verwerkt'})")
          else: print(f"::warning::Inbox-import gaf een fout: {r.get('error','?')} — controleer BINGR_IMAP_*")
          PY
          # 5. tabellen en tellers in de database
          python3 -c 'import json;print(json.dumps({"query":"select public.bingr_support_counts() as counts, (select last_value from public.support_ticket_number_seq) as seq, (select count(*) from public.support_inbox_state) as inbox"}))' > /tmp/q.json
          curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/sq.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/sq.json"))
          row = r[0] if isinstance(r, list) and r else None
          if not row or "active" not in json.dumps(row.get("counts")): print("::error::bingr_support_counts onverwacht:", str(r)[:300]); raise SystemExit(1)
          c = row["counts"] if isinstance(row["counts"], dict) else json.loads(row["counts"])
          if row.get("inbox") != 1: print("::error::support_inbox_state ontbreekt:", str(r)[:300]); raise SystemExit(1)
