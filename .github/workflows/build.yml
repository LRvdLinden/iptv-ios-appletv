name: Build

# Twee jobs naast elkaar, allebei direct bij een push naar main:
#   aanleveren  XcodeGen, Xcode-project zippen en versleuteld aanleveren bij de privé repo bingr-inbox (± 1-2 min);
#               wacht niet op het compileren: Léon test de Apple-apps zelf in Xcode.
#   compileren  compileercontrole iOS, tvOS en macOS (generic, zonder simulator en zonder signing) plus de zelftest;
#               logboek op de branch ci-logs (latest.txt).
# De statusmonitor `apple` (bingr.online/status) telt alleen deze twee jobs (doel ...|build.yml|main|aanleveren,compileren).
# Sinds 30-10-2026: geen simulator-rooktests meer in CI (geen start-rooktest, geen zware nachtelijke rooktest, geen sdk27-job,
# geen testaccount). tools/smoke_launch.sh en SmokeMode blijven in de code voor handmatig gebruik.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/covers.yml', 'tools/fetch_covers.py', 'tools/make_screenshots.py', 'tools/sync_website.py', '.github/workflows/mac-archive.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  aanleveren:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      # Swift-packages (VLCKit) bewaren tussen runs
      - name: Packages uit de cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: App-sleutels inbouwen (alleen bij een privé-repo)
        if: github.event.repository.private == true
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # TMDB: v3-sleutel (TMDB_API_KEY), anders de v4-token (TMDB_ACCESS_TOKEN)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
          # Bingr-accounts (Supabase): project-URL en publieke anon/publishable key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/inject_keys.py

      - name: Project genereren
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      # legt de package-versies vast (Package.resolved in het .xcodeproj), zodat de zip in Xcode meteen opent
      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Bingr.xcodeproj -scheme Bingr -derivedDataPath build > resolve.log 2>&1 || { tail -n 40 resolve.log; exit 1; }

      # Xcode-project versleuteld naar de PRIVÉ repo LRvdLinden/bingr-inbox (tools/seal_build.sh van bingr-beheer, branch
      # inbox-apple); de workflow Builds van bingr-beheer haalt het daar op en zet het in de afgesloten map builds/ op de
      # server van beheer.bingr.online. Nooit onversleuteld op GitHub: geen artefact, geen release, niet op ci-logs.
      # Nodig: secret BINGR_INBOX_TOKEN (fine-grained token met alleen Contents: Read and write op LRvdLinden/bingr-inbox).
      # H3: géén token voor bingr-beheer (daarmee kon je het beheer-dashboard vervangen); die openbare repo (script en
      # publieke sleutel) wordt anoniem gekloond, en het token gaat nooit in een URL (seal_build.sh geeft het als kopregel mee).
      - name: Xcode-project versleuteld aanleveren voor beheer.bingr.online
        env:
          TOKEN: ${{ secrets.BINGR_INBOX_TOKEN }}
          BINGR_INBOX_REPO: LRvdLinden/bingr-inbox
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')   # spaties/regeleinde van het plakken weghalen
          # bewust geen terugval op een ander token: zonder BINGR_INBOX_TOKEN wordt er niets aangeleverd
          if [ -z "$TOKEN" ]; then echo "::warning::Secret BINGR_INBOX_TOKEN ontbreekt: Xcode-project niet aangeleverd (zie README.md van bingr-beheer, H3)."; exit 0; fi
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | grep -o '[0-9]\+'); V=$(grep -m1 'MARKETING_VERSION' project.yml | grep -o '[0-9.]\+' || echo 1.0.0)
          P="$RUNNER_TEMP/pkg"; rm -rf "$P"; mkdir -p "$P"
          # kant-en-klaar Xcode-project (met gegenereerd .xcodeproj en vastgelegde package-versies),
          # zonder git, build-map, logs, docs/screenshots en docs/covers (die horen niet in het pakket)
          zip -qr "$P/Bingr-$V-build$B-Xcode.zip" . -x '.git/*' 'build/*' '*.log' 'docs/screenshots/*' 'docs/covers/*'
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' CHANGELOG.md > "$P/notes.md" || true
          # anoniem (openbare repo): seal_build.sh en builds.pub.pem
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 https://github.com/LRvdLinden/bingr-beheer.git "$P/beheer" 2>/dev/null \
            || { echo "::error::bingr-beheer niet op te halen."; exit 1; }
          TOKEN="$TOKEN" "$P/beheer/tools/seal_build.sh" apple "$P/Bingr-$V-build$B-Xcode.zip" "$V" "$B" "$P/notes.md"
          rm -rf "$P"
          echo "::notice title=aangeleverd::Xcode-project build $B aangeleverd"

  compileren:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Packages uit de cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Vertalingen controleren
        run: python3 tools/extract_strings.py

      # build 144: geen sleutelhanger of iCloud meer als opslag (alleen de eenmalige overzetting)
      - name: Geen sleutelhanger of iCloud bij de start
        run: python3 tools/check_no_keychain.py

      - name: Project genereren
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Bingr.xcodeproj -scheme Bingr -derivedDataPath build > resolve.log 2>&1 || { tail -n 40 resolve.log; exit 1; }

      # De zelftest (swiftc -O, ± 1,5 min) loopt op de achtergrond mee met de builds.
      - name: Zelftest starten (pure logica, op de achtergrond)
        run: |
          ( set -o pipefail
            swiftc -O Shared/Account/CatalogMeta.swift Shared/Account/Build140.swift Shared/Account/Build141.swift Shared/Account/Build145.swift Shared/Account/Build146.swift Shared/Account/Build147.swift Shared/Account/Build148.swift Shared/Account/Build149.swift Shared/Account/Build150.swift Shared/Account/Build151.swift tools/selftest/main.swift -o "$RUNNER_TEMP/selftest" > selftest.log 2>&1 \
              && "$RUNNER_TEMP/selftest" >> selftest.log 2>&1
            echo $? > "$RUNNER_TEMP/selftest.rc" ) &

      # Alleen compileren: generic device-builds (alleen arm64, geen simulator), zonder signing en zonder indexering.
      - name: Build iOS (generic, zonder signing)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme Bingr -derivedDataPath build \
            -destination 'generic/platform=iOS' COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > ios.log 2>&1 || { grep -E "error:" ios.log | sort -u | head -40; exit 1; }

      - name: Build tvOS (generic, zonder signing)
        id: tvos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV -derivedDataPath build \
            -destination 'generic/platform=tvOS' COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > tvos.log 2>&1 || { grep -E "error:" tvos.log | sort -u | head -40; exit 1; }

      - name: Build macOS (arm64, zonder signing)
        id: macos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrMac -derivedDataPath build \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > macos.log 2>&1 || { grep -E "error:" macos.log | sort -u | head -40; exit 1; }

      - name: Zelftest afwachten
        id: selftest
        continue-on-error: true
        run: |
          for i in $(seq 1 300); do [ -f "$RUNNER_TEMP/selftest.rc" ] && break; sleep 2; done
          tail -n 60 selftest.log || true
          exit "$(cat "$RUNNER_TEMP/selftest.rc" 2>/dev/null || echo 1)"

      - name: Build-rapport publiceren (branch ci-logs)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/report"; R="$RUNNER_TEMP/report"
          {
            echo "commit: $GITHUB_SHA"
            echo "ios: ${{ steps.ios.outcome }}"
            echo "tvos: ${{ steps.tvos.outcome }}"
            echo "macos: ${{ steps.macos.outcome }}"
            echo "selftest: ${{ steps.selftest.outcome }}"
            echo
            echo "=== selftest ==="
            tail -n 60 selftest.log || true
            echo
            echo "=== iOS errors ==="
            grep -E "error:|warning: .*(unavailable|deprecated in)" ios.log | sort -u | head -300 || true
            echo
            echo "=== tvOS errors ==="
            grep -E "error:" tvos.log | sort -u | head -300 || true
            echo
            echo "=== macOS errors ==="
            grep -E "error:" macos.log | sort -u | head -300 || true
          } > "$R/latest.txt"
          tail -n 200 ios.log > "$R/ios-tail.txt" || true
          tail -n 200 tvos.log > "$R/tvos-tail.txt" || true
          tail -n 200 macos.log > "$R/macos-tail.txt" || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git reset --hard -q
          git switch --orphan ci-logs-tmp
          git rm -rf --quiet . || true
          cp "$R"/*.txt .
          git add latest.txt ios-tail.txt tvos-tail.txt macos-tail.txt
          git commit -q -m "build $GITHUB_SHA ios=${{ steps.ios.outcome }} tvos=${{ steps.tvos.outcome }} macos=${{ steps.macos.outcome }} selftest=${{ steps.selftest.outcome }}"
          git push -f origin HEAD:ci-logs

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success' || steps.selftest.outcome != 'success'
        run: exit 1
