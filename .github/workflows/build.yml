name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/covers.yml', 'tools/fetch_covers.py', 'tools/make_screenshots.py', 'tools/sync_website.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Vertalingen controleren
        run: python3 tools/extract_strings.py

      - name: App-sleutels inbouwen (alleen bij een privé-repo)
        if: github.event.repository.private == true
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # TMDB: v3-sleutel (TMDB_API_KEY), anders de v4-token (TMDB_ACCESS_TOKEN)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
          # Bingr-accounts (Supabase): project-URL en publieke anon/publishable key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/inject_keys.py

      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Bingr.xcodeproj -scheme Bingr

      - name: Build iOS (simulator, zonder signing)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme Bingr \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ios.log

      - name: Build tvOS (simulator, zonder signing)
        id: tvos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee tvos.log

      - name: Build macOS (zonder signing)
        id: macos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee macos.log

      - name: Build-rapport publiceren (branch ci-logs)
        if: always()
        env:
          BEHEER_TOKEN: ${{ secrets.BINGR_BEHEER_TOKEN }}
        run: |
          mkdir -p report
          {
            echo "commit: $GITHUB_SHA"
            echo "ios: ${{ steps.ios.outcome }}"
            echo "tvos: ${{ steps.tvos.outcome }}"
            echo "macos: ${{ steps.macos.outcome }}"
            echo
            echo "=== iOS errors ==="
            grep -E "error:|warning: .*(unavailable|deprecated in)" ios.log | sort -u | head -300 || true
            echo
            echo "=== tvOS errors ==="
            grep -E "error:" tvos.log | sort -u | head -300 || true
            echo
            echo "=== macOS errors ==="
            grep -E "error:" macos.log | sort -u | head -300 || true
          } > report/latest.txt
          # kant-en-klaar Xcode-project (met gegenereerd .xcodeproj en vastgelegde package-versies)
          zip -qr report/Bingr-xcode.zip . -x '.git/*' 'report/*' '*.log' 'build/*'
          tail -n 200 ios.log > report/ios-tail.txt || true
          tail -n 200 tvos.log > report/tvos-tail.txt || true
          tail -n 200 macos.log > report/macos-tail.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin ci-logs || true
          # ingebouwde sleutels zitten al in de zip; werkmap weer schoon maken voor de branch-wissel
          git reset --hard -q
          git switch --orphan ci-logs-tmp
          git rm -rf --quiet . || true
          cp report/*.txt .
          git add latest.txt ios-tail.txt tvos-tail.txt macos-tail.txt
          # het nieuwste Xcode-project ook op ci-logs (overschreven per build; de vaste versies staan in bingr-beheer/versions)
          cp report/Bingr-xcode.zip . && git add Bingr-xcode.zip
          git commit -m "build $GITHUB_SHA ios=${{ steps.ios.outcome }} tvos=${{ steps.tvos.outcome }} macos=${{ steps.macos.outcome }}"
          git push -f origin HEAD:ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bingr-xcode
          path: report/Bingr-xcode.zip
          if-no-files-found: ignore
          retention-days: 30

      # Xcode-project naar bingr-beheer/versions/apple/<versie>-build<N>/ (alleen als iOS, tvOS en macOS slagen).
      # Nodig: secret BINGR_BEHEER_TOKEN (fine-grained token met Contents: Read and write op LRvdLinden/bingr-beheer).
      - name: In bingr-beheer/versions zetten
        if: steps.ios.outcome == 'success' && steps.tvos.outcome == 'success' && steps.macos.outcome == 'success'
        env:
          TOKEN: ${{ secrets.BINGR_BEHEER_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')   # spaties/regeleinde van het plakken weghalen
          echo "::notice::BINGR_BEHEER_TOKEN: ${#TOKEN} tekens, begint met $(printf '%s' "$TOKEN" | cut -c1-4)…"
          if [ -z "$TOKEN" ]; then echo "::warning::Secret BINGR_BEHEER_TOKEN ontbreekt: Xcode-project alleen op branch ci-logs."; exit 0; fi
          # (de werkmap is na de ci-logs-stap leeg; versie en build komen uit het project in de zip)
          mkdir -p /tmp/pkg && cd /tmp/pkg && rm -rf x && mkdir x && cd x && unzip -q "$GITHUB_WORKSPACE/report/Bingr-xcode.zip"
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | grep -o '[0-9]\+'); V=$(grep -m1 'MARKETING_VERSION' project.yml | grep -o '[0-9.]\+' || echo 1.0.0)
          # zonder docs/screenshots en docs/covers (die horen niet in het pakket)
          rm -rf docs/screenshots docs/covers
          zip -qr "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" .
          cd /tmp/pkg
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/LRvdLinden/bingr-beheer.git" beheer
          # schrijfrechten van het token meteen controleren (ook als er niets nieuws is)
          git -C beheer push --dry-run -q origin HEAD:main 2>/dev/null && echo "::notice::BINGR_BEHEER_TOKEN: schrijven naar bingr-beheer werkt" || { echo "::error::BINGR_BEHEER_TOKEN mag niet schrijven naar bingr-beheer (Contents: Read and write nodig)"; exit 1; }
          # per platform alleen de nieuwste build (versions/Apple/v<versie>/); staat deze build er al, dan niets doen
          CUR=$(python3 -c "import json;print(json.load(open('beheer/versions/latest.json')).get('apple',{}).get('build',0))" 2>/dev/null || echo 0)
          if [ "$CUR" -ge "$B" ]; then echo "::notice::Apple $V build $B staat al in versions/"; exit 0; fi
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' x/CHANGELOG.md > notes.md || true
          python3 beheer/tools/add_version.py apple "$B" "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" --notes notes.md --version "$V"
          cd beheer && git add -A versions
          if git diff --cached --quiet; then echo "::notice::Niets nieuws voor versions/"; exit 0; fi
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Versies: Apple $V build $B ($(echo $GITHUB_SHA | cut -c1-7))"
          ok=""
          for i in 1 2 3; do
            if git push -q 2>push.err; then ok=1; break; fi
            echo "::warning::Push naar bingr-beheer mislukt (poging $i): $(tr '\n' ' ' < push.err | sed 's#x-access-token:[^@]*@#***@#g' | head -c 300)"
            git pull -q --rebase || { git fetch -q --depth 20 origin main && git rebase -q origin/main; }
          done
          [ -n "$ok" ] || { echo "::error::Niet in bingr-beheer/versions gezet: push mislukt. Heeft BINGR_BEHEER_TOKEN Contents: Read and write op LRvdLinden/bingr-beheer?"; exit 1; }
          echo "::notice::In bingr-beheer/versions gezet: Apple $V build $B"

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success'
        run: exit 1
