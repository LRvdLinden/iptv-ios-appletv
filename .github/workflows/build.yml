name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/covers.yml', 'tools/fetch_covers.py', 'tools/make_screenshots.py', 'tools/sync_website.py', '.github/workflows/mac-archive.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Vertalingen controleren
        run: python3 tools/extract_strings.py

      - name: App-sleutels inbouwen (alleen bij een privé-repo)
        if: github.event.repository.private == true
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # TMDB: v3-sleutel (TMDB_API_KEY), anders de v4-token (TMDB_ACCESS_TOKEN)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
          # Bingr-accounts (Supabase): project-URL en publieke anon/publishable key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/inject_keys.py

      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Bingr.xcodeproj -scheme Bingr

      - name: Build iOS (simulator, zonder signing)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme Bingr \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ios.log

      - name: Build tvOS (simulator, zonder signing)
        id: tvos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee tvos.log

      - name: Build macOS (zonder signing)
        id: macos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee macos.log

      - name: Build-rapport publiceren (branch ci-logs)
        if: always()
        run: |
          mkdir -p report
          {
            echo "commit: $GITHUB_SHA"
            echo "ios: ${{ steps.ios.outcome }}"
            echo "tvos: ${{ steps.tvos.outcome }}"
            echo "macos: ${{ steps.macos.outcome }}"
            echo
            echo "=== iOS errors ==="
            grep -E "error:|warning: .*(unavailable|deprecated in)" ios.log | sort -u | head -300 || true
            echo
            echo "=== tvOS errors ==="
            grep -E "error:" tvos.log | sort -u | head -300 || true
            echo
            echo "=== macOS errors ==="
            grep -E "error:" macos.log | sort -u | head -300 || true
          } > report/latest.txt
          # kant-en-klaar Xcode-project (met gegenereerd .xcodeproj en vastgelegde package-versies)
          zip -qr report/Bingr-xcode.zip . -x '.git/*' 'report/*' '*.log' 'build/*'
          tail -n 200 ios.log > report/ios-tail.txt || true
          tail -n 200 tvos.log > report/tvos-tail.txt || true
          tail -n 200 macos.log > report/macos-tail.txt || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin ci-logs || true
          # ingebouwde sleutels zitten al in de zip; werkmap weer schoon maken voor de branch-wissel
          git reset --hard -q
          git switch --orphan ci-logs-tmp
          git rm -rf --quiet . || true
          cp report/*.txt .
          git add latest.txt ios-tail.txt tvos-tail.txt macos-tail.txt
          # build 105: het Xcode-project staat niet meer op ci-logs (de branch is openbaar); alleen de logs
          git commit -m "build $GITHUB_SHA ios=${{ steps.ios.outcome }} tvos=${{ steps.tvos.outcome }} macos=${{ steps.macos.outcome }}"
          git push -f origin HEAD:ci-logs

      # Xcode-project versleuteld naar de PRIVÉ repo LRvdLinden/bingr-inbox (tools/seal_build.sh van bingr-beheer, branch
      # inbox-apple); de workflow Builds van bingr-beheer haalt het daar op en zet het in de afgesloten map builds/ op de
      # server van beheer.bingr.online (alleen als iOS, tvOS en macOS slagen).
      # Nooit onversleuteld op GitHub: geen artefact, geen release, niet op ci-logs.
      # Nodig: secret BINGR_INBOX_TOKEN (fine-grained token met alleen Contents: Read and write op LRvdLinden/bingr-inbox).
      # H3: géén token voor bingr-beheer meer (daarmee kon je het beheer-dashboard vervangen); die openbare repo (script en
      # publieke sleutel) wordt anoniem gekloond, en het token gaat nooit in een URL (seal_build.sh geeft het als kopregel mee).
      - name: Xcode-project versleuteld aanleveren voor beheer.bingr.online
        if: steps.ios.outcome == 'success' && steps.tvos.outcome == 'success' && steps.macos.outcome == 'success'
        env:
          TOKEN: ${{ secrets.BINGR_INBOX_TOKEN }}
          BINGR_INBOX_REPO: LRvdLinden/bingr-inbox
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')   # spaties/regeleinde van het plakken weghalen
          # bewust geen terugval op een ander token: zonder BINGR_INBOX_TOKEN wordt er niets aangeleverd
          if [ -z "$TOKEN" ]; then echo "::warning::Secret BINGR_INBOX_TOKEN ontbreekt: Xcode-project niet aangeleverd (zie README.md van bingr-beheer, H3)."; exit 0; fi
          # (de werkmap is na de ci-logs-stap leeg; versie en build komen uit het project in de zip)
          mkdir -p /tmp/pkg && cd /tmp/pkg && rm -rf x && mkdir x && cd x && unzip -q "$GITHUB_WORKSPACE/report/Bingr-xcode.zip"
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | grep -o '[0-9]\+'); V=$(grep -m1 'MARKETING_VERSION' project.yml | grep -o '[0-9.]\+' || echo 1.0.0)
          # zonder docs/screenshots en docs/covers (die horen niet in het pakket)
          rm -rf docs/screenshots docs/covers
          zip -qr "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" .
          cd /tmp/pkg
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' x/CHANGELOG.md > notes.md || true
          # anoniem (openbare repo): seal_build.sh en builds.pub.pem
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 https://github.com/LRvdLinden/bingr-beheer.git beheer 2>/dev/null \
            || { echo "::error::bingr-beheer niet op te halen."; exit 1; }
          TOKEN="$TOKEN" beheer/tools/seal_build.sh apple "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" "$V" "$B" notes.md
          rm -rf /tmp/pkg

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success'
        run: exit 1
