name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/covers.yml', 'tools/fetch_covers.py', 'tools/make_screenshots.py', 'tools/sync_website.py', '.github/workflows/mac-archive.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Xcode-versie kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Vertalingen controleren
        run: python3 tools/extract_strings.py

      - name: Zelftest pure logica (build 128, CatalogMeta)
        id: selftest
        continue-on-error: true
        run: |
          set -o pipefail
          swiftc -O Shared/Account/CatalogMeta.swift Shared/Account/Build140.swift Shared/Account/Build141.swift tools/selftest/main.swift -o "$RUNNER_TEMP/selftest" 2>&1 | tee selftest.log
          "$RUNNER_TEMP/selftest" 2>&1 | tee -a selftest.log

      - name: App-sleutels inbouwen (alleen bij een privé-repo)
        if: github.event.repository.private == true
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # TMDB: v3-sleutel (TMDB_API_KEY), anders de v4-token (TMDB_ACCESS_TOKEN)
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || secrets.TMDB_ACCESS_TOKEN }}
          # Bingr-accounts (Supabase): project-URL en publieke anon/publishable key
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/inject_keys.py

      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Bingr.xcodeproj -scheme Bingr -derivedDataPath build

      - name: Build iOS (simulator, zonder signing)
        id: ios
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme Bingr -derivedDataPath build \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ios.log

      - name: Build tvOS (simulator, zonder signing)
        id: tvos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV -derivedDataPath build \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee tvos.log

      - name: Build macOS (zonder signing)
        id: macos
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrMac -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee macos.log

      # build 141: tijdelijk testaccount (Lifetime) voor de rooktest met een Bingr-account; wordt aan het eind altijd
      # weer verwijderd. Adres en wachtwoord zijn willekeurig en gemaskeerd (tools/smoke_account.py).
      - name: Testaccount voor de start-rooktest
        if: steps.ios.outcome == 'success' || steps.tvos.outcome == 'success' || steps.macos.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 -I tools/smoke_account.py create

      # build 141: de apps echt starten (simulator en Mac) en ±30 s laten draaien, ook als terugkerende gebruiker en
      # met een kinderprofiel (tools/smoke_launch.sh, Shared/App/SmokeMode.swift); een crash laat de workflow falen,
      # met de crash-stack als ::error:: (zonder persoonsgegevens)
      - name: Start-rooktest iOS (simulator)
        id: smoke_ios
        if: steps.ios.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: tools/smoke_launch.sh ios build/Build/Products "$RUNNER_TEMP/smoke/ios" 2>&1 | tee smoke-ios.log; exit ${PIPESTATUS[0]}

      # build 141: de Apple TV-app ook als Release (geoptimaliseerd, zoals de App Store-build) voor de rooktest; alleen
      # het vlag BINGR_SMOKE erbij, zodat de testmodus via het launch-argument werkt
      - name: Build tvOS Release voor de start-rooktest
        id: tvos_release
        if: steps.tvos.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV -configuration Release -derivedDataPath build \
            -destination 'generic/platform=tvOS Simulator' SWIFT_ACTIVE_COMPILATION_CONDITIONS=BINGR_SMOKE \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tail -n 40

      - name: Start-rooktest tvOS (simulator)
        id: smoke_tvos
        if: steps.tvos_release.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        # Apple TV heeft veel minder geheugen dan een iPhone of Mac: daarboven stopt tvOS de app (lijkt een crash)
        env:
          SMOKE_MAX_MB: "1500"
          SMOKE_CONFIG: Release
        run: tools/smoke_launch.sh tvos build/Build/Products "$RUNNER_TEMP/smoke/tvos" 2>&1 | tee smoke-tvos.log; exit ${PIPESTATUS[0]}

      - name: Start-rooktest macOS
        id: smoke_macos
        if: steps.macos.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: tools/smoke_launch.sh macos build/Build/Products "$RUNNER_TEMP/smoke/macos" 2>&1 | tee smoke-macos.log; exit ${PIPESTATUS[0]}

      - name: Testaccount van de start-rooktest verwijderen
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 -I tools/smoke_account.py delete

      - name: Build-rapport publiceren (branch ci-logs)
        if: always()
        run: |
          mkdir -p report
          {
            echo "commit: $GITHUB_SHA"
            echo "ios: ${{ steps.ios.outcome }}"
            echo "tvos: ${{ steps.tvos.outcome }}"
            echo "macos: ${{ steps.macos.outcome }}"
            echo "selftest: ${{ steps.selftest.outcome }}"
            echo "smoke: ios=${{ steps.smoke_ios.outcome }} tvos=${{ steps.smoke_tvos.outcome }} macos=${{ steps.smoke_macos.outcome }}"
            echo
            echo "=== selftest ==="
            tail -n 60 selftest.log || true
            echo
            echo "=== start-rooktest ==="
            for p in ios tvos macos; do grep -aE "^(Simulator|$p/|[0-9]+ .*get|Start-rooktest|== |app:|exception:|termination:|reason:|asi |thread |  [ 0-9][0-9] |-- |BINGR_SMOKE)" smoke-$p.log 2>/dev/null | grep -v '^::' | grep -v tabblad | head -n 300; done
            echo
            echo "=== iOS errors ==="
            grep -E "error:|warning: .*(unavailable|deprecated in)" ios.log | sort -u | head -300 || true
            echo
            echo "=== tvOS errors ==="
            grep -E "error:" tvos.log | sort -u | head -300 || true
            echo
            echo "=== macOS errors ==="
            grep -E "error:" macos.log | sort -u | head -300 || true
          } > report/latest.txt
          # kant-en-klaar Xcode-project (met gegenereerd .xcodeproj en vastgelegde package-versies)
          zip -qr report/Bingr-xcode.zip . -x '.git/*' 'report/*' '*.log' 'build/*'
          tail -n 200 ios.log > report/ios-tail.txt || true
          tail -n 200 tvos.log > report/tvos-tail.txt || true
          tail -n 200 macos.log > report/macos-tail.txt || true
          mkdir -p report/smoke
          for p in ios tvos macos; do for f in "$RUNNER_TEMP/smoke/$p/"*.png; do
            [ -f "$f" ] && cp "$f" "report/smoke/$p-$(basename "$f")"; done; done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin ci-logs || true
          # ingebouwde sleutels zitten al in de zip; werkmap weer schoon maken voor de branch-wissel
          git reset --hard -q
          git switch --orphan ci-logs-tmp
          git rm -rf --quiet . || true
          cp report/*.txt .
          mkdir -p smoke && cp report/smoke/*.png smoke/ 2>/dev/null || true
          git add latest.txt ios-tail.txt tvos-tail.txt macos-tail.txt
          git add smoke 2>/dev/null || true
          # build 105: het Xcode-project staat niet meer op ci-logs (de branch is openbaar); alleen de logs
          git commit -m "build $GITHUB_SHA ios=${{ steps.ios.outcome }} tvos=${{ steps.tvos.outcome }} macos=${{ steps.macos.outcome }} smoke=${{ steps.smoke_ios.outcome }}/${{ steps.smoke_tvos.outcome }}/${{ steps.smoke_macos.outcome }}"
          git push -f origin HEAD:ci-logs

      # Xcode-project versleuteld naar de PRIVÉ repo LRvdLinden/bingr-inbox (tools/seal_build.sh van bingr-beheer, branch
      # inbox-apple); de workflow Builds van bingr-beheer haalt het daar op en zet het in de afgesloten map builds/ op de
      # server van beheer.bingr.online (alleen als iOS, tvOS en macOS slagen).
      # Nooit onversleuteld op GitHub: geen artefact, geen release, niet op ci-logs.
      # Nodig: secret BINGR_INBOX_TOKEN (fine-grained token met alleen Contents: Read and write op LRvdLinden/bingr-inbox).
      # H3: géén token voor bingr-beheer meer (daarmee kon je het beheer-dashboard vervangen); die openbare repo (script en
      # publieke sleutel) wordt anoniem gekloond, en het token gaat nooit in een URL (seal_build.sh geeft het als kopregel mee).
      - name: Xcode-project versleuteld aanleveren voor beheer.bingr.online
        # build 141: alleen als de apps ook echt starten (start-rooktest)
        if: steps.ios.outcome == 'success' && steps.tvos.outcome == 'success' && steps.macos.outcome == 'success' && steps.tvos_release.outcome == 'success' && steps.smoke_ios.outcome == 'success' && steps.smoke_tvos.outcome == 'success' && steps.smoke_macos.outcome == 'success'
        env:
          TOKEN: ${{ secrets.BINGR_INBOX_TOKEN }}
          BINGR_INBOX_REPO: LRvdLinden/bingr-inbox
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')   # spaties/regeleinde van het plakken weghalen
          # bewust geen terugval op een ander token: zonder BINGR_INBOX_TOKEN wordt er niets aangeleverd
          if [ -z "$TOKEN" ]; then echo "::warning::Secret BINGR_INBOX_TOKEN ontbreekt: Xcode-project niet aangeleverd (zie README.md van bingr-beheer, H3)."; exit 0; fi
          # (de werkmap is na de ci-logs-stap leeg; versie en build komen uit het project in de zip)
          mkdir -p /tmp/pkg && cd /tmp/pkg && rm -rf x && mkdir x && cd x && unzip -q "$GITHUB_WORKSPACE/report/Bingr-xcode.zip"
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | grep -o '[0-9]\+'); V=$(grep -m1 'MARKETING_VERSION' project.yml | grep -o '[0-9.]\+' || echo 1.0.0)
          # zonder docs/screenshots en docs/covers (die horen niet in het pakket)
          rm -rf docs/screenshots docs/covers
          zip -qr "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" .
          cd /tmp/pkg
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' x/CHANGELOG.md > notes.md || true
          # anoniem (openbare repo): seal_build.sh en builds.pub.pem
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 https://github.com/LRvdLinden/bingr-beheer.git beheer 2>/dev/null \
            || { echo "::error::bingr-beheer niet op te halen."; exit 1; }
          TOKEN="$TOKEN" beheer/tools/seal_build.sh apple "/tmp/pkg/Bingr-$V-build$B-Xcode.zip" "$V" "$B" notes.md
          rm -rf /tmp/pkg

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success' || steps.selftest.outcome != 'success' || steps.tvos_release.outcome != 'success' || steps.smoke_ios.outcome != 'success' || steps.smoke_tvos.outcome != 'success' || steps.smoke_macos.outcome != 'success'
        run: exit 1
