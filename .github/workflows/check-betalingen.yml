name: Check betalingen (tijdelijk)
# Tijdelijk en ALLEEN LEZEN: telt misgelopen betalingen (Apple en Stripe) en toont alleen aantallen als annotaties.
# Geen e-mailadressen, account-id's of bedragen in het (openbare) log. Wijzigt niets.
on:
  push:
    branches: [check-betalingen]
    paths: ['.github/check-betalingen.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tellen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def note(t, m): print(f"::notice title={t}::{m}")
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          st = db("select key, value from app_settings where key in ('premium','lifetime_only','iap')")
          S = {x['key']: (x['value'] if isinstance(x['value'], dict) else json.loads(x['value'])) for x in st}
          pr, lo = S.get('premium', {}), S.get('lifetime_only', {})
          note("Instellingen premium", json.dumps({k: pr.get(k) for k in ('enabled','new_from_web','new_from_apple','existing_from','trial_days')} | {"test_users": len(pr.get('test_users') or [])}))
          note("Instellingen lifetime_only", json.dumps({k: lo.get(k) for k in ('enabled','cutover_at','new_paid_from','new_paid_from_apple','trial_days')} | {"iap": S.get('iap')}))
          for label, since in (("web/Android", pr.get('new_from_web') or lo.get('new_paid_from')), ("Apple", pr.get('new_from_apple') or lo.get('new_paid_from_apple'))):
              if not since: note(f"Sinds {label}", "geen datum"); continue
              q = f"""
              with n as (select u.id, u.created_at,
                  exists(select 1 from billing_purchases b where b.user_id = u.id and b.status = 'paid') as lt,
                  exists(select 1 from account_plans p where p.user_id = u.id and p.plan = 'lifetime' and p.note ilike 'Apple sandbox%') as sandbox,
                  exists(select 1 from account_plans p where p.user_id = u.id and p.plan = 'lifetime' and p.source in ('admin','legacy')) as gratis,
                  exists(select 1 from premium_subscriptions s where s.user_id = u.id and s.status in ('trialing','active','grace','past_due')) as abo,
                  (select string_agg(distinct d.platform, '+') from account_devices d where d.user_id = u.id) as plat,
                  (select max(d.last_seen_at) from account_devices d where d.user_id = u.id) as seen,
                  (select count(*) from account_streams a where a.user_id = u.id) as streams_nu
                from auth.users u where u.created_at >= '{since}'::timestamptz)
              select count(*) totaal, count(*) filter (where lt and not sandbox) betaald_lifetime, count(*) filter (where sandbox) sandbox_lifetime,
                count(*) filter (where gratis) gratis_gekregen, count(*) filter (where abo) abonnement,
                count(*) filter (where not lt and not abo and not gratis) zonder_iets,
                count(*) filter (where not lt and not abo and not gratis and seen > created_at + interval '6 hours') zonder_iets_later_nog_actief,
                count(*) filter (where not lt and not abo and not gratis and seen > now() - interval '2 days') zonder_iets_actief_2d,
                count(*) filter (where not lt and not abo and not gratis and streams_nu > 0) zonder_iets_kijkt_nu
              from n"""
              note(f"Accounts sinds {label} ({since[:16]})", json.dumps(db(q)[0]))
              q2 = f"""select coalesce((select string_agg(distinct d.platform, '+') from account_devices d where d.user_id = u.id), 'geen apparaat') as plat, count(*) n
                from auth.users u where u.created_at >= '{since}'::timestamptz
                and not exists(select 1 from billing_purchases b where b.user_id = u.id and b.status = 'paid')
                and not exists(select 1 from premium_subscriptions s where s.user_id = u.id and s.status in ('trialing','active','grace','past_due'))
                and not exists(select 1 from account_plans p where p.user_id = u.id and p.plan = 'lifetime')
                group by 1 order by 2 desc"""
              note(f"Zonder plan sinds {label}: per platform", json.dumps({x['plat']: x['n'] for x in db(q2)}))
          PY
