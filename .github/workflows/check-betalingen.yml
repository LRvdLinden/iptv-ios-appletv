name: Check betalingen (tijdelijk)
# Tijdelijk en ALLEEN LEZEN: telt misgelopen betalingen (Apple en Stripe) en toont alleen aantallen als annotaties.
# Geen e-mailadressen, account-id's of bedragen in het (openbare) log. Wijzigt niets.
on:
  push:
    branches: [check-betalingen]
    paths: ['.github/check-betalingen.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tellen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def note(t, m): print(f"::notice title={t}::{m}")
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          # Alleen een korte hash-prefix van het adres (6 tekens), nooit het adres zelf.
          k = "left(encode(sha256(convert_to(lower(u.email),'UTF8')),'hex'),6)"
          r = db(f"select {k} as h, (u.created_at at time zone 'Europe/Amsterdam')::text as aangemaakt, (p.created_at at time zone 'Europe/Amsterdam')::text as plan_sinds, p.source, "
                 "left(coalesce(p.note,''),14) as notitie, "
                 "(select string_agg(coalesce(b.provider,'stripe') || ':' || b.status || ':' || b.amount, ',') from billing_purchases b where b.user_id = u.id) as aankopen, "
                 "(select string_agg(s.provider || ':' || s.status || ':' || s.plan || ':' || coalesce(s.mode,'?'), ',') from premium_subscriptions s where s.user_id = u.id) as abos "
                 "from account_plans p join auth.users u on u.id = p.user_id where p.plan = 'lifetime' and p.created_at > now() - interval '8 days' order by p.created_at")
          for i, x in enumerate(r): note(f"Lifetime 8 dagen {i+1}", json.dumps(x))
          r = db("select (b.created_at at time zone 'Europe/Amsterdam')::text as nl, coalesce(b.provider,'stripe') as provider, b.status, b.amount, (b.user_id is not null) as gekoppeld, "
                 "(select left(coalesce(p.note,''),14) from account_plans p where p.user_id = b.user_id) as notitie "
                 "from billing_purchases b where b.created_at > now() - interval '8 days' order by b.created_at")
          note("Aankopen 8 dagen", json.dumps(r))
          PY
