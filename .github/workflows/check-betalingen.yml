name: Check betalingen (tijdelijk)
# Tijdelijk en ALLEEN LEZEN: telt misgelopen betalingen (Apple en Stripe) en toont alleen aantallen als annotaties.
# Geen e-mailadressen, account-id's of bedragen in het (openbare) log. Wijzigt niets.
on:
  push:
    branches: [check-betalingen]
    paths: ['.github/check-betalingen.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tellen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def note(t, m): print(f"::notice title={t}::{m}")
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          # Geen adressen of apparaatnamen: alleen een hash-prefix, het soort domein en de platforms.
          k = "left(encode(sha256(convert_to(lower(u.email),'UTF8')),'hex'),6)"
          dom = "case when u.email ilike '%@apple.com' then 'apple.com' when u.email ilike '%@privaterelay.appleid.com' then 'verberg-mijn-email' when u.email ilike '%@icloud.com' or u.email ilike '%@me.com' then 'icloud' else 'overig' end"
          r = db(f"select {k} as h, {dom} as domein, (u.created_at at time zone 'Europe/Amsterdam')::text as aangemaakt, (u.last_sign_in_at at time zone 'Europe/Amsterdam')::text as laatst_ingelogd, "
                 "(select string_agg(d.platform || ' (laatst ' || to_char(d.last_seen_at at time zone 'Europe/Amsterdam','DD-MM HH24:MI') || ')', ', ') from account_devices d where d.user_id = u.id) as apparaten, "
                 "(select count(*) from account_devices d where d.user_id = u.id) as n_apparaten "
                 "from auth.users u where exists (select 1 from billing_purchases b join account_plans p on p.user_id = b.user_id where b.user_id = u.id and p.note ilike 'Apple sandbox%') "
                 "or exists (select 1 from premium_subscriptions s where s.user_id = u.id and s.mode = 'test') order by u.created_at")
          for i, x in enumerate(r): note(f"Sandbox-account {i+1}", json.dumps(x))
          r = db(f"select count(*) n from auth.users u where {k} = 'deb835'")
          note("Testaccount gevonden (hash deb835)", str(r[0]['n']))
          r = db(f"select p.plan, p.source, left(coalesce(p.note,''),14) as notitie, (p.created_at at time zone 'Europe/Amsterdam')::text as sinds, "
                 "(select string_agg(s.provider || ':' || s.status || ':' || coalesce(s.mode,'?'), ',') from premium_subscriptions s where s.user_id = u.id) as abos "
                 f"from auth.users u left join account_plans p on p.user_id = u.id where {k} = 'deb835'")
          note("Testaccount plan", json.dumps(r))
          r = db("select count(*) n from account_plans p where p.note ilike 'Apple sandbox%'")
          note("Totaal accounts met sandbox-Lifetime (ooit)", str(r[0]['n']))
          r = db("select count(*) n from premium_subscriptions s where s.mode = 'test' and s.provider = 'apple'")
          note("Totaal Apple-abonnementen in testmodus (ooit)", str(r[0]['n']))
          PY
