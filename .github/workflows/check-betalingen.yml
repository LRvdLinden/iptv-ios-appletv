name: Check betalingen (tijdelijk)
# Tijdelijk en ALLEEN LEZEN: telt misgelopen betalingen (Apple en Stripe) en toont alleen aantallen als annotaties.
# Geen e-mailadressen, account-id's of bedragen in het (openbare) log. Wijzigt niets.
on:
  push:
    branches: [check-betalingen]
    paths: ['.github/check-betalingen.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tellen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def note(t, m): print(f"::notice title={t}::{m}")
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          k = "left(encode(sha256(convert_to(lower(u.email),'UTF8')),'hex'),6)"
          r = db("select count(*) n from account_plans p where p.note ilike 'Apple sandbox%'")
          note("Accounts met sandbox-Lifetime nu", str(r[0]['n']))
          r = db("select to_char(b.created_at at time zone 'Europe/Amsterdam','YYYY-MM-DD') as dag, count(*) n, string_agg(b.amount::text || coalesce(b.currency,''), ',') as bedragen "
                 "from billing_purchases b join account_plans p on p.user_id = b.user_id where b.provider = 'apple' and p.note ilike 'Apple sandbox%' group by 1 order by 1")
          note("Sandbox-Lifetime-aankopen per dag", "; ".join(f"{x['dag'][5:]}: {x['n']} ({x['bedragen']})" for x in r))
          r = db("select count(*) n, count(*) filter (where s.user_id is not null) gekoppeld, count(*) filter (where s.status in ('trialing','active','grace')) actief from premium_subscriptions s where s.mode = 'test' and s.provider = 'apple'")
          note("Apple-abonnementen in testmodus (totaal|gekoppeld|actief)", f"{r[0]['n']}|{r[0]['gekoppeld']}|{r[0]['actief']}")
          r = db("select count(*) n from billing_purchases b where b.provider = 'apple' and b.status = 'paid' and not exists (select 1 from account_plans p where p.user_id = b.user_id and p.note ilike 'Apple sandbox%')")
          note("Echte Apple-Lifetime-aankopen (niet sandbox)", str(r[0]['n']))
          r = db(f"select count(*) n from auth.users u where {k} = 'deb835'")
          note("Testaccount gevonden (hash deb835)", str(r[0]['n']))
          r = db(f"select p.plan, p.source, left(coalesce(p.note,''),14) as notitie, (p.created_at at time zone 'Europe/Amsterdam')::text as sinds, "
                 "(select string_agg(s.provider || ':' || s.status || ':' || coalesce(s.mode,'?'), ',') from premium_subscriptions s where s.user_id = u.id) as abos "
                 f"from auth.users u left join account_plans p on p.user_id = u.id where {k} = 'deb835'")
          note("Testaccount plan", json.dumps(r))
          r = db("select count(distinct d.user_id) n from account_devices d join account_plans p on p.user_id = d.user_id where p.note ilike 'Apple sandbox%' and d.last_seen_at > now() - interval '7 days'")
          note("Sandbox-accounts actief in 7 dagen", str(r[0]['n']))
          PY
