name: Check betalingen (tijdelijk)
# Tijdelijk en ALLEEN LEZEN: telt misgelopen betalingen (Apple en Stripe) en toont alleen aantallen als annotaties.
# Geen e-mailadressen, account-id's of bedragen in het (openbare) log. Wijzigt niets.
on:
  push:
    branches: [check-betalingen]
    paths: ['.github/check-betalingen.txt']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tellen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def note(t, m): print(f"::notice title={t}::{m}")
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          r = db("select (created_at at time zone 'Europe/Amsterdam')::date as dag, count(*) nieuw, count(*) filter (where email_confirmed_at is not null) bevestigd "
                 "from auth.users where created_at > now() - interval '10 days' group by 1 order by 1")
          note("Nieuwe accounts per dag (nieuw|bevestigd)", "; ".join(f"{x['dag'][5:]}: {x['nieuw']}|{x['bevestigd']}" for x in r))
          r = db("select (p.created_at at time zone 'Europe/Amsterdam')::date as dag, p.plan, coalesce(p.source,'-') src, "
                 "(p.granted_by is not null) heeft_granted_by, (u.created_at > now() - interval '10 days') nieuw_account, count(*) n "
                 "from account_plans p join auth.users u on u.id = p.user_id where p.created_at > now() - interval '5 days' and p.plan = 'lifetime' group by 1,2,3,4,5 order by 1")
          note("Nieuwe lifetime-rijen (5 dagen) per bron", json.dumps(r))
          r = db("select u.created_at at time zone 'Europe/Amsterdam' as aangemaakt, p.created_at at time zone 'Europe/Amsterdam' as plan_sinds, p.plan, p.source, "
                 "p.granted_by is not null as gb, left(coalesce(p.note,''),60) as notitie, "
                 "exists(select 1 from billing_purchases b where b.user_id = u.id and b.status = 'paid') as betaald_lifetime, "
                 "exists(select 1 from premium_subscriptions s where s.user_id = u.id) as heeft_abo "
                 "from account_plans p join auth.users u on u.id = p.user_id where p.plan = 'lifetime' and p.created_at > now() - interval '3 days' order by p.created_at")
          for i, x in enumerate(r): note(f"Lifetime laatste 3 dagen {i+1}", json.dumps(x, default=str))
          r = db("select count(*) filter (where p.plan is null or p.plan = 'free') zonder_plan, count(*) filter (where p.plan = 'lifetime') met_lifetime, "
                 "count(*) filter (where exists(select 1 from premium_subscriptions s where s.user_id = u.id)) met_abo "
                 "from auth.users u left join account_plans p on p.user_id = u.id where u.created_at > now() - interval '3 days'")
          note("Accounts van de laatste 3 dagen", json.dumps(r))
          PY
