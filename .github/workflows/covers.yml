name: Covers

# Haalt vrije posters (Wikimedia Commons) op voor de mockups/website en zet ze in docs/covers.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/fetch_covers.py']

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/fetch_covers.py
      - name: Vastleggen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/covers
          git diff --cached --quiet && { echo "geen wijzigingen"; exit 0; }
          git commit -m "Covers bijgewerkt [skip ci]"
          git pull --rebase -q origin main
          git push origin HEAD:main
