name: Diagnose status (tijdelijk)
# Alleen openbare gegevens van de statusfunctie (zelfde als bingr.online/status); geen sleutels, geen adressen.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Openbare status van e-mail (SMTP)
        run: |
          U=https://vjewsncmsxmhmhnoxwqx.supabase.co/functions/v1/status
          curl -s "$U?action=public" > p.json
          python3 - <<'PY'
          import json
          d=json.load(open('p.json'))
          def walk(o,path=''):
              if isinstance(o,dict):
                  if any(str(v).lower() in ('smtp',) for v in o.values()) or 'smtp' in json.dumps(o).lower()[:400] and 'id' in o:
                      print(path, json.dumps(o)[:800])
                  for k,v in o.items(): walk(v,path+'.'+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o): walk(v,path+f'[{i}]')
          print('keys:', list(d.keys()) if isinstance(d,dict) else type(d))
          walk(d)
          PY
          curl -s "$U?action=history&page=1" | python3 -c "import json,sys;d=json.load(sys.stdin);s=json.dumps(d);i=s.lower().find('smtp');print(s[max(0,i-600):i+1500] if i>=0 else s[:1500])"
