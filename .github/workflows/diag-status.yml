name: Diagnose status (tijdelijk)
# Tijdelijk: sluit de storing op de statuspagina nadat de fix van build 187 live is gecontroleerd.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  sluiten:
    runs-on: ubuntu-latest
    steps:
      - name: Storing sluiten
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          dbq() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$(python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$1")"; echo; }
          dbq "with u as (update status_notices set status='resolved', resolved_at=now(), updated_at=now() where id=138 and status<>'resolved' returning id) insert into status_notice_updates (notice_id, status, body_nl, body_en, auto, at) select id, 'resolved', 'Opgelost: abonnementen via Apple worden weer herkend. Wie het probeerde, krijgt Premium na het openen van de app, of met Herstel aankopen in Instellingen. Onze excuses voor het ongemak.', 'Resolved: subscriptions through Apple are recognised again. If you tried to subscribe, you will get Premium after opening the app, or with Restore Purchases in Settings. We apologise for the inconvenience.', false, now() from u returning notice_id"
          dbq "select id, status, resolved_at is not null as gesloten from status_notices where id=138"
          dbq "select count(*) as open_meldingen from status_notices where status not in ('resolved','completed','cancelled')"
