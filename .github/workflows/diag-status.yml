name: Diagnose status (tijdelijk)
# Tijdelijk: test of TheIntroDB (openbaar, geen sleutel) tijden geeft voor bekende series.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  introdb:
    runs-on: ubuntu-latest
    steps:
      - name: TheIntroDB
        run: |
          for q in "1396 1 2" "1399 1 1" "66732 1 1" "94997 1 1" "100088 1 1" "1668 1 1" "60625 1 1" "76479 1 1"; do
            set -- $q
            code=$(curl -s -o r.json -w '%{http_code}' "https://api.theintrodb.org/v4/media?tmdb_id=$1&season=$2&episode=$3")
            echo "tmdb $1 S$2E$3 -> HTTP $code $(head -c 300 r.json)"
          done
