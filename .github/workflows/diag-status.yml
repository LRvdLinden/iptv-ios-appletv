name: Diagnose status (tijdelijk)
# Tijdelijk: laat Stripe één melding sturen voor het abonnement met een mislukte betaling (alleen een metadata-sleutel erbij),
# zodat de database de gecorrigeerde toegangsduur van build 187 overneemt. Daarna controle.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - name: Herberekenen en controleren
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          K: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          dbq() { curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$(python3 -c 'import json,sys;print(json.dumps({"query":sys.argv[1]}))' "$1")"; echo; }
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          K = os.environ["K"]
          def call(method, path, data=None):
              req = urllib.request.Request("https://api.stripe.com/v1/" + path, method=method, headers={"Authorization": "Bearer " + K},
                                           data=urllib.parse.urlencode(data).encode() if data else None)
              return json.load(urllib.request.urlopen(req, timeout=30))
          subs = [s for s in call("GET", "subscriptions?status=past_due&limit=5")["data"]]
          print("past_due abonnementen:", len(subs))
          for s in subs:
              r = call("POST", "subscriptions/" + s["id"], {"metadata[bingr_resync]": "2026-11-27"})
              print("bijgewerkt:", r["status"])
          PY
          sleep 25
          dbq "select provider, plan, status, expires_at::timestamp(0) exp, access_until::timestamp(0) toegang from premium_subscriptions where provider='stripe'"
          dbq "select plan, source, expires_at::timestamp(0) exp from account_plans where source='subscription'"
