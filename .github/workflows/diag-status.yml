name: Diagnose status (tijdelijk)
# Tijdelijk: controleert de live fix van build 187 en sluit daarna de storing op de statuspagina.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  sluiten:
    runs-on: ubuntu-latest
    steps:
      - name: Live controle en storing sluiten
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET: ${{ secrets.STATUS_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, sys
          url = os.environ["URL"].rstrip("/")
          def post(path, body, headers):
              data = json.dumps(body).encode()
              req = urllib.request.Request(url + path, data=data, method="POST", headers={"Content-Type": "application/json", "apikey": os.environ["ANON"], **headers})
              try:
                  r = urllib.request.urlopen(req, timeout=40); return r.status, r.read().decode()[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
          # 1. een verzoek van ~11.000 tekens (twee JWS'en) mag geen 413 meer geven; zonder inlog hoort het 401 te zijn
          big = {"action": "apple_verify", "signed_transaction": "a" * 5600, "signed_renewal_info": "b" * 5600}
          code, text = post("/functions/v1/billing", big, {})
          print("billing 11 KB zonder inlog:", code, text[:120])
          if code == 413:
              print("::error::billing geeft nog 413"); sys.exit(1)
          # 2. grote verzoeken blijven begrensd
          code2, _ = post("/functions/v1/billing", {"action": "apple_verify", "x": "a" * 250000}, {})
          print("billing 250 KB:", code2)
          if code2 != 413:
              print("::error::grens van 200 KB werkt niet"); sys.exit(1)
          # 3. storing sluiten (alleen als de controle hierboven slaagde)
          c3, t3 = post("/functions/v1/status", {"action": "notice_update", "id": 138, "status": "resolved",
              "message_nl": "Opgelost: abonnementen via Apple worden weer herkend. Wie het probeerde, krijgt Premium na het openen van de app, of met Herstel aankopen in Instellingen. Onze excuses voor het ongemak.",
              "message_en": "Resolved: subscriptions through Apple are recognised again. If you tried to subscribe, you will get Premium after opening the app, or with Restore Purchases in Settings. We apologise for the inconvenience.",
              "notify": True}, {"x-status-secret": os.environ["SECRET"]})
          print("storing sluiten:", c3, t3[:200])
          if c3 != 200:
              sys.exit(1)
          PY
