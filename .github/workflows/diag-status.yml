name: Diagnose status (tijdelijk)
# Tijdelijk: stuurt de excusemail naar accounts met een geweigerde abonnementsaankoop (build 187). Adressen worden hier
# opgezocht en nooit geprint; alleen aantallen komen in het log.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  mailen:
    runs-on: ubuntu-latest
    steps:
      - name: Accounts zoeken en mailen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SMTP_HOST: ${{ secrets.BINGR_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.BINGR_SMTP_PORT }}
          SMTP_USER: ${{ secrets.BINGR_SMTP_USER }}
          SMTP_PASS: ${{ secrets.BINGR_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.BINGR_SMTP_FROM }}
        run: |
          python3 - <<'PY'
          import os, json, re, smtplib, ssl, urllib.request, urllib.parse, datetime, time
          from email.message import EmailMessage
          from email.utils import formataddr, parseaddr, make_msgid, formatdate
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def q(sql, s, e):
              for _ in range(4):
                  time.sleep(15)
                  u = f"{API}/analytics/endpoints/logs?" + urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": s, "iso_timestamp_end": e})
                  try: return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60))
                  except Exception: time.sleep(20)
              return {}
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          now = datetime.datetime.now(datetime.timezone.utc)
          ids = set()
          for back in range(4, -1, -1):
              day = (now - datetime.timedelta(days=back)).date()
              s = datetime.datetime.combine(day, datetime.time(), datetime.timezone.utc); e = min(s + datetime.timedelta(days=1), now)
              r = q("SELECT log_attributes['request.sb.auth_user'] AS u FROM logs WHERE source = 'function_edge_logs' AND position(log_attributes['request.url'], '/functions/v1/billing') > 0 AND log_attributes['response.status_code'] = '413' GROUP BY u",
                    s.isoformat().replace("+00:00", "Z"), e.isoformat().replace("+00:00", "Z"))
              for x in r.get("result", []):
                  u = str(x.get("u") or "")
                  if re.fullmatch(r"[0-9a-f-]{36}", u): ids.add(u)
          print("accounts in de logs:", len(ids))
          inl = ",".join("'" + i + "'" for i in sorted(ids))
          rows = db(f"select u.email from auth.users u where u.id::text in ({inl}) and u.email_confirmed_at is not null "
                    f"and not exists (select 1 from premium_subscriptions s where s.user_id = u.id) "
                    f"and not exists (select 1 from account_plans p where p.user_id = u.id and p.plan <> 'free')") if ids else []
          to = sorted({r["email"] for r in rows if r.get("email")})
          print("te mailen (bestaand, bevestigd, nog geen Premium):", len(to))
          body = "\n".join([
              "Hello,", "",
              "You recently tried to subscribe to Bingr Premium through the App Store. Unfortunately that did not work: because of an error on our side, your purchase was not recognised, so Premium was not activated. We sincerely apologise for the disruption.", "",
              "The error has now been fixed. Here is how to activate Premium:", "",
              "1. Update Bingr to the latest version in the App Store.",
              "2. Open Bingr and sign in with the same account you used for the purchase.",
              "3. Go to Settings and choose Restore Purchases (or open the Premium screen and choose Restore Purchases there).", "",
              "You do not have to pay again. Your Apple purchase is still valid; we are simply linking it to your account now.", "",
              "If it does not work, or your trial period has already ended, send us a message at support.bingr.online and we will sort it out together.", "",
              "Once again, our apologies for the inconvenience.", "",
              "Best regards,", "L\u00e9on", "Bingr", ""])
          frm = os.environ["SMTP_FROM"]; name, addr = parseaddr(frm)
          port = int(os.environ.get("SMTP_PORT") or 465)
          ok = bad = 0
          for rcpt in to:
              m = EmailMessage()
              m["From"] = formataddr(("Bingr", addr or frm)); m["To"] = rcpt
              m["Subject"] = "Sorry: your Bingr Premium purchase is now fixed"
              m["Date"] = formatdate(localtime=False); m["Message-ID"] = make_msgid(domain=(addr.split("@")[-1] if "@" in addr else "bingr.online"))
              m.set_content(body)
              try:
                  ctx = ssl.create_default_context()
                  if port in (587, 25):
                      with smtplib.SMTP(os.environ["SMTP_HOST"], port, timeout=40) as sm:
                          sm.starttls(context=ctx); sm.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"]); sm.send_message(m)
                  else:
                      with smtplib.SMTP_SSL(os.environ["SMTP_HOST"], port, timeout=40, context=ctx) as sm:
                          sm.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"]); sm.send_message(m)
                  ok += 1
              except Exception as ex:
                  bad += 1; print("mislukt:", type(ex).__name__)
          print(f"verstuurd: {ok}, mislukt: {bad}")
          PY
