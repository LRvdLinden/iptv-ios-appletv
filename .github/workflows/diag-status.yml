name: Diagnose status (tijdelijk)
# Tijdelijk: zoekt de accounts met een geweigerde abonnementsaankoop op en versleutelt de lijst met een openbare sleutel;
# alleen de eigenaar van de privesleutel kan hem lezen. Er wordt niets leesbaars geprint.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  zoeken:
    runs-on: ubuntu-latest
    steps:
      - name: Zoeken en versleutelen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cat > cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
