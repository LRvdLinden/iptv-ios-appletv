name: Diagnose status (tijdelijk)
# Tijdelijk: welke velden leggen de edge-logs vast bij de geweigerde billing-verzoeken (alleen veldnamen en tellingen).
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  sleutels:
    runs-on: ubuntu-latest
    steps:
      - name: Veldnamen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, datetime, time
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          def q(sql, s, e):
              u = f"{API}/analytics/endpoints/logs?" + urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": s, "iso_timestamp_end": e})
              try: return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "Bearer " + os.environ["TOKEN"]}), timeout=60))
              except Exception as ex: return {"error": str(ex)[:150]}
          now = datetime.datetime.now(datetime.timezone.utc)
          s = (now - datetime.timedelta(hours=23)).isoformat().replace("+00:00", "Z"); e = now.isoformat().replace("+00:00", "Z")
          r = q("SELECT k, count() AS n FROM logs ARRAY JOIN mapKeys(log_attributes) AS k WHERE source = 'function_edge_logs' AND position(log_attributes['request.url'], '/functions/v1/billing') > 0 AND log_attributes['response.status_code'] = '413' GROUP BY k ORDER BY k", s, e)
          print([x["k"] + "=" + str(x["n"]) for x in r.get("result", [])] if "result" in r else r)
          PY
