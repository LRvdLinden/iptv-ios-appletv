name: Diagnose status (tijdelijk)
# Tijdelijk: zet de al verstuurde excusemails (build 187) achteraf in mail_log. Verstuurt niets; adressen nooit in het log.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  mailen:
    runs-on: ubuntu-latest
    steps:
      - name: Accounts zoeken en vastleggen
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SMTP_HOST: ${{ secrets.BINGR_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.BINGR_SMTP_PORT }}
          SMTP_USER: ${{ secrets.BINGR_SMTP_USER }}
          SMTP_PASS: ${{ secrets.BINGR_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.BINGR_SMTP_FROM }}
        run: |
          python3 - <<'PY'
          import os, json, re, smtplib, ssl, urllib.request, urllib.parse, datetime, time
          from email.message import EmailMessage
          from email.utils import formataddr, parseaddr, make_msgid, formatdate
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def q(sql, s, e):
              for _ in range(4):
                  time.sleep(15)
                  u = f"{API}/analytics/endpoints/logs?" + urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": s, "iso_timestamp_end": e})
                  try: return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60))
                  except Exception: time.sleep(20)
              return {}
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          now = datetime.datetime.now(datetime.timezone.utc)
          ids = set()
          for back in range(4, -1, -1):
              day = (now - datetime.timedelta(days=back)).date()
              s = datetime.datetime.combine(day, datetime.time(), datetime.timezone.utc); e = min(s + datetime.timedelta(days=1), now)
              r = q("SELECT log_attributes['request.sb.auth_user'] AS u FROM logs WHERE source = 'function_edge_logs' AND position(log_attributes['request.url'], '/functions/v1/billing') > 0 AND log_attributes['response.status_code'] = '413' GROUP BY u",
                    s.isoformat().replace("+00:00", "Z"), e.isoformat().replace("+00:00", "Z"))
              for x in r.get("result", []):
                  u = str(x.get("u") or "")
                  if re.fullmatch(r"[0-9a-f-]{36}", u): ids.add(u)
          print("accounts in de logs:", len(ids))
          inl = ",".join("'" + i + "'" for i in sorted(ids))
          rows = db(f"select u.email from auth.users u where u.id::text in ({inl}) and u.email_confirmed_at is not null "
                    f"and not exists (select 1 from premium_subscriptions s where s.user_id = u.id) "
                    f"and not exists (select 1 from account_plans p where p.user_id = u.id and p.plan <> 'free')") if ids else []
          to = sorted({r["email"] for r in rows if r.get("email")})
          print("te mailen (bestaand, bevestigd, nog geen Premium):", len(to))
          vals = ",".join("('beheer','" + a.replace("'", "''").lower() + "','Sorry: your Bingr Premium purchase is now fixed',true,'','2026-11-27T09:13:56Z')" for a in to)
          if to:
              db("insert into public.mail_log (source,to_addr,subject,ok,error,at) values " + vals)
          print("vastgelegd:", len(to))
          PY
