name: Diagnose status (tijdelijk)
# Tijdelijk: draait de servertests van een branch (build-187) voordat die naar main gaat.
on:
  push:
    branches: [symboliseren]
    paths: ['.github/diag-status.txt']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-187
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests
        run: |
          deno test --allow-read supabase/functions/_shared/premium_test.ts
          deno test supabase/functions/_shared/apple_test.ts supabase/functions/_shared/lifetime_test.ts supabase/functions/_shared/billing_test.ts
      - name: Typecheck
        run: |
          deno check supabase/functions/billing/index.ts supabase/functions/apple-notify/index.ts supabase/functions/stripe-webhook/index.ts
