          kPr8vWD70azFY+rdoSprCKRWp9vr1csdF3eptHJqXw8baYps5U1sIl2jJdTiqG0h
          04gWWlDVpAn6JeoMJqDBiELYNNdFtzQputWnYA+MI8ueoqHU1vfxiVJYHpUpyWd7
          w7D/MAlQNaMx4RWqSvGfyEhB4cb0Kdu/A0gpEXo5LdWDtE9IZQkF+aZZDyIUAutN
          zzmgk4cciwNNc4HyPbWJOtZyEwO0cwe+taIhQPgv7lcmBzwIqW6OgHgFLSnM94Ib
          fU1Mhqm9noLZHUhB+NEp3SiOuJSPRw/1p+7CfikkuTwc2tks9CGVRAnIpq2e20iN
          YMkY1F7utCk7YJpba4pcO+CRdyVZ/eEB5d+eXJsdlXaROAlAN4v5jnE=
          -----END CERTIFICATE-----
          CERT
          python3 - <<'PY'
          import os, json, re, subprocess, urllib.request, urllib.parse, datetime, time
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}"
          H = {"Authorization": "Bearer " + os.environ["TOKEN"]}
          def q(sql, s, e):
              for _ in range(4):
                  time.sleep(15)
                  u = f"{API}/analytics/endpoints/logs?" + urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": s, "iso_timestamp_end": e})
                  try: return json.load(urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60))
                  except Exception: time.sleep(20)
              return {}
          def db(sql):
              req = urllib.request.Request(API + "/database/query", data=json.dumps({"query": sql}).encode(), headers={**H, "content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          now = datetime.datetime.now(datetime.timezone.utc)
          att = {}
          for back in range(4, -1, -1):
              day = (now - datetime.timedelta(days=back)).date()
              s = datetime.datetime.combine(day, datetime.time(), datetime.timezone.utc); e = min(s + datetime.timedelta(days=1), now)
              r = q("SELECT log_attributes['request.sb.auth_user'] AS u, count() AS n, min(timestamp) AS first, max(timestamp) AS last FROM logs WHERE source = 'function_edge_logs' AND position(log_attributes['request.url'], '/functions/v1/billing') > 0 AND log_attributes['response.status_code'] = '413' GROUP BY u",
                    s.isoformat().replace("+00:00", "Z"), e.isoformat().replace("+00:00", "Z"))
              for x in r.get("result", []):
                  u = str(x.get("u") or "")
                  a = att.setdefault(u, {"n": 0, "first": None, "last": None})
                  a["n"] += int(x["n"]); a["first"] = min(filter(None, [a["first"], str(x["first"])])); a["last"] = max(filter(None, [a["last"], str(x["last"])]))
          ids = [u for u in att if re.fullmatch(r"[0-9a-f-]{36}", u)]
          lines = []
          if ids:
              inl = ",".join("'" + i + "'" for i in ids)
              rows = db(f"select i.id::text id, u.email, u.email_confirmed_at is not null conf, u.created_at::date cr, "
                        f"(select string_agg(distinct s.provider||':'||s.plan||':'||s.status, ',') from premium_subscriptions s where s.user_id::text = i.id) subs, "
                        f"(select string_agg(distinct p.plan||':'||p.source, ',') from account_plans p where p.user_id::text = i.id) plans "
                        f"from unnest(array[{inl}]::text[]) as i(id) left join auth.users u on u.id::text = i.id")
              by = {r["id"]: r for r in rows}
              for i in ids:
                  r = by.get(i, {}); a = att[i]
                  lines.append(f"{r.get('email') or 'ACCOUNT BESTAAT NIET MEER'} | pogingen {a['n']} | {a['first']} .. {a['last']} | abonnement: {r.get('subs') or '-'} | plan: {r.get('plans') or '-'}")
          lines.append(f"zonder account/anoniem: {sum(v['n'] for k, v in att.items() if k not in ids)} verzoeken")
          open("lijst.txt", "w").write("\n".join(lines) + "\n")
          PY
          openssl cms -encrypt -aes256 -in lijst.txt -recip cert.pem -outform PEM -out lijst.pem
          echo "-----LIJST-----"; cat lijst.pem; echo "-----EINDE-----"
          shred -u lijst.txt
