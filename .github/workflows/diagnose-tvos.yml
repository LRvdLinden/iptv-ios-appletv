name: Diagnose tvOS-start

# TIJDELIJK (build 158): één handmatige diagnose van de crash bij het openen op Apple TV. Geen vaste test, niet in
# build.yml. Bouwt BingrTV voor de tvOS-simulator (nieuwste Xcode, ad hoc ondertekend MET de echte entitlements),
# start hem met tools/smoke_launch.sh (nieuwe installatie, terugkerende gebruiker, kinderprofiel en een vers
# Bingr-testaccount zonder data) en zet de samenvatting van de crashrapporten als tekst op de branch ci-logs-diagnose.
# Het log is openbaar: geen geheimen of persoonsgegevens (testaccount gemaskeerd, paden ingekort).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tvos:
    runs-on: macos-26
    env:
      # diagnose 2: Gratis-account met eigen testgegevens (servers, profielen, kinderprofiel) vanaf de Apple TV
      SMOKE_PLAN: free
      SMOKE_SEED_ACCOUNT: "1"
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - name: Nieuwste Xcode kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version | tee versions.txt
          xcrun simctl list runtimes | grep -i tvos | tee -a versions.txt

      - name: Project genereren
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build tvOS Debug (simulator, ondertekend met entitlements)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Bingr.xcodeproj -scheme BingrTV -configuration Debug -derivedDataPath build \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES > tvos.log 2>&1
          tail -n 5 tvos.log

      - name: Testaccount (vers, zonder data)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 -I tools/smoke_account.py create

      - name: Start-diagnose tvOS (simulator)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        env:
          SMOKE_SECONDS: "35"
          SMOKE_BIG_MOVIES: "1500"
          SMOKE_BIG_SHOWS: "200"
        run: tools/smoke_launch.sh tvos build/Build/Products "$RUNNER_TEMP/smoke/tvos" 2>&1 | tee smoke-tvos.log; exit ${PIPESTATUS[0]}

      - name: Testaccount verwijderen
        if: always()
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python3 -I tools/smoke_account.py delete

      - name: Rapport (branch ci-logs-diagnose)
        if: always()
        run: |
          R="$RUNNER_TEMP/report"; mkdir -p "$R"
          {
            echo "commit: $GITHUB_SHA"
            echo "build: ${{ steps.build.outcome }}  start: ${{ steps.smoke.outcome }}"
            cat versions.txt 2>/dev/null | head -n 20
            echo "=== build errors ==="
            grep -E "error:" tvos.log 2>/dev/null | sort -u | head -n 60
            echo "=== start-diagnose ==="
            grep -v '^::' smoke-tvos.log 2>/dev/null | grep -v tabblad | head -n 600
            echo "=== crash-samenvattingen ==="
            for f in "$RUNNER_TEMP/smoke/tvos/"*.crash.txt; do [ -f "$f" ] && { echo "--- $(basename "$f")"; cat "$f"; }; done
            echo "=== fatale regels uit de app-logs ==="
            for f in "$RUNNER_TEMP/smoke/tvos/"*.log; do
              [ -f "$f" ] || continue
              case "$f" in *m3u-access*) continue;; esac
              echo "--- $(basename "$f")"
              grep -aE "Fatal error|fatal error|Assertion failed|Precondition failed|EXC_|SIG[A-Z]+|Simultaneous accesses|BINGR_SMOKE" "$f" | grep -v tabblad | tail -n 40
            done
          } 2>&1 | sed -E 's#/Users/[^/ ]+#~#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}#<adres>#g' > "$R/latest.txt"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git reset --hard -q
          git switch --orphan ci-logs-diagnose-tmp
          git rm -rf --quiet . || true
          cp "$R/latest.txt" latest.txt
          git add latest.txt
          git commit -q -m "diagnose tvos $GITHUB_SHA build=${{ steps.build.outcome }} start=${{ steps.smoke.outcome }}"
          git push -f origin HEAD:ci-logs-diagnose
