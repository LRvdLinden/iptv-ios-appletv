name: Diagnose

# Handmatige diagnose van de backend. Het log is OPENBAAR: alleen tellingen, leeftijden en foutsoorten, nooit
# e-mailadressen, namen, account-id's, titels of andere gebruikersgegevens.
# Secrets: SUPABASE_ACCESS_TOKEN en SUPABASE_PROJECT_REF (zoals de workflow Backend).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streams:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Kijksessies (Nu aan het kijken)
        shell: bash
        run: |
          set -uo pipefail
          # elke sectie als één ::notice:: (de ruwe logs zijn niet overal leesbaar)
          note() { printf '::notice title=%s::%s\n' "$1" "$(tr '\n' ' ' | head -c 1800)"; }
          q() {
            python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1" > /tmp/q.json
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json
          }
          q "select count(*) as rijen, count(*) filter (where last_ping > now() - interval '90 seconds') as actief,
                    round(extract(epoch from now() - max(last_ping))) as sec_sinds_laatste_ping,
                    round(extract(epoch from now() - max(started_at))) as sec_sinds_laatste_start
             from public.account_streams" | note streams
          q "select coalesce(d.platform,'?') as platform, s.kind, (s.profile_id is not null and s.profile_id <> '') as met_profiel,
                    round(extract(epoch from now() - s.started_at)) as sec_sinds_start, round(extract(epoch from now() - s.last_ping)) as sec_sinds_ping
             from public.account_streams s left join public.account_devices d on d.user_id = s.user_id and d.device_id = s.device_id
             order by s.started_at desc limit 8" | note streamrijen
          q "select coalesce(platform,'?') as platform, kind, (profile_id is not null and profile_id <> '') as met_profiel,
                    round(extract(epoch from now() - started_at)) as sec_sinds_start,
                    case when ended_at is null then null else round(extract(epoch from ended_at - started_at)) end as duur_sec
             from public.account_watch_log order by started_at desc limit 10" | note laatste_logs
          q "select count(*) as starts, round(extract(epoch from now() - max(started_at))) as sec_sinds_laatste
             from public.account_watch_log where started_at > now() - interval '6 hours'" | note watchlog
          q "select coalesce(platform,'?') as platform, count(*) as starts,
                    count(*) filter (where ended_at is null) as niet_afgesloten,
                    count(*) filter (where ended_at is not null and ended_at - started_at < interval '20 seconds') as binnen_20s,
                    count(*) filter (where ended_at is not null and ended_at - started_at between interval '20 seconds' and interval '3 minutes') as tot_3min,
                    count(*) filter (where ended_at - started_at > interval '3 minutes') as langer,
                    round(avg(extract(epoch from ended_at - started_at))) as gem_sec
             from public.account_watch_log where started_at > now() - interval '6 hours' group by 1 order by 1" | note duur
          q "select p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' as functie
             from pg_proc p join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public' and (p.proname like 'bingr_stream%' or p.proname like 'bingr_stats%' or p.proname like 'bingr_local_day%')
             order by 1" | note functies
          # neemt het account met de meest recente stream, roept de functie aan zoals device-auth en draait alles terug;
          # toont alleen of het lukt of de foutmelding (zonder waarden)
          q "do \$\$ declare u uuid; d text; r jsonb; begin
               select user_id, device_id into u, d from public.account_streams order by last_ping desc limit 1;
               if u is null then raise notice 'geen bestaande stream om mee te testen'; return; end if;
               r := public.bingr_stream_start(u, d, 'p', 'p', 't', 'movie', 'c', 3, 90, null, null, 'Europe/Amsterdam');
               raise exception 'TERUGDRAAIEN ok=%', r->>'ok';
             end \$\$" | python3 -c 'import sys,re; s=sys.stdin.read(); print(re.sub(r"[0-9a-f]{8}-[0-9a-f-]{27}","<id>",s)[:600])' | note proefaanroep
          SQL="select response.status_code as status, count(*) as n from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.response) as response cross join unnest(m.request) as request where request.url like '%/device-auth%' group by 1 order by 1"
          curl -s -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL" \
            --data-urlencode "iso_timestamp_start=$(date -u -d '-6 hours' +%FT%TZ)" \
            --data-urlencode "iso_timestamp_end=$(date -u +%FT%TZ)" | head -c 1500 | note statuscodes
          SQL2="select event_message from postgres_logs cross join unnest(metadata) as m cross join unnest(m.parsed) as p where p.error_severity in ('ERROR','FATAL') and (event_message like '%bingr_stream%' or event_message like '%bingr_stats%' or event_message like '%account_watch%' or event_message like '%account_streams%') limit 20"
          curl -s -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$SQL2" \
            --data-urlencode "iso_timestamp_start=$(date -u -d '-6 hours' +%FT%TZ)" \
            --data-urlencode "iso_timestamp_end=$(date -u +%FT%TZ)" \
            | python3 -c 'import sys,re; s=sys.stdin.read(); s=re.sub(r"\"[^\"]*@[^\"]*\"","\"<e>\"",s); s=re.sub(r"[0-9a-f]{8}-[0-9a-f-]{27}","<id>",s); s=re.sub(r"\(([^()]{0,200})\)=\(([^()]*)\)",r"(\1)=(<waarde>)",s); print(s[:1800])' | note pgfouten

  # build 107: statuspagina — per monitor de laatste uitkomst (geen gebruikersgegevens: alleen soort, status en foutsoort)
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Monitors van de statuspagina
        shell: bash
        run: |
          set -uo pipefail
          note() { printf '::notice title=%s::%s\n' "$1" "$(tr '\n' ' ' | head -c 3500)"; }
          q() {
            python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1" > /tmp/q.json
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json
          }
          q "select id, kind, enabled as aan, public as publiek, coalesce(last_state,'-') as staat, fail_streak as fouten,
                    round(extract(epoch from now() - last_checked_at)) as sec_geleden, left(coalesce(last_error,''), 80) as fout
             from public.status_monitors order by grp, sort" | note monitors
          q "select m.id, left(coalesce(c.detail,''), 60) as detail, c.status_code as code
             from public.status_monitors m left join lateral (select detail, status_code from public.status_checks
               where monitor_id = m.id order by at desc limit 1) c on true where m.grp = 'apps'" | note apps
          q "select (select count(*) from public.status_incidents where ended_at is null) as open_storingen,
                    (select count(*) from public.status_incidents where started_at > now() - interval '7 days') as storingen_7d" | note storingen

  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Pushmeldingen (alleen tellingen en foutcodes)
        shell: bash
        run: |
          set -uo pipefail
          note() { printf '::notice title=%s::%s\n' "$1" "$(tr '\n' ' ' | head -c 3500)"; }
          q() {
            python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "$1" > /tmp/q.json
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json
          }
          q "select platform, channel, sandbox, app_build, left(coalesce(last_error,''),40) as fout, count(*) as n,
                    round(extract(epoch from now() - max(updated_at))/60) as min_geleden
             from public.push_devices group by 1,2,3,4,5 order by 1,4" | note apparaten
          q "select kind, platform_group as groep, build, created_by as door, created_at::timestamp(0) as tijd, devices, counts - 'errors' as aantallen, counts->'errors' as fouten,
                    (finished_at is not null) as klaar
             from public.push_messages where kind <> 'reminder' order by id desc limit 8" | note berichten
          q "select platform, channel, state, left(coalesce(error,''),60) as fout, count(*) as n from public.push_deliveries
             where created_at > now() - interval '2 days' group by 1,2,3,4 order by 1,3" | note bezorgingen
          q "select date_trunc('hour', sent_at)::timestamp(0) as uur, count(*) as welkomstmails from public.account_welcome
             where sent_at > now() - interval '24 hours' group by 1 order by 1" | note 'welkomstmails per uur (24 uur)'
          q "select jobname, schedule, active from cron.job where jobname like 'bingr-%' order by 1" | note planning
          q "select status, left(coalesce(return_message,''),80) as uitkomst, count(*) as n from cron.job_run_details d
             join cron.job j on j.jobid = d.jobid where j.jobname = 'bingr-push' and d.start_time > now() - interval '30 minutes'
             group by 1,2" | note 'cron laatste 30 min'

  # build 135: bevestigingsmail van Supabase Auth — alleen ja/nee, getallen en foutsoorten (geen adressen of serverwaarden)
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      S_HOST: ${{ secrets.BINGR_SMTP_HOST }}
      S_PORT: ${{ secrets.BINGR_SMTP_PORT }}
      S_USER: ${{ secrets.BINGR_SMTP_USER }}
      S_FROM: ${{ secrets.BINGR_SMTP_FROM }}
    steps:
      - name: Auth-mail (config en auth-logs)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error, urllib.parse, collections, datetime
          REF = os.environ["REF"]; MGMT = os.environ["SUPABASE_ACCESS_TOKEN"]
          API = f"https://api.supabase.com/v1/projects/{REF}"
          def get(url):
              r = urllib.request.Request(url, headers={"Authorization": f"Bearer {MGMT}"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp: return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read() or b"{}")
                  except Exception: return e.code, None
              except Exception: return 0, None
          def note(title, msg): print(f"::notice title={title}::{msg[:3500]}")
          code, c = get(f"{API}/config/auth")
          if code != 200 or not isinstance(c, dict):
              note("auth-config", f"niet gelezen (HTTP {code})")
          else:
              yn = lambda k: "ja" if c.get(k) else "nee"
              sender = c.get("smtp_sender_name")
              note("auth-config", " | ".join([
                  f"smtp_host gezet: {yn('smtp_host')}", f"smtp_port: {c.get('smtp_port') or '-'}",
                  f"smtp_user gezet: {yn('smtp_user')}", f"smtp_admin_email gezet: {yn('smtp_admin_email')}",
                  f"smtp_admin_email @bingr.online: {'ja' if str(c.get('smtp_admin_email') or '').lower().endswith('@bingr.online') else 'nee'}",
                  f"smtp_sender_name: {sender if sender in (None, '', 'Bingr') else '(anders)'}",
                  f"smtp_max_frequency: {c.get('smtp_max_frequency')}",
                  f"mailer_autoconfirm: {c.get('mailer_autoconfirm')}", f"rate_limit_email_sent: {c.get('rate_limit_email_sent')}",
                  f"rate_limit_otp: {c.get('rate_limit_otp')}", f"external_email_enabled: {c.get('external_email_enabled')}",
                  f"hook_before_user_created_enabled: {c.get('hook_before_user_created_enabled')}",
                  f"site_url bingr.online: {'ja' if (c.get('site_url') or '').rstrip('/') == 'https://bingr.online' else 'nee'}",
                  f"bevestigen/ in redirect-lijst: {'ja' if 'https://bingr.online/bevestigen/' in (c.get('uri_allow_list') or '') else 'nee'}",
                  f"template confirmation via bingr.online/bevestigen: {'ja' if 'bingr.online/bevestigen' in (c.get('mailer_templates_confirmation_content') or '') else 'nee'}",
                  f"onderwerp confirmation gezet: {yn('mailer_subjects_confirmation')}",
              ]))
              def addr(v):
                  m = re.search(r"<([^>]+)>", v or ""); return (m.group(1) if m else (v or "")).strip().lower()
              E = os.environ; same = lambda a, b: "-" if not b else ("ja" if str(a or "").strip().lower() == str(b).strip().lower() else "nee")
              note("auth-smtp vs secrets", " | ".join([
                  f"host = BINGR_SMTP_HOST: {same(c.get('smtp_host'), E.get('S_HOST'))}",
                  f"port = BINGR_SMTP_PORT: {same(c.get('smtp_port'), E.get('S_PORT'))}",
                  f"user = BINGR_SMTP_USER: {same(c.get('smtp_user'), E.get('S_USER'))}",
                  f"admin_email = adres BINGR_SMTP_FROM: {same(c.get('smtp_admin_email'), addr(E.get('S_FROM')))}",
                  f"admin_email = smtp_user: {same(c.get('smtp_admin_email'), c.get('smtp_user'))}",
                  f"pass gezet (niet leesbaar): {'ja' if c.get('smtp_pass') else 'onbekend'}"]))
          end = datetime.datetime.now(datetime.timezone.utc); start = end - datetime.timedelta(hours=int(os.environ.get("HOURS", "3")))
          sql = "select timestamp, event_message from auth_logs order by timestamp desc limit 1000"
          qs = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
                                       "iso_timestamp_end": end.strftime("%Y-%m-%dT%H:%M:%SZ")})
          code, r = get(f"{API}/analytics/endpoints/logs?{qs}")
          rows = (r or {}).get("result") if isinstance(r, dict) else None
          if code != 200 or not isinstance(rows, list):
              note("auth-logs", f"niet gelezen (HTTP {code}) " + re.sub(r"[^\s\"]+@[^\s\"]+", "<e>", json.dumps(r)[:300] if r else ""))
          else:
              def clean(s):
                  s = re.sub(r"[^\s\"'<>]+@[^\s\"'<>]+", "<e>", str(s)); s = re.sub(r"[0-9a-f]{8}-[0-9a-f-]{27}", "<id>", s)
                  s = re.sub(r"\b\d{1,3}(\.\d{1,3}){3}(:\d+)?\b", "<ip>", s); s = re.sub(r"\b[\w-]+(\.[\w-]+)+:\d+\b", "<host>", s)
                  return s[:140]
              lv = collections.Counter(); fouten = collections.Counter(); paden = collections.Counter(); mails = collections.Counter()
              for row in rows:
                  try: m = json.loads(row.get("event_message") or "{}")
                  except Exception: m = {"msg": row.get("event_message")}
                  level = m.get("level") or "?"; lv[level] += 1
                  path = m.get("path") or ""; st = m.get("status")
                  if path in ("/signup", "/resend", "/recover", "/otp", "/magiclink", "/verify", "/user") or "mail" in str(m.get("msg") or "").lower():
                      paden[f"{path or '-'} {st or ''}".strip()] += 1
                  if "mail" in json.dumps(m).lower() and (m.get("action") or m.get("msg")):
                      mails[clean(m.get("msg") or m.get("action"))] += 1
                  if level in ("error", "fatal", "warning") or (isinstance(st, int) and st >= 400):
                      fouten[clean(f"{m.get('msg') or ''} | {m.get('error') or ''} | {m.get('error_code') or ''}")] += 1
              note("auth-logs niveaus", f"{len(rows)} regels ({start:%H:%M}-{end:%H:%M} UTC): " + json.dumps(dict(lv)))
              note("auth-logs mailpaden", json.dumps(dict(paden.most_common(15)), ensure_ascii=False) or "{}")
              note("auth-logs mailregels", json.dumps(dict(mails.most_common(10)), ensure_ascii=False) or "{}")
              note("auth-logs fouten", json.dumps(dict(fouten.most_common(12)), ensure_ascii=False) or "geen")
          PY
      - name: Onbevestigde accounts (alleen aantallen)
        shell: bash
        run: |
          python3 -c 'import json,sys; print(json.dumps({"query": sys.argv[1]}))' "select count(*) filter (where email_confirmed_at is null) as onbevestigd,
                 count(*) filter (where email_confirmed_at is null and created_at > now() - interval '24 hours') as onbevestigd_24u,
                 count(*) filter (where confirmation_sent_at > now() - interval '24 hours') as bevestigingsmail_24u,
                 count(*) filter (where created_at > now() - interval '24 hours') as nieuw_24u,
                 (select json_agg(json_build_object('min_geleden', round(extract(epoch from now() - created_at)/60),
                    'mail_na_sec', round(extract(epoch from confirmation_sent_at - created_at)), 'mail_min_geleden', round(extract(epoch from now() - confirmation_sent_at)/60)))
                  from auth.users where email_confirmed_at is null) as onbevestigde_accounts from auth.users" > /tmp/q.json
          r=$(curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json | head -c 400)
          printf '::notice title=accounts::%s\n' "$(echo "$r" | sed -E 's/[^ ",]+@[^ ",]+/<e>/g')"
