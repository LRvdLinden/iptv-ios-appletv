name: Media-probe (tijdelijk)
on:
  push:
    branches: [media-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
      - name: Zoeken
        run: |
          python3 -m pip install --quiet --break-system-packages pillow==11.0.0
          python3 tools/_probe2.py
      - name: Resultaat
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add probe3.txt sheets3; git commit -qm "probe-resultaat"; git push origin HEAD:media-probe-result -f
