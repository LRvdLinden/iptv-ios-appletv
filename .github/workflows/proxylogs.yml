name: Proxylogs (tijdelijk)

# Tijdelijk (spoedfout http_502 in de webspeler): alleen aantallen, statuscodes, duur en foutsoorten van web-proxy.
# Nooit URL's, hosts, IP's, gebruikers of tokens in dit (openbare) log. Wordt na de diagnose weer verwijderd.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_LOGS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
      - name: web-proxy (alleen aggregaten)
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/proxylogs.txt"
          import datetime, json, os, re, time, urllib.error, urllib.parse, urllib.request
          API = f"https://api.supabase.com/v1/projects/{os.environ['REF']}/analytics/endpoints/logs"
          def logs(sql, hours):
              for wait in (5, 10, 20, 30, 0):
                  end = datetime.datetime.now(datetime.timezone.utc); start = end - datetime.timedelta(hours=hours)
                  qs = urllib.parse.urlencode({"sql": sql, "iso_timestamp_start": start.strftime("%Y-%m-%dT%H:%M:%SZ"), "iso_timestamp_end": end.strftime("%Y-%m-%dT%H:%M:%SZ")})
                  r = urllib.request.Request(f"{API}?{qs}", headers={"Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}"})
                  try:
                      with urllib.request.urlopen(r, timeout=60) as resp: c, b = resp.status, json.loads(resp.read() or b"{}")
                  except urllib.error.HTTPError as e:
                      c, b = e.code, None
                  except Exception: c, b = 0, None
                  if c != 429 or not wait: return c, b
                  time.sleep(wait)
          SAFE = re.compile(r"[^A-Za-z_ :()=<>|-]")
          NUM = re.compile(r"[^A-Za-z0-9_ .:()=<>|/+-]")
          def show(title, sql, hours, cols):
              c, b = logs(sql, hours)
              rows = (b or {}).get("result") if isinstance(b, dict) else None
              print(f"== {title} (HTTP {c}, {len(rows) if isinstance(rows, list) else '-'} rijen)")
              if isinstance(b, dict) and b.get("error"): print("   fout:", SAFE.sub(" ", str(b.get("error")))[:200])
              for r in rows or []:
                  out = []
                  for k in cols:
                      v = r.get(k)
                      if isinstance(v, (int, float)): out.append(f"{k}={round(v, 1)}")
                      else: out.append(f"{k}={(SAFE.sub('', re.sub(r'[^ ]*[.@/:][^ ]*', '<x>', str(v))) if k == 'msg' else NUM.sub('', str(v)))[:60]}")
                  print("  ", " ".join(out))
          WP = "source = 'function_edge_logs' AND position(log_attributes['request.url'], '/functions/v1/web-proxy') > 0"
          A = "log_attributes"
          for hrs in (3, 24):
              show(f"web-proxy per methode, status, type ({hrs} uur)",
                   f"SELECT {A}['request.method'] AS m, {A}['response.status_code'] AS s, {A}['response.headers.sb_error_code'] AS sb, {A}['response.headers.content_type'] AS ct, count() AS n, "
                   f"avg(toFloat64OrZero({A}['execution_time_ms'])) AS avg_ms, max(toFloat64OrZero({A}['execution_time_ms'])) AS max_ms, max(toFloat64OrZero({A}['response.headers.content_length'])) AS max_len, "
                   f"min(timestamp) AS first, max(timestamp) AS last FROM logs WHERE {WP} GROUP BY m, s, sb, ct ORDER BY last DESC LIMIT 40", hrs,
                   ["m", "s", "sb", "ct", "n", "avg_ms", "max_ms", "max_len", "first", "last"])
          show("web-proxy POST niet-2xx per uur (24 uur)",
               f"SELECT toStartOfHour(timestamp) AS h, {A}['response.status_code'] AS s, count() AS n FROM logs WHERE {WP} AND {A}['request.method'] = 'POST' "
               f"AND toInt32OrZero({A}['response.status_code']) NOT BETWEEN 200 AND 299 GROUP BY h, s ORDER BY h DESC LIMIT 40", 24, ["h", "s", "n"])
          show("console van web-proxy en limieten (24 uur)",
               "SELECT substring(event_message, 1, 80) AS msg, count() AS n, max(timestamp) AS last FROM logs WHERE source = 'function_logs' "
               "AND NOT startsWith(event_message, 'booted') AND event_message != 'shutdown' AND (positionCaseInsensitive(event_message, 'web-proxy') > 0 "
               "OR positionCaseInsensitive(event_message, 'limit') > 0 OR positionCaseInsensitive(event_message, 'memory') > 0 OR positionCaseInsensitive(event_message, 'error') > 0) "
               "GROUP BY msg ORDER BY n DESC LIMIT 25", 24, ["msg", "n", "last"])
          PY
      - name: Naar de tijdelijke branch ci-proxylogs
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git switch --orphan ci-proxylogs-tmp
          git rm -rf --quiet . || true
          cp "$RUNNER_TEMP/proxylogs.txt" proxylogs.txt
          git add proxylogs.txt && git commit -qm "proxylogs (aggregaten)" && git push -f origin HEAD:ci-proxylogs
