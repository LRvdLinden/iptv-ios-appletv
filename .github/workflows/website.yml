name: Website

# Zet website/ via FTPS op de webserver, bij elke wijziging in website/ op main (of met de hand).
# Benodigde repository-secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam om te proberen) en FTP_DIR (doelmap, anders automatisch).

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: lftp installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Uploaden via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::warning::FTP-secrets ontbreken (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) — website niet geüpload."
            exit 0
          fi
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode true"
          # eerst expliciete FTPS (versleuteld), daarna gewone FTP als de server geen TLS kent
          USER_OK=""; base=""; SERVER_OK=""
          for srv in "$FTP_SERVER" "ftp.bingr.online" "bingr.online"; do
          for mode in "set ftp:ssl-force true; set ftp:ssl-protect-data true" "set ftp:ssl-allow false"; do
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              echo "Proberen: gebruiker '${u}', modus: ${mode}"
              if lftp -e "$common; $mode; open -u \"$u\",\"$FTP_PASSWORD\" \"$srv\"; cls -1 > /tmp/root.txt; bye" 2>/tmp/err.txt; then
                USER_OK="$u"; base="$common; $mode"; SERVER_OK="$srv"; break 3
              fi
              msg=$(sed 's/PASS .*/PASS ***/' /tmp/err.txt | tr '\n' ' ' | tail -c 300)
              echo "::warning::Mislukt (${srv}, gebruiker ${u%%@*}…, ${mode%%;*}): ${msg:-geen melding}"
            done
          done
          done
          [ -n "$USER_OK" ] || { echo "::error::Inloggen op de FTP-server mislukt met de opgegeven gebruikersnamen."; exit 1; }
          [[ "$base" == *"ssl-allow false"* ]] && echo "::warning::Server ondersteunt geen FTPS; upload gaat via gewone FTP."
          echo "::notice::Ingelogd op ${SERVER_OK} als ${USER_OK%%@*}…"; echo "Inhoud van de hoofdmap:"; cat /tmp/root.txt

          # doelmap: FTP_DIR, anders de gebruikelijke webmappen, anders de hoofdmap
          TARGET="${FTP_DIR:-}"
          if [ -z "$TARGET" ]; then
            for d in public_html httpdocs www htdocs web domains/bingr.online/public_html domains/bingr.online/public_html; do
              top="${d%%/*}"
              if grep -qx "/\?$top/\?" /tmp/root.txt; then
                if [ "$d" = "$top" ] || lftp -e "$base; open -u \"$USER_OK\",\"$FTP_PASSWORD\" \"$SERVER_OK\"; cls -1 $d/ ; bye" >/dev/null 2>&1; then
                  TARGET="$d"; break
                fi
              fi
            done
          fi
          TARGET="${TARGET:-.}"
          echo "::notice::Uploaden naar map: $TARGET (hoofdmap bevat: $(tr '\n' ' ' < /tmp/root.txt | head -c 200))"

          lftp -e "$base; open -u \"$USER_OK\",\"$FTP_PASSWORD\" \"$SERVER_OK\"; mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store website/ \"$TARGET\"; bye"
          echo "::notice::Website bijgewerkt op bingr.online"

      - name: Controleren of de site online staat
        if: success()
        run: |
          sleep 5
          code=$(curl -s -o /tmp/site.html -w '%{http_code}' https://bingr.online/ || true)
          if grep -q 'data-build' /tmp/site.html 2>/dev/null; then
            echo "::notice::bingr.online is live (HTTP $code), versie $(grep -o '<span data-build>[^<]*' /tmp/site.html | sed 's/<span data-build>//' | head -1)"
          else
            echo "::warning::bingr.online geeft HTTP $code maar nog niet de Bingr-site — mogelijk staat de webmap ergens anders (zet dan FTP_DIR)."
            head -c 300 /tmp/site.html 2>/dev/null | tr '\n' ' '; echo
          fi
