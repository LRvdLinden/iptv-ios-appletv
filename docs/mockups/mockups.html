<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--red:#E50914;--bg:#000;--card:#181818;--el:#232323;--sec:#B3B3B3;--imdb:#F5C518;--green:#46D369}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;overflow:hidden}
.screen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
.logo{font-family:ui-rounded,'SF Pro Rounded',system-ui;font-weight:900;color:#fff;display:inline-block;position:relative;padding-bottom:.18em;letter-spacing:.02em}.logo::after{content:'';position:absolute;left:4%;right:4%;bottom:0;height:.1em;border-radius:1em;background:var(--red)}
.status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 6px;font-weight:600;font-size:17px}
.poster{position:relative;border-radius:4px;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-weight:900;text-transform:uppercase;line-height:1;padding:8px}
.poster span{position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.check{position:absolute;top:6px;right:6px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;box-shadow:0 1px 4px #0008}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff4d;z-index:2}.bar i{display:block;height:100%;background:var(--red)}
.row{margin-top:18px}.row h3{font-size:19px;font-weight:700;margin:0 0 8px 16px}
.scroller{display:flex;gap:8px;padding:0 16px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:6px}
.btn.w{background:#fff;color:#000}.btn.g{background:#ffffff38;color:#fff}.btn.r{background:var(--red);color:#fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:#000;display:flex;justify-content:space-around;padding-top:10px;font-size:10px;color:#8c8c8c;border-top:1px solid #222}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:4px}.tabbar .on{color:#fff}
.ico{width:24px;height:24px;border-radius:5px;background:currentColor;opacity:.9;-webkit-mask-size:contain}
.imdb{display:inline-flex;align-items:center;gap:5px;font-weight:600}.imdb b{background:var(--imdb);color:#000;font-weight:900;font-size:.72em;padding:1px 4px;border-radius:3px}
.avatar{border-radius:8px;display:grid;place-items:center;font-size:44px}
.pill{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid #ffffff40}
.pill.on{background:#fff;color:#000;border-color:#fff}
.live{display:inline-flex;align-items:center;gap:4px;background:#0009;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.prog{height:2px;background:#ffffff4d;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red)}
.caption{position:absolute;left:0;right:0;text-align:center;font-weight:800}
</style></head>
<body>
<div id="app"></div>
<script>
const P = [ // fictieve titels + kleuren
 ["Night Harbor","#0f2027","#2c5364"],["The Last Signal","#3a0a0a","#c0392b"],["Ember Road","#4b1d06","#f39c12"],
 ["Glass Kingdom","#0b3d3a","#16a085"],["Polar Line","#1c2541","#5bc0be"],["Midnight Docket","#1a1a2e","#6c3483"],
 ["Wildfire Season","#421b04","#e67e22"],["Echo Valley","#13311f","#27ae60"],["Paper Moons","#2d1e3e","#a569bd"],
 ["Neon Saints","#2b0233","#ff2e93"],["Cold Harbor","#0d1b2a","#415a77"],["Silent Orbit","#000814","#003566"],
 ["Rust & Bone","#3c1414","#a04000"],["Northbound","#102a43","#486581"],["Kingsgate","#2a1a05","#d4a017"],
 ["Deep Current","#002b36","#268bd2"],["Velvet Hour","#3d0b1f","#c0392b"],["The Orchard","#1e3d14","#7dbb3a"]];
const sym = {play:"▶",info:"ⓘ",plus:"+",check:"✓"};
function poster(i,w,opt={}){const p=P[i%P.length];const h=w*1.5;
 return `<div class="poster" style="width:${w}px;height:${h}px;background:radial-gradient(circle at 30% 20%,${p[2]}cc,transparent 60%),linear-gradient(160deg,${p[2]},${p[1]} 70%);font-size:${w*.13}px">
 <span>${p[0]}</span>${opt.check?'<div class="check">✓</div>':''}${opt.prog?`<div class="bar"><i style="width:${opt.prog}%"></i></div>`:''}${opt.badge?`<div style="position:absolute;bottom:10px;z-index:2;background:var(--red);font-size:9px;padding:2px 5px;border-radius:2px">${opt.badge}</div>`:''}</div>`}
const AV=[["#E50914","#7A0008","📺"],["#2563EB","#1E1B4B","🌐"],["#10B981","#064E3B","⚽"],["#A855F7","#3B0764","👑"],["#F59E0B","#9A3412","🔥"]];
function av(i,s,name,color="#B3B3B3"){const a=AV[i];return `<div style="display:flex;flex-direction:column;align-items:center;gap:${s*.07}px"><div class="avatar" style="border-radius:50%;width:${s}px;height:${s}px;background:linear-gradient(135deg,${a[0]},${a[1]});font-size:${s*.42}px">${a[2]}</div><div style="color:${color};font-size:${s*.13}px">${name}</div></div>`}
function top10(i,k,w){return `<div style="display:flex;align-items:flex-end;flex:none;margin-right:6px"><div style="font-size:${w*1.45}px;font-weight:900;line-height:.78;color:#000;-webkit-text-stroke:${Math.max(2,w/45)}px #8c8c8c;letter-spacing:-.06em;margin-right:-${w*.28}px">${k+1}</div><div style="position:relative;box-shadow:-6px 0 14px #000a">${poster(i,w,{badge:k==1?'Onlangs toegevoegd':null})}<div style="position:absolute;top:5px;left:5px;z-index:3;background:var(--red);border-radius:2px;padding:1px 3px;text-align:center;line-height:.9"><div style="font-size:${w*.055}px;font-weight:900">TOP</div><div style="font-size:${w*.09}px;font-weight:900">10</div></div></div></div>`}
function rowh(t,all=true,fs=19){return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:0 16px 8px"><h3 style="margin:0;font-size:${fs}px">${t}</h3>${all?`<span style="font-size:15px;font-weight:600">Bekijk allemaal</span>`:''}</div>`}
function chlogo(t,c){return `<div style="display:grid;place-items:center;font-weight:900;color:${c};font-size:13px;letter-spacing:-.02em">${t}</div>`}
const CH=[["Nieuws 24","#ff6d00","Avondjournaal","20:00","20:30",.6],["Actua","#00a0e9","Achter het nieuws","21:30","22:15",.2],["Prime One","#e3001b","Showbizz vandaag","20:30","21:30",.35],
 ["Family+","#d50000","Ons dorp","19:30","20:30",.8],["Motor TV","#6a1b9a","Formule 1 · Kwalificatie","20:00","22:00",.4],["Sport 1","#ff7f00","Voetbal Live","20:00","22:00",.45],
 ["Explore","#1565c0","Goudzoekers","20:00","21:00",.55],["Planet","#fbc02d","Wilde natuur","20:30","21:30",.3]];

const screens = {
 // ---------- iOS ----------
 ios_splash:()=>`<div class="screen" style="background:#000">
   ${Array.from({length:15},(_,k)=>{const c=Math.floor(k/3),r=k%3;const w=86*(0.85+((k*37)%25)/100);const x=86*(c+0.5)+((k*53)%20-10);const y=[80,420,760][r]+((k*71)%120)-60;const rot=((k*29)%30)-15;const p=P[k%P.length];
     return `<div class="poster" style="position:absolute;left:${x-w/2}px;top:${y}px;width:${w}px;height:${w*1.5}px;border-radius:8px;transform:rotate(${rot}deg);background:linear-gradient(160deg,${p[2]},${p[1]} 70%);font-size:${w*.13}px;box-shadow:0 6px 14px #0009"><span>${p[0]}</span></div>`}).join('')}
   <div style="position:absolute;inset:0;background:linear-gradient(#0003,#000f 50%,#0003)"></div>
   <div style="position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center">
     <div style="font-family:ui-rounded,'SF Pro Rounded',system-ui;font-weight:900;font-size:78px;letter-spacing:2px;text-shadow:0 0 30px #000">BINGR</div>
     <div style="margin:6px auto 0;width:240px;height:6px;border-radius:6px;background:var(--red)"></div>
   </div></div>`,
 ios_picker:()=>`<div class="screen"><div class="status"><span>20:41</span><span>●●● 5G ▮</span></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px"><div class="logo" style="font-size:26px">BINGR</div><span style="font-weight:600">Beheren</span></div>
   <div style="text-align:center;margin-top:120px;font-size:26px;font-weight:500">Wie kijkt er?</div>
   <div style="display:grid;grid-template-columns:repeat(2,130px);gap:28px 28px;justify-content:center;margin-top:36px">
   ${av(0,130,"Léon")}${av(1,130,"Mama")}${av(2,130,"Kids")}${av(3,130,"Gast")}
   <div style="display:flex;flex-direction:column;align-items:center;gap:9px"><div style="width:130px;height:130px;border:2px solid #b3b3b380;border-radius:50%;display:grid;place-items:center;font-size:48px;color:#b3b3b3;font-weight:200">+</div><div style="color:#b3b3b3;font-size:17px">Toevoegen</div></div></div>
   <div style="position:absolute;bottom:40px;width:100%;text-align:center;color:#b3b3b3aa;font-size:12px">☁︎ iCloud gesynchroniseerd · 20:41</div></div>`,
 ios_home:()=>`<div class="screen"><div style="position:absolute;inset:0 0 auto 0;height:640px;background:radial-gradient(circle at 50% 40%,#c0392b88,#000 75%)"></div>
   <div style="position:relative"><div class="status"><span>20:42</span><span>●●● 5G ▮</span></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 16px"><div class="logo" style="font-size:26px">BINGR</div><div class="avatar" style="width:30px;height:30px;font-size:15px;border-radius:5px;background:linear-gradient(135deg,#E50914,#7A0008)">📺</div></div>
   <div style="display:flex;gap:8px;padding:8px 16px"><span class="pill">Series</span><span class="pill">Films</span><span class="pill">Categorieën ⌄</span></div>
   <div style="margin:14px auto 0;width:300px;height:400px;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 10px 40px #000a;border:1px solid #ffffff20;background:radial-gradient(circle at 35% 25%,#ff5a3c,transparent 55%),linear-gradient(170deg,#c0392b,#3a0a0a 75%)">
     <div style="position:absolute;inset:0;background:linear-gradient(transparent 40%,#000d)"></div>
     <div style="position:absolute;bottom:16px;left:16px;right:16px;text-align:center">
       <div style="font-weight:900;font-size:34px;letter-spacing:1px">THE LAST SIGNAL</div>
       <div style="font-size:12px;opacity:.85;margin:8px 0 12px">2026 • Thriller • Sci-Fi • 2u 4m</div>
       <div style="display:flex;gap:10px"><div class="btn w" style="flex:1;padding:10px">▶ Afspelen</div><div class="btn g" style="flex:1;padding:10px">ⓘ Info</div></div></div></div>
   <div class="row">${rowh('Onlangs toegevoegd')}<div class="scroller">${[13,14,15,16].map(i=>poster(i,112)).join('')}</div></div>
   <div class="row">${rowh('Verder kijken',false)}<div class="scroller">${[4,8,2,11].map((i,k)=>poster(i,112,{prog:[62,25,80,40][k]})).join('')}</div></div>
   <div class="row">${rowh('Voor jou')}<div class="scroller">${[3,9,12,6].map((i,k)=>poster(i,112,{badge:k%2?'SERIE':'FILM'})).join('')}</div></div>
   <div class="row">${rowh('Top 10 series vandaag')}<div class="scroller">${[7,10,1].map((i,k)=>top10(i,k,118)).join('')}</div></div>
   </div>
   <div class="tabbar">${["Home","Live TV","Films","Series","Zoeken","Mijn Bingr"].map((t,i)=>`<div class="${i==0?'on':''}"><span style="font-size:22px">${["⌂","◉","▤","▦","⌕","◯"][i]}</span>${t}</div>`).join('')}</div></div>`,
 ios_detail:()=>`<div class="screen" style="background:#000;overflow:hidden">
   <div style="position:relative;height:560px;background:radial-gradient(circle at 50% 30%,#1abc9c,transparent 60%),linear-gradient(170deg,#16a085,#0b3d3a 70%)">
     <div style="position:absolute;inset:0;background:linear-gradient(transparent 35%,#000a 75%,#000)"></div>
     <div class="status" style="position:relative"><span>20:43</span><span>●●● 5G ▮</span></div>
     <div style="position:absolute;top:58px;right:16px;width:44px;height:44px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(10px);display:grid;place-items:center;font-size:18px">✕</div>
     <div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;font-weight:900;font-size:46px;letter-spacing:1px">GLASS<br>KINGDOM</div>
   </div>
   <div style="padding:6px 16px 0">
     <div style="display:flex;justify-content:center;gap:14px;align-items:center;font-size:16px"><span style="background:#ffffff26;border-radius:10px;padding:6px 12px;font-weight:700">★ 8.4</span>2024<span>3 seizoenen</span></div>
     <div style="margin-top:18px;background:#fff;color:#000;border-radius:999px;height:52px;display:grid;place-items:center;font-weight:600;font-size:16px">▶ Speel seizoen 2: aflevering 4</div>
     <div style="display:flex;gap:12px;margin-top:12px">${["♥","🎬"].map(x=>`<div style="width:50px;height:50px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-size:19px;${x=='♥'?'color:var(--red)':''}">${x}</div>`).join('')}<div style="flex:1;height:50px;border-radius:999px;background:#ffffff1f;display:grid;place-items:center;font-size:15px">Andere bronnen</div></div>
     <p style="font-size:16px;line-height:1.4;margin:20px 0;opacity:.92">Een architect ontdekt dat de glazen stad die ze ontwierp een geheim verbergt dat haar familie al generaties bewaakt.</p>
     <div style="color:#b3b3b3;font-size:14px;font-weight:600;letter-spacing:.5px">AFLEVERINGEN</div>
     <div style="display:inline-block;margin:12px 0;background:#ffffff1f;border-radius:999px;padding:10px 16px;font-weight:600">Seizoen 2 ⌄</div>
     <div style="display:flex;gap:14px">${[["De fundering","Mara keert terug naar de stad en vindt een verborgen kamer onder het atrium."],["Breuklijnen","Het eerste glas barst. Tom ontdekt wie de bouw sabo..."]].map((e,i)=>`<div style="width:290px;flex:none;background:#ffffff0f;border-radius:14px;padding-bottom:8px">
       <div style="height:163px;border-radius:12px;position:relative;background:linear-gradient(135deg,${P[i+3][2]},${P[i+3][1]})">${i==0?'<div class="check" style="width:22px;height:22px;top:8px;right:8px">✓</div><div style="position:absolute;left:16px;right:16px;bottom:12px;height:5px;border-radius:5px;background:#fff"></div>':'<div style="position:absolute;left:16px;right:16px;bottom:12px;height:5px;border-radius:5px;background:#ffffff4d"><div style="width:35%;height:100%;background:#fff;border-radius:5px"></div></div>'}</div>
       <div style="padding:6px 4px 0"><div style="color:#b3b3b3;font-size:13px">S02E0${i+1}</div><div style="font-weight:600">${e[0]}</div><div style="color:#b3b3b3;font-size:13px;line-height:1.3;margin-top:2px">${e[1]}</div><div style="font-size:12px;opacity:.8;margin-top:4px">${3+i*7} februari 2026 · 4${8+i} min</div></div></div>`).join('')}</div>
   </div></div>`,
 ios_detail2:()=>`<div class="screen" style="background:#000">
   <div style="height:106px;background:#1e1e1ecc;backdrop-filter:blur(20px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;font-weight:600;font-size:17px;position:relative">Glass Kingdom<div style="position:absolute;right:16px;bottom:6px;width:44px;height:44px;border-radius:50%;background:#ffffff26;display:grid;place-items:center">✕</div></div>
   <div style="padding:22px 16px 0">
     <div style="color:#b3b3b3;font-size:14px;font-weight:600;letter-spacing:.5px">BEOORDELINGEN</div>
     <div style="display:flex;gap:40px;margin-top:12px">${[["<b style='background:var(--imdb);color:#000;font-size:9px;padding:2px 4px;border-radius:3px'>IMDb</b>","IMDb","8.4"],["<span style='color:#ED1C24'>☑</span>","Trakt","84%"]].map(r=>`<div><div style="display:flex;gap:6px;align-items:center;color:#b3b3b3">${r[0]} ${r[1]}</div><div style="font-size:22px;font-weight:700;margin-top:4px">${r[2]}</div></div>`).join('')}</div>
     <div style="color:#b3b3b3;font-size:14px;font-weight:600;letter-spacing:.5px;margin-top:34px">CAST</div>
     <div style="display:grid;grid-template-rows:76px 76px;grid-auto-flow:column;gap:14px 26px;margin-top:12px">${[["Mara Ellis","Ilse Verbeek"],["Tom Verhaeg","Joris Smit"],["Ines Kole","Lotte de Wit"],["Ruud Bos","Commissaris"]].map((c,i)=>`<div style="display:flex;align-items:center;gap:12px;width:250px"><div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,${P[i+5][2]},${P[i+5][1]});display:grid;place-items:center;font-weight:700;color:#fff8">${c[0].split(' ').map(x=>x[0]).join('')}</div><div><div style="font-size:16px">${c[0]}</div><div style="color:#b3b3b3;font-size:14px">${c[1]}</div></div></div>`).join('')}</div>
     <div style="color:#b3b3b3;font-size:14px;font-weight:600;letter-spacing:.5px;margin-top:34px">AANBEVELINGEN</div>
     <div style="display:flex;gap:14px;margin-top:12px">${[0,4,10].map(i=>`<div><div class="poster" style="width:160px;height:240px;border-radius:12px;background:linear-gradient(160deg,${P[i][2]},${P[i][1]} 70%);font-size:20px"><span>${P[i][0]}</span></div><div style="margin-top:6px;font-size:14px">${P[i][0]}</div></div>`).join('')}</div>
   </div></div>`,
 ios_live:()=>`<div class="screen"><div class="status"><span>20:44</span><span>●●● 5G ▮</span></div>
   <div style="font-size:34px;font-weight:800;padding:8px 16px">Live TV</div>
   <div style="margin:4px 16px;background:#1c1c1e;border-radius:10px;padding:9px 12px;color:#8e8e93;font-size:16px">⌕ Zender zoeken</div>
   <div style="display:flex;gap:8px;padding:10px 16px;overflow:hidden">${["★ Favorieten","◷ Recent","Alle zenders","NL","Sport","Docu"].map((g,i)=>`<span class="pill ${i==0?'on':''}" style="${i?'background:#232323':''};white-space:nowrap">${g}</span>`).join('')}</div>
   ${CH.slice(0,7).map((c,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 16px">
     <div style="width:34px;text-align:right;color:#b3b3b3;font-size:12px;font-weight:600">${i+1}</div>
     <div style="width:64px;height:40px;border-radius:4px;background:#181818;display:grid;place-items:center">${chlogo(c[0],c[1])}</div>
     <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px">${c[0]} <span style="color:var(--imdb);font-size:10px">★</span></div>
     <div style="font-size:12px;opacity:.8;margin:2px 0 3px">${c[3]}  ${c[2]}</div><div class="prog" style="width:220px"><i style="width:${c[5]*100}%"></i></div>
     <div style="font-size:11px;color:#b3b3b3;margin-top:3px">Straks ${c[4]}  ${["Sportjournaal","Talkshow","Soap","Showbizz","Nieuws","Studio Voetbal","IJszee"][i]}</div></div></div>`).join('')}
   <div class="tabbar">${["Home","Live TV","Films","Series","Zoeken","Mijn Bingr"].map((t,i)=>`<div class="${i==1?'on':''}"><span style="font-size:22px">${["⌂","◉","▤","▦","⌕","◯"][i]}</span>${t}</div>`).join('')}</div></div>`,
 ios_add:()=>`<div class="screen" style="background:#000"><div style="position:absolute;inset:60px 0 0 0;background:#141414;border-radius:14px 14px 0 0">
   <div style="display:flex;justify-content:space-between;padding:16px;font-size:17px"><span style="color:var(--red)">Annuleer</span><b>Afspeellijst toevoegen</b><span style="width:60px"></span></div>
   <div style="display:flex;justify-content:center;margin:6px 0 14px">${av(3,96,"Gast","#B3B3B3")}</div>
   <div style="padding:0 16px">
   <div style="color:#b3b3b3;font-weight:600;font-size:14px;margin:0 0 8px 14px">Kies het type afspeellijst</div>
