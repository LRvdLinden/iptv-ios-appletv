<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--red:#E50914;--bg:#000;--card:#181818;--el:#232323;--sec:#B3B3B3;--imdb:#F5C518;--green:#46D369}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;overflow:hidden}
.screen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
.logo{font-weight:900;letter-spacing:-.04em;background:linear-gradient(#FF3B3B,#E50914 55%,#8F050C);-webkit-background-clip:text;color:transparent;transform:scaleY(1.12);display:inline-block;filter:drop-shadow(0 0 12px rgba(229,9,20,.45))}
.status{height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 32px 6px;font-weight:600;font-size:17px}
.poster{position:relative;border-radius:4px;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-weight:900;text-transform:uppercase;line-height:1;padding:8px}
.poster span{position:relative;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.7))}
.check{position:absolute;top:6px;right:6px;z-index:2;width:20px;height:20px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;box-shadow:0 1px 4px #0008}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff4d;z-index:2}.bar i{display:block;height:100%;background:var(--red)}
.row{margin-top:18px}.row h3{font-size:19px;font-weight:700;margin:0 0 8px 16px}
.scroller{display:flex;gap:8px;padding:0 16px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:6px}
.btn.w{background:#fff;color:#000}.btn.g{background:#ffffff38;color:#fff}.btn.r{background:var(--red);color:#fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;background:#000;display:flex;justify-content:space-around;padding-top:10px;font-size:10px;color:#8c8c8c;border-top:1px solid #222}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:4px}.tabbar .on{color:#fff}
.ico{width:24px;height:24px;border-radius:5px;background:currentColor;opacity:.9;-webkit-mask-size:contain}
.imdb{display:inline-flex;align-items:center;gap:5px;font-weight:600}.imdb b{background:var(--imdb);color:#000;font-weight:900;font-size:.72em;padding:1px 4px;border-radius:3px}
.avatar{border-radius:8px;display:grid;place-items:center;font-size:44px}
.pill{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid #ffffff40}
.pill.on{background:#fff;color:#000;border-color:#fff}
.live{display:inline-flex;align-items:center;gap:4px;background:#0009;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.prog{height:2px;background:#ffffff4d;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red)}
.caption{position:absolute;left:0;right:0;text-align:center;font-weight:800}
</style></head>
<body>
<div id="app"></div>
<script>
const P = [ // fictieve titels + kleuren
 ["Night Harbor","#0f2027","#2c5364"],["The Last Signal","#3a0a0a","#c0392b"],["Ember Road","#4b1d06","#f39c12"],
 ["Glass Kingdom","#0b3d3a","#16a085"],["Polar Line","#1c2541","#5bc0be"],["Midnight Docket","#1a1a2e","#6c3483"],
 ["Wildfire Season","#421b04","#e67e22"],["Echo Valley","#13311f","#27ae60"],["Paper Moons","#2d1e3e","#a569bd"],
 ["Neon Saints","#2b0233","#ff2e93"],["Cold Harbor","#0d1b2a","#415a77"],["Silent Orbit","#000814","#003566"],

 ["Deep Current","#002b36","#268bd2"],["Velvet Hour","#3d0b1f","#c0392b"],["The Orchard","#1e3d14","#7dbb3a"]];
const sym = {play:"▶",info:"ⓘ",plus:"+",check:"✓"};
function poster(i,w,opt={}){const p=P[i%P.length];const h=w*1.5;
 return `<div class="poster" style="width:${w}px;height:${h}px;background:radial-gradient(circle at 30% 20%,${p[2]}cc,transparent 60%),linear-gradient(160deg,${p[2]},${p[1]} 70%);font-size:${w*.13}px">

function av(i,s,name,color="#B3B3B3"){const a=AV[i];return `<div style="display:flex;flex-direction:column;align-items:center;gap:${s*.07}px"><div class="avatar" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,${a[0]},${a[1]});font-size:${s*.42}px">${a[2]}</div><div style="color:${color};font-size:${s*.13}px">${name}</div></div>`}
