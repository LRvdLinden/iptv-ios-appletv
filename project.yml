name: Bingr
options:
  bundleIdPrefix: nl.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "146"
    # Team van Léon van der Linden; automatisch ondertekenen voor iOS, tvOS en macOS
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic

packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  Bingr:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: VLCKitSPM
      # Live Activity voor downloads (build 52)
      - target: BingrWidgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        # alleen standaardversleuteling (HTTPS): geen exportvragen bij elke upload naar App Store Connect / TestFlight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        # downloads: voortgang op het toegangsscherm en in het Dynamic Island (build 52)
        NSSupportsLiveActivities: true
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # IPTV-servers draaien vaak op http://
          # build 141: eigen diensten altijd via HTTPS (volledige ATS); de uitzondering hierboven blijft alleen voor IPTV
          NSExceptionDomains:
            bingr.online: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            supabase.co: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            trakt.tv: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            themoviedb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            tmdb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            opensubtitles.com: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        LSApplicationQueriesSchemes: [youtube]
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        # build 120: bingr://title?… (fallbackknop op bingr.online/titel/) en de deeplinks van pushmeldingen
        CFBundleURLTypes:
          - CFBundleURLName: nl.lrvdlinden.bingr
            CFBundleURLSchemes: [bingr]
        UIFileSharingEnabled: false
        # extern scherm (HDMI/AirPlay-schermdeling): eigen scene met alleen het beeld, de bediening blijft op het toestel
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: ExternalDisplaySceneDelegate
    entitlements:
      path: iOS/Bingr.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
        # pushmeldingen (docs/PUSH.md): "development" bij bouwen/archiveren met het ontwikkelprofiel; Xcode zet dit bij
        # het exporteren voor TestFlight/App Store vanzelf op "production" (uit het distributieprofiel). De app leest de
        # echte omgeving uit het ingebedde profiel (PushService.sandbox) en meldt die aan de server.
        aps-environment: development
        # build 120: universele links uit e-mails van Bingr (https://bingr.online/titel/…; apple-app-site-association
        # op bingr.online)
        com.apple.developer.associated-domains: [applinks:bingr.online]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO   # de Mac heeft een eigen app (BingrMac)
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO    # geen Apple Vision Pro (build 54)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # alternatieve app-iconen (build 52, gemaakt met tools/make_icons.py)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark AppIcon-Light AppIcon-Blue AppIcon-Gold"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  # Widget-extensie (build 52): Live Activity met de voortgang van downloads op iPhone en iPad
  BingrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BingrWidgets
      - path: iOS/Downloads/DownloadActivityAttributes.swift
    info:
      path: BingrWidgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  BingrTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: tvOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        # alleen standaardversleuteling (HTTPS): geen exportvragen bij elke upload naar App Store Connect / TestFlight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          # build 141: eigen diensten altijd via HTTPS (volledige ATS); de uitzondering hierboven blijft alleen voor IPTV
          NSExceptionDomains:
            bingr.online: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            supabase.co: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            trakt.tv: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            themoviedb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            tmdb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            opensubtitles.com: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
        LSApplicationQueriesSchemes: [youtube]
        # build 143: servers op het lokale netwerk (LAN-IP, .local) op een echte Apple TV
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        # build 120: bingr://title?… (fallbackknop op bingr.online/titel/) en de deeplinks van pushmeldingen
        CFBundleURLTypes:
          - CFBundleURLName: nl.lrvdlinden.bingr
            CFBundleURLSchemes: [bingr]
    entitlements:
      path: tvOS/BingrTV.entitlements
      properties:
        # zelfde identifier als iOS => playlists, kijkvoortgang en favorieten worden via iCloud gedeeld
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
        # elke Apple TV-gebruiker zijn eigen Bingr (eigen iCloud: playlists, voortgang, Trakt)
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  BingrMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        CFBundleName: Bingr
        # alleen standaardversleuteling (HTTPS): geen exportvragen bij elke upload naar App Store Connect / TestFlight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # IPTV-servers draaien vaak op http://
          # build 141: eigen diensten altijd via HTTPS (volledige ATS); de uitzondering hierboven blijft alleen voor IPTV
          NSExceptionDomains:
            bingr.online: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            supabase.co: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            trakt.tv: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            themoviedb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            tmdb.org: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
            opensubtitles.com: {NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: false}
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp, _smb._tcp]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        # build 120: bingr://title?… (fallbackknop op bingr.online/titel/) en de deeplinks van pushmeldingen
        CFBundleURLTypes:
          - CFBundleURLName: nl.lrvdlinden.bingr
            CFBundleURLSchemes: [bingr]
        NSHumanReadableCopyright: "© 2026 Bingr"
    entitlements:
      path: macOS/BingrMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        # zelfde iCloud-opslag als iPhone, iPad en Apple TV
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
        # pushmeldingen (docs/PUSH.md), native macOS-sleutel; net als op iOS zet het exporteren voor de App Store
        # dit op "production"
        com.apple.developer.aps-environment: development
        # build 120: universele links uit e-mails van Bingr (https://bingr.online/titel/…)
        com.apple.developer.associated-domains: [applinks:bingr.online]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        PRODUCT_NAME: Bingr
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # nodig voor de bouwstap hieronder (die past de gebouwde app aan)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # build 109: ITMS-91109 - macOS-apps voor TestFlight/App Store mogen geen bestanden met het kenmerk
      # com.apple.quarantine bevatten. Dat kenmerk zet macOS op alles uit een gedownloade zip (bv. het Xcode-project
      # uit het beheer) en Xcode kopieert het mee. Hier gaan alle uitgebreide kenmerken eraf, vóór het ondertekenen.
      - name: Quarantaine-kenmerken verwijderen
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null || true
          if xattr -lr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" 2>/dev/null | grep -q com.apple.quarantine; then
            echo "error: er staan nog bestanden met com.apple.quarantine in de app (ITMS-91109)"; exit 1
          fi
