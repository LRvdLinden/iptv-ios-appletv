name: Bingr
options:
  bundleIdPrefix: nl.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: ""   # vul je eigen Team ID in (of kies in Xcode)

packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  Bingr:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Bingr
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # IPTV-servers draaien vaak op http://
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        LSApplicationQueriesSchemes: [youtube]
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        UIFileSharingEnabled: false
    entitlements:
      path: iOS/Bingr.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BingrTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: tvOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleDisplayName: Bingr
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [youtube]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
    entitlements:
      path: tvOS/BingrTV.entitlements
      properties:
        # zelfde identifier als iOS => playlists, kijkvoortgang en favorieten worden via iCloud gedeeld
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
