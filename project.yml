name: Bingr
options:
  bundleIdPrefix: nl.lrvdlinden
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "42"
    DEVELOPMENT_TEAM: ""   # vul je eigen Team ID in (of kies in Xcode)

packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  Bingr:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # IPTV-servers draaien vaak op http://
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        LSApplicationQueriesSchemes: [youtube]
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        UIFileSharingEnabled: false
    entitlements:
      path: iOS/Bingr.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO   # de Mac heeft een eigen app (BingrMac)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BingrTV:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: tvOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: tvOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        LSApplicationCategoryType: public.app-category.entertainment
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [youtube]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
    entitlements:
      path: tvOS/BingrTV.entitlements
      properties:
        # zelfde identifier als iOS => playlists, kijkvoortgang en favorieten worden via iCloud gedeeld
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
        # elke Apple TV-gebruiker zijn eigen Bingr (eigen iCloud: playlists, voortgang, Trakt)
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  BingrMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: VLCKitSPM
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Bingr
        CFBundleName: Bingr
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # IPTV-servers draaien vaak op http://
        NSLocalNetworkUsageDescription: Bingr gebruikt het lokale netwerk om streams van je eigen server af te spelen.
        NSBonjourServices: [_googlecast._tcp, _CC1AD845._googlecast._tcp, _smb._tcp]
        CFBundleLocalizations: [en, nl, de, fr, es, it, pt, tr, pl, ar, zh-Hans]
        CFBundleDevelopmentRegion: en
        NSHumanReadableCopyright: © Léon van der Linden
    entitlements:
      path: macOS/BingrMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.photos-library: true
        # zelfde iCloud-opslag als iPhone, iPad en Apple TV
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)nl.lrvdlinden.bingr
        keychain-access-groups: [$(AppIdentifierPrefix)nl.lrvdlinden.bingr.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingr
        PRODUCT_NAME: Bingr
        INFOPLIST_KEY_CFBundleDisplayName: Bingr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
